name: Build Nancy AI Assistant APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check web files
        run: |
          for f in index.html sw.js manifest.webmanifest icon-512.png; do
            test -f "$f" || { echo "MISSING FILE: $f"; exit 1; }
          done

      - name: Create Capacitor project in cap/
        run: |
          mkdir -p cap/www
          cp index.html sw.js manifest.webmanifest icon-*.png cap/www/
          cd cap
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.nancyai.assistant","appName":"Nancy AI Assistant","webDir":"www","server":{"androidScheme":"https"},"android":{"allowMixedContent":false}}
          EOF
          npx cap add android
          npx cap sync android

      - name: Permissions, name, icon
        working-directory: cap
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          S=android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Nancy AI Assistant</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Nancy AI Assistant</string>#' $S
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp ../icon-512.png $d/ic_launcher.png
            cp ../icon-512.png $d/ic_launcher_round.png
            cp ../icon-512.png $d/ic_launcher_foreground.png
          done

      - name: Build APK
        working-directory: cap/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename APK
        run: cp cap/android/app/build/outputs/apk/debug/app-debug.apk Nancy-AI-Assistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nancy-AI-Assistant-apk
          path: Nancy-AI-Assistant.apk

      - name: Attach to release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: Nancy-AI-Assistant.apk
