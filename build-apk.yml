name: Build Nancy AI Assistant APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web app into www
        run: |
          mkdir -p www
          cp index.html sw.js manifest.webmanifest icon-*.png www/

      - name: Install Capacitor and add Android
        run: |
          cat > package.json <<'EOF'
          {"name":"nancy-ai-assistant","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.1.2","@capacitor/cli":"^6.1.2","@capacitor/core":"^6.1.2"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.nancyai.assistant","appName":"Nancy AI Assistant","webDir":"www","server":{"androidScheme":"https"},"android":{"allowMixedContent":false}}
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M

      - name: App name
        run: |
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Nancy AI Assistant</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Nancy AI Assistant</string>#' android/app/src/main/res/values/strings.xml

      - name: App icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp icon-512.png $d/ic_launcher.png
            cp icon-512.png $d/ic_launcher_round.png
            cp icon-512.png $d/ic_launcher_foreground.png
          done

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Nancy-AI-Assistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Nancy-AI-Assistant-apk
          path: Nancy-AI-Assistant.apk

      - name: Attach to release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: Nancy-AI-Assistant.apk
