/* =====================================================
   2) HEALTH MONITORING + 3) ALERTS + 4) HISTORY (simulated data)
   (ultrasonic/distance ab Object Detection (AI) section me dikhta hai)
===================================================== */
const sensors = {
  ultrasonic:  { label:'Distance', value:null, unit:'cm' },
  heartRate:   { label:'Heart Rate', value:null, unit:'bpm', min:60, max:100 },
  ecg:         { label:'ECG', value:null, unit:'mV', min:0.5, max:1.5 },
  temperature: { label:'Body Temp', value:null, unit:'°C',  min:36.0, max:37.5 },
  gas:         { label:'Gas / Air Quality', value:null, unit:'ppm', min:0, max:50 },
};
// Graph ke liye har sensor ke time-series points (Health AI page)
const sensorSeries = { heartRate:[], ecg:[], temperature:[], gas:[], ultrasonic:[] };
const SERIES_MAX = 400;
function recordSensorPoint(key, v){
  const a = sensorSeries[key];
  if(!a) return;
  a.push({ t: Date.now(), v });
  if(a.length > SERIES_MAX) a.splice(0, a.length - SERIES_MAX);
}
let sensorHistory = [];      // {time, sensor, label, value, unit, abnormal}
let sensorSimInterval = null;
const activeAlerts = new Set();

function randRange(min, max, decimals){
  const v = Math.random() * (max - min) + min;
  return decimals ? +v.toFixed(decimals) : Math.round(v);
}

let lastSensorDataAt = 0;
const SENSOR_STALE_MS = 30000; // 30 sec se data nahi aaya to reading clear (pehle 10s tha — slow boards ki reading ud jaati thi)

function isSensorConnected(){
  return !!(controllerStatus.bluetooth || controllerStatus.wifiEsp32 || controllerStatus.wifiNodemcu || controllerStatus.serial);
}

function isRealDataLive(){
  return !!(controllerStatus.bluetooth || controllerStatus.wifiEsp32 || controllerStatus.wifiNodemcu || controllerStatus.serial);
}

function onSensorConnectionChanged(){
  if(isSensorConnected()) startSensorSimulation(); // FIX: stale-data checker connect hote hi chalu
  if(!isSensorConnected()){
    // Disconnect hote hi sab readings clear — koi galat/fake value na dikhe
    Object.values(sensors).forEach(s => s.value = null);
    Object.values(sensorSeries).forEach(a => { a.length = 0; });
    activeAlerts.clear();
    alertBanner.classList.remove('show');
    if(ultrasonicNarrationOn){
      stopUltrasonicNarration();
      addMsg("Sensor disconnect ho gaya, isliye ultrasonic voice alert bhi band kar diya.", 'bot');
    }
  }
  if(['sensors','history','alert','lcd'].includes(currentPanel)) renderPanel(currentPanel);
  if(currentPanel === 'objdepth') updateObjDepthDistanceDisplay();
}

function startSensorSimulation(){
  if(sensorSimInterval) return;
  sensorSimInterval = setInterval(() => {
    if(!isSensorConnected()){
      Object.values(sensors).forEach(s => s.value = null);
      return; // connect nahi hai, to koi reading generate nahi karni — N/A hi rahegi
    }
    if(isRealDataLive()){
      // FIX: board data bhejna band kare to purani value live jaisi na dikhe
      if(lastSensorDataAt && Date.now() - lastSensorDataAt > SENSOR_STALE_MS){
        Object.values(sensors).forEach(s => s.value = null);
        lastSensorDataAt = 0;
        if(['sensors','alert'].includes(currentPanel)) renderPanel(currentPanel);
        if(currentPanel === 'objdepth') updateObjDepthDistanceDisplay();
      }
      return; // Bluetooth/ESP32/NodeMCU se real data aa raha hai, fake random mat bharo
    }
    sensors.ultrasonic.value  = randRange(20, 400, 0);
    sensors.heartRate.value   = randRange(55, 112, 0);
    sensors.ecg.value         = randRange(0.3, 1.8, 2);
    sensors.temperature.value = randRange(35.8, 38.2, 1);
    sensors.gas.value         = randRange(0, 80, 0);
    logAndCheck();
    if(currentPanel === 'sensors' || currentPanel === 'alert' || currentPanel === 'lcd' || (currentPanel === 'activity' && currentActivityTab === 'sensor')){
      renderPanel(currentPanel);
    }
    if(currentPanel === 'objdepth') updateObjDepthDistanceDisplay();
  }, 2000);
}

function logAndCheck(){
  if(!isSensorConnected()) return; // disconnected state ka data history/alert me nahi jaayega
  const time = new Date().toLocaleTimeString('en-IN');
  Object.entries(sensors).forEach(([key, s]) => {
    if(s.min === undefined) return; // ultrasonic has no "normal range" abnormality
    if(s.value === null || s.value === undefined || !Number.isFinite(Number(s.value))) return; // FIX: reading nahi aayi to false alert nahi
    const abnormal = s.value < s.min || s.value > s.max;
    sensorHistory.push({ time, key, label:s.label, value:s.value, unit:s.unit, abnormal });
    if(abnormal && !activeAlerts.has(key)){
      activeAlerts.add(key);
      triggerAlert(`${s.label} abnormal hai: ${+Number(s.value).toFixed(2)}${s.unit} (normal range ${s.min}-${s.max}${s.unit})`);
    } else if(!abnormal && activeAlerts.has(key)){
      activeAlerts.delete(key);
    }
  });
  if(sensorHistory.length > 60) sensorHistory = sensorHistory.slice(-60);
}

const alertBanner = document.getElementById('alertBanner');
const alertText = document.getElementById('alertText');
function triggerAlert(msg){
  alertText.textContent = msg;
  alertBanner.classList.add('show');

function buildSensorLcdText(connected){
  const time = new Date().toLocaleTimeString('en-IN');

}

const HEALTH_ORDER = ['heartRate', 'ecg', 'temperature', 'gas', 'ultrasonic'];
const HEALTH_META = {
  heartRate:   { icon:'❤️', dec:0, graph:true,  win:60  },
  ecg:         { icon:'📈', dec:2, graph:true,  win:250 },
  temperature: { icon:'🌡️', dec:1, graph:false },
  gas:         { icon:'💨', dec:0, graph:false },
  ultrasonic:  { icon:'📏', dec:0, graph:false },
};

function hpFmt(key, v){
  if(v === null || v === undefined || !Number.isFinite(Number(v))) return '--';
  return Number(v).toFixed(HEALTH_META[key].dec);
}
function hpStatusOf(key, v){
  const s = sensors[key];
  if(!isSensorConnected()) return { cls:'', text:'Not connected' };
  if(v === null || v === undefined) return { cls:'', text:'No data' };
  if(s.min !== undefined && (v < s.min || v > s.max)) return { cls:'bad', text:'ABNORMAL' };
  return { cls:'ok', text: s.min !== undefined ? 'Normal' : 'Live' };
}
function hpStats(key){
  const arr = sensorSeries[key] || [];
  if(!arr.length) return null;
  let lo = Infinity, hi = -Infinity, sum = 0;
  arr.forEach(p => { if(p.v < lo) lo = p.v; if(p.v > hi) hi = p.v; sum += p.v; });
  return { lo, hi, avg: sum / arr.length, n: arr.length };
}

function drawHealthChart(canvas, pts, key){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if(!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  if(canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement);
  const accent = cs.getPropertyValue('--accent').trim() || '#3ee6c4';
  const dim = cs.getPropertyValue('--dim').trim() || '#8a9aa8';
  const lineC = cs.getPropertyValue('--line').trim() || '#24303c';
  const s = sensors[key];
  if(pts.length < 2){
    ctx.fillStyle = dim; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Graph ke liye data aane ka intezaar...', w / 2, h / 2);
    return;
  }
  const padL = 40, padR = 10, padT = 12, padB = 12;
  const vals = pts.map(p => p.v);
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if(s.min !== undefined){ lo = Math.min(lo, s.min); hi = Math.max(hi, s.max); }
  if(hi - lo < 1e-6){ hi += 1; lo -= 1; }
  const span = hi - lo; lo -= span * 0.08; hi += span * 0.08;
  const X = i => padL + (i / (pts.length - 1)) * (w - padL - padR);
  const Y = v => padT + ((hi - v) / (hi - lo)) * (h - padT - padB);
  // grid + y labels
  ctx.font = '10px monospace'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for(let g = 0; g <= 4; g++){
    const val = lo + (g / 4) * (hi - lo), y = Y(val);
    ctx.strokeStyle = lineC; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = dim;
    ctx.fillText(HEALTH_META[key].dec ? val.toFixed(2) : Math.round(val), padL - 5, y);
  }
  // normal range band
  if(s.min !== undefined){
    const yTop = Y(s.max), yBot = Y(s.min);
    ctx.fillStyle = 'rgba(62,230,196,0.08)';
    ctx.fillRect(padL, yTop, w - padL - padR, yBot - yTop);
    ctx.strokeStyle = 'rgba(62,230,196,0.35)'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(padL, yTop); ctx.lineTo(w - padR, yTop);
    ctx.moveTo(padL, yBot); ctx.lineTo(w - padR, yBot); ctx.stroke();
    ctx.setLineDash([]);
  }
  // line
  ctx.strokeStyle = accent; ctx.lineWidth = key === 'ecg' ? 1.6 : 2.2;
  ctx.lineJoin = 'round'; ctx.beginPath();
  pts.forEach((p, i) => { i ? ctx.lineTo(X(i), Y(p.v)) : ctx.moveTo(X(i), Y(p.v)); });
  ctx.stroke();
  // abnormal points (red) — sirf kam points par, taaki ECG waveform saaf rahe
  if(s.min !== undefined && pts.length <= 120){
    ctx.fillStyle = '#ff8a8a';
    pts.forEach((p, i) => {
      if(p.v < s.min || p.v > s.max){ ctx.beginPath(); ctx.arc(X(i), Y(p.v), 3, 0, Math.PI * 2); ctx.fill(); }
    });
  }
  // latest point
  const lp = pts[pts.length - 1];
  ctx.fillStyle = accent; ctx.beginPath(); ctx.arc(X(pts.length - 1), Y(lp.v), 4, 0, Math.PI * 2); ctx.fill();
}

/* =====================================================
   OBJECT DETECTION (AI) — TensorFlow.js + COCO-SSD
   Camera Start -> AI Model -> Object Detection
   -> Distance sensor ke saath combine -> voice
===================================================== */
let visionModel = null;
let visionModelLoading = false;
let visionStream = null;
let visionDetectTimer = null;
let lastDetections = []; // [{class, score, bbox, trackId?}]
/* ---- Simple ByteTrack-style multi-object tracker (IoU + class match) ---- */
let trackNextId = 1;
let activeTracks = []; // {id, class, bbox, score, age, hits, timeSinceUpdate}
const TRACK_IOU_THRESH = 0.25; // FIX: 0.3 -> 0.25 (soft matching, track na toote)
const TRACK_MAX_AGE = 12; // FIX: 8 -> 12 (thodi der miss par bhi track zinda)

function bboxIou(a, b){
  // a,b = [x,y,w,h]
  const ax2 = a[0]+a[2], ay2 = a[1]+a[3];
  const bx2 = b[0]+b[2], by2 = b[1]+b[3];
  const ix1 = Math.max(a[0], b[0]), iy1 = Math.max(a[1], b[1]);
  const ix2 = Math.min(ax2, bx2), iy2 = Math.min(ay2, by2);
  const iw = Math.max(0, ix2-ix1), ih = Math.max(0, iy2-iy1);
  const inter = iw*ih;
  const uni = a[2]*a[3] + b[2]*b[3] - inter;
  return uni > 0 ? inter/uni : 0;
}

function updateTracks(dets){
  // dets: [{class, score, bbox}]
  activeTracks.forEach(t => { t.timeSinceUpdate++; });
  const matchedDet = new Set();
  const matchedTrack = new Set();
  // Greedy match by IoU only — NOT by class. A real object occasionally
  // gets a different label for one frame (bottle vs vase, cup vs bowl);
  // requiring the class to match every frame fragments that into two
  // tracks that both die at hit=1 and never confirm. Matching purely on
  // spatial overlap keeps it as ONE continuous track; the class itself is
  // then decided by majority vote below, which absorbs the odd bad frame.
  const pairs = [];
  activeTracks.forEach((t, ti) => {
    dets.forEach((d, di) => {
      const iou = bboxIou(t.bbox, d.bbox);
      if(iou >= TRACK_IOU_THRESH) pairs.push({ti, di, iou});
    });
  });
  pairs.sort((a,b) => b.iou - a.iou);
  pairs.forEach(p => {
    if(matchedTrack.has(p.ti) || matchedDet.has(p.di)) return;
    matchedTrack.add(p.ti);
    matchedDet.add(p.di);
    const t = activeTracks[p.ti];
    const d = dets[p.di];
    // FIX: bbox EMA (55% naya + 45% purana) — boxes smooth move karte hain, jump nahi
    if(t.hits > 0 && t.bbox){
      const ob = t.bbox, nb = d.bbox;
      t.bbox = [ob[0]*0.45 + nb[0]*0.55, ob[1]*0.45 + nb[1]*0.55, ob[2]*0.45 + nb[2]*0.55, ob[3]*0.45 + nb[3]*0.55];
    } else { t.bbox = d.bbox; }
    d.bbox = t.bbox.slice();
    // Smooth the confidence with an EMA instead of just taking the latest
    // frame's raw score — a single frame's score can wobble ±10-15% even on
    // a real, correctly-classified object; averaging gives a steadier,
    // more trustworthy number when it's reported/spoken to the user.
    t.score = (t.hits > 0) ? (t.score * 0.6 + d.score * 0.4) : d.score;
    // Majority-vote the label across the last few frames rather than
    // trusting whatever this single frame said — one bad-frame
    // misclassification no longer flips or resets the whole track.
    t.classHistory.push(d.class);
    if(t.classHistory.length > 10) t.classHistory.shift(); // FIX: 8 -> 10
    const counts = {};
    let bestClass = t.classHistory[0], bestCount = 0;
    t.classHistory.forEach(c => {
      counts[c] = (counts[c] || 0) + 1;
      if(counts[c] > bestCount){ bestCount = counts[c]; bestClass = c; }
    });
    t.class = bestClass;
    d.class = bestClass;
    d.score = t.score;
    t.timeSinceUpdate = 0;
    t.hits++;
    t.age++;
    d.trackId = t.id;
  });
  // new tracks
  dets.forEach((d, di) => {
    if(matchedDet.has(di)) return;
    const id = trackNextId++;
    activeTracks.push({ id, class: d.class, classHistory: [d.class], bbox: d.bbox, score: d.score, age:1, hits:1, timeSinceUpdate:0 });
    d.trackId = id;
  });
  // prune old
  activeTracks = activeTracks.filter(t => t.timeSinceUpdate <= TRACK_MAX_AGE);
  return dets;
}

// COCO-SSD ke common class names ka Hindi label (jitne map nahi honge, wahi English naam dikhega).
// FIX: pehle sirf ~24 classes map thi, baaki 56 (jaise horse, cow, bus, truck,
// bench, traffic light — road/street me sabse zyada milne wali cheezein) sirf
// plain English me dikhti thi ya samajh nahi aata tha ki match hua bhi ya nahi.
// Ab COCO-SSD ke pure 80 classes cover kiye hain.
// NOTE: COCO-SSD ka dataset "gadha/donkey", "thela", "rickshaw" jaisi cheezein
// bilkul nahi jaanta — yeh model sirf isi list ke 80 fixed labels de sakta hai.
// Ek donkey ko yeh model zyada tar "horse" ke sabse kareeb bata sakta hai
// (kabhi sahi, kabhi galat) — is se aage sahi detect karne ke liye
// custom-trained model chahiye hoga.
const cocoHindiNames = {

  bus:'Bus', train:'Train', truck:'Truck', boat:'Naav',
  'traffic light':'Traffic Light', 'fire hydrant':'Fire Hydrant', 'stop sign':'Stop Sign',
  'parking meter':'Parking Meter', bench:'Bench',
  bird:'Chidiya', cat:'Billi', dog:'Kutta', horse:'Ghoda', sheep:'Bhed',
  cow:'Gaay', elephant:'Hathi', bear:'Bhaalu', zebra:'Zebra', giraffe:'Giraffe',
  backpack:'Bag', umbrella:'Chhata', handbag:'Purse', tie:'Tie', suitcase:'Suitcase',
  frisbee:'Frisbee', skis:'Skis', snowboard:'Snowboard', 'sports ball':'Ball',
  kite:'Patang', 'baseball bat':'Baseball Bat', 'baseball glove':'Glove',
  skateboard:'Skateboard', surfboard:'Surfboard', 'tennis racket':'Racket',
  bottle:'Botal', 'wine glass':'Glass', cup:'Cup', fork:'Kaanta', knife:'Chaaku',
  spoon:'Chammach', bowl:'Katora', banana:'Kela', apple:'Seb', sandwich:'Sandwich',
  orange:'Santra', broccoli:'Broccoli', carrot:'Gajar', 'hot dog':'Hot Dog',
  pizza:'Pizza', donut:'Donut', cake:'Cake',
  chair:'Kursi', couch:'Sofa', 'potted plant':'Pauda', bed:'Bistar',
  'dining table':'Table', toilet:'Toilet', tv:'TV', laptop:'Laptop', mouse:'Mouse',
  remote:'Remote', keyboard:'Keyboard', 'cell phone':'Mobile', microwave:'Microwave',
  oven:'Oven', toaster:'Toaster', sink:'Sink', refrigerator:'Fridge', book:'Kitaab',
  clock:'Ghadi', vase:'Vase', scissors:'Kainchi', 'teddy bear':'Teddy Bear',
  'hair drier':'Hair Dryer', toothbrush:'Toothbrush',
};
function hindiObjName(cls){ return cocoHindiNames[cls] || cls; }

// Per-class confidence floor. 0.35 default is the practical sweet spot for
// COCO-SSD on a phone camera — high enough to cut obvious noise, low enough
// that real objects at normal distance/lighting still clear it. A couple of
// classes that are the common false-positive sources get a real bump above
// that; going much higher across the board makes real objects silently
// disappear instead of getting flagged.
const DEFAULT_MIN_SCORE = 0.28; // FIX: 0.35 -> 0.28 (door wale/dark/chhote objects miss ho rahe the)
const CLASS_CONF_OVERRIDE = {
  person: 0.42,   // FIX: 0.55 -> 0.42 (bahut strict tha)
  vase: 0.45,
  bottle: 0.32,   // FIX: 0.4 -> 0.32
  knife: 0.45,    // FIX: 0.55 -> 0.45 (safety-relevant, phir bhi thoda strict)
  scissors: 0.42, // FIX: 0.5 -> 0.42
};

// Cross-class duplicate removal. COCO-SSD's own NMS only dedupes boxes
// *within* the same class, so two different labels can still fire on the
// same physical object (e.g. "cup" + "bottle" on one item). This is a
// second IoU pass across all surviving boxes: when two overlap heavily we
// keep only the higher-confidence one.
const DEDUP_IOU_THRESH = 0.7;
function dedupDetections(dets){
  const sorted = dets.slice().sort((a,b) => b.score - a.score);
  const kept = [];
  sorted.forEach(d => {
    const overlapsKept = kept.some(k => bboxIou(k.bbox, d.bbox) >= DEDUP_IOU_THRESH);
    if(!overlapsKept) kept.push(d);
  });
  return kept;
}

// Some classes need more than the default 2-frame confirmation before
// they're trusted enough to show — these are the ones most likely to be a
// one-off misfire (person on a coat-hanger, knife-shaped shadow, etc).
// FIX: default ab 1 frame (turant dikhe); sirf person/knife/scissors ko 2 frames.
const CONFIRM_DEFAULT_HITS = 1;
const CONFIRM_HITS_OVERRIDE = {
  person: 2,
  knife: 2,
  scissors: 2,
};

/* ---- STEP 3: LIGHT TRACKER ----
   Full AI detection har frame nahi. Detection frame par har object ka chhota
   grayscale template (anchor) liya jaata hai; beech ke frames me sirf SAD
   template-matching se box shift hota hai (camera pan + object move dono).
   Match kharab / motion zyada → turant agli tick par full detection. */
const LightTracker = {
  W: 112, R: 12, MAX_TRACKS: 8, SAD_MAX: 0.20, // FIX: bada window/template, soft tolerance, zyada tracks
  video: null, vw: 0, vh: 0, ready: false, needDetect: false, motion: 0,
  _rect(b, kx, ky, gray){
    let x = Math.round(b[0] * kx), y = Math.round(b[1] * ky), w = Math.round(b[2] * kx), h = Math.round(b[3] * ky);
    if(x < 0){ w += x; x = 0; } if(y < 0){ h += y; y = 0; }
    if(x + w > gray.w) w = gray.w - x;
    if(y + h > gray.h) h = gray.h - y;
    return (w < 6 || h < 6) ? null : { x, y, w, h };
  },
  _patch(gray, r){
    const d = new Uint8Array(r.w * r.h);
    for(let j = 0; j < r.h; j++){
      const ro = (r.y + j) * gray.w + r.x;
      for(let i = 0; i < r.w; i++) d[j * r.w + i] = gray.g[ro + i];
    }
    return { w: r.w, h: r.h, d };
  },
  // Detection frame ke baad: fresh tracks ke templates yahin se
  anchor(video, gray){
    this.needDetect = false; this.motion = 0;
    activeTracks.forEach(t => { t._tpl = null; });
    if(!gray){ this.ready = false; return; }
    this.video = video; this.vw = video.videoWidth; this.vh = video.videoHeight;
    const kx = gray.w / this.vw, ky = gray.h / this.vh;
    let n = 0;
    activeTracks.forEach(t => {
      if(t.timeSinceUpdate !== 0) return;
      const r = this._rect(t.bbox, kx, ky, gray);
      if(!r) return;
      t._tpl = this._patch(gray, r); t._ax = r.x; t._ay = r.y; t._abox = t.bbox.slice(); t._trkLost = false;
      n++;
    });
    this.ready = n > 0;
  },
  // Tracking frame: fresh tracks ke bbox shift karo. Lost track → _trkLost=true.
  step(video){
    if(!this.ready || video !== this.video) return false;
    const gray = FrameOptimizer.gray(video, this.W);
    if(!gray){ this.needDetect = true; return false; }
    const kx = gray.w / this.vw, ky = gray.h / this.vh, R = this.R;
    const focus = (typeof VisionPerf !== 'undefined') ? VisionPerf.focus : [];
    const list = activeTracks.filter(t => t._tpl && t.timeSinceUpdate === 0)
      .sort((a, b) => (focus.includes(b.class) ? 1 : 0) - (focus.includes(a.class) ? 1 : 0))
      .slice(0, this.MAX_TRACKS);
    let maxMove = 0;
    list.forEach(t => {
      const tw = t._tpl.w, th = t._tpl.h, tpl = t._tpl.d, g = gray.g, gw = gray.w;
      const stride = (tw * th > 900) ? 2 : 1;
      let best = Infinity, bdx = 0, bdy = 0;
      for(let dy = -R; dy <= R; dy++){
        const y0 = t._ay + dy;
        if(y0 < 0 || y0 + th > gray.h) continue;
        for(let dx = -R; dx <= R; dx++){
          const x0 = t._ax + dx;
          if(x0 < 0 || x0 + tw > gw) continue;
          let sad = 0;
          for(let j = 0; j < th; j += stride){
            const ro = (y0 + j) * gw + x0, to = j * tw;
            for(let i = 0; i < tw; i += stride) sad += Math.abs(g[ro + i] - tpl[to + i]);
            if(sad >= best) break;
          }
          if(sad < best){ best = sad; bdx = dx; bdy = dy; }
        }
      }
      const cnt = Math.ceil(th / stride) * Math.ceil(tw / stride);
      const nsad = best === Infinity ? 1 : best / (cnt * 255);
      // window ke kinare par best match = shayad object window se bahar nikal gaya
      if(nsad > this.SAD_MAX || Math.max(Math.abs(bdx), Math.abs(bdy)) >= R){ t._trkLost = true; this.needDetect = true; return; }
      t._trkLost = false;
      t.bbox = [t._abox[0] + bdx / kx, t._abox[1] + bdy / ky, t._abox[2], t._abox[3]];
      maxMove = Math.max(maxMove, Math.max(Math.abs(bdx), Math.abs(bdy)) / gw);
    });
    this.motion = maxMove;
    return true;
  }
};

/* ---- STEP 2: VISION PERF (detection scheduler) ----
   Stable scene: 1 full AI detection + (detectEvery-1) tracking frames.
   Naya/unconfirmed object, tracker lost, ya tez motion: har tick full detection.
   Object Finder ON: focus classes → lower threshold + zyada baar detection. */
const VisionPerf = {
  enabled: false, focus: [], sinceFull: 0, lastFullAt: 0, emaMs: 0,
  stats: { full: 0, tracked: 0 },
  setFocus(classes){ this.focus = Array.isArray(classes) ? classes.slice() : []; this.sinceFull = 0; },
  detectEvery(){ return this.focus.length ? 1 : 2; }, // FIX: pehle 2/3 — ab full AI detect zyada baar
  plan(video){
    if(!this.enabled || !FrameOptimizer.grayOk || !LightTracker.ready || video !== LightTracker.video) return 'detect';
    if(Date.now() - this.lastFullAt > 2500) return 'detect';
    const fresh = activeTracks.filter(t => t.timeSinceUpdate === 0);
    if(!fresh.length || fresh.length > LightTracker.MAX_TRACKS) return 'detect';
    if(LightTracker.needDetect || LightTracker.motion > 0.05) return 'detect';
    if(!fresh.every(t => t.hits >= 2 && t._tpl && !t._trkLost)) return 'detect';
    if(this.sinceFull + 1 >= this.detectEvery()) return 'detect';
    return 'track';
  },
  noteFull(ms){ this.emaMs = this.emaMs ? this.emaMs * 0.7 + ms * 0.3 : ms; this.stats.full++; this.sinceFull = 0; this.lastFullAt = Date.now(); }
};

// Single shared detection pipeline used by every panel (Vision, Obj+Depth).
// detect frame: FrameOptimizer (640px) → COCO-SSD → confidence floor (target class ke liye kam)
//   → cross-class dedup → IoU tracker (EMA score + majority-vote class) → confirmation gate → tracker anchors.
// track frame: LightTracker se bbox shift (AI model skip), hits++ per tick.
async function runObjectDetection(video){
  // Vision engine: FullPage version (plain COCO-SSD detect on the raw frame -> dedup -> IoU tracker -> confirm gate).
  const focus = (typeof VisionPerf !== 'undefined' && VisionPerf.focus) ? VisionPerf.focus : []; // Object Finder target classes
  const floor = focus.length ? Math.min(0.28, DEFAULT_MIN_SCORE) : DEFAULT_MIN_SCORE;
  const t0 = (typeof performance !== 'undefined') ? performance.now() : Date.now();
  const preds = await visionModel.detect(video, 20, floor);
  try{ VisionPerf.noteFull(((typeof performance !== 'undefined') ? performance.now() : Date.now()) - t0); }catch(e){}
  let dets = preds
    .filter(p => p.score >= (focus.includes(p.class) ? 0.3 : (CLASS_CONF_OVERRIDE[p.class] || DEFAULT_MIN_SCORE)))
    .map(p => ({ class: p.class, score: p.score, bbox: p.bbox }))
    .sort((a,b) => b.score - a.score);
  dets = dedupDetections(dets);
  dets = updateTracks(dets);
  const hitsById = {};
  activeTracks.forEach(t => { hitsById[t.id] = t.hits; });
  dets = dets.filter(d => (hitsById[d.trackId] || 1) >= (CONFIRM_HITS_OVERRIDE[d.class] || 2));
  return dets;
}

// Tracks repeated detect() failures (e.g. a transient WebGL context loss)
// and self-heals instead of leaving the panel silently stuck with no
// detections until the user manually restarts the camera.
let consecutiveDetectErrors = 0;
let recoveringVisionModel = false;
async function recoverVisionModel(){
  if(recoveringVisionModel) return;
  recoveringVisionModel = true;
  console.warn('Detect() failed repeatedly — attempting to recover the vision model.');
  try{
    visionModel = null;
    if(typeof tf !== 'undefined'){
      try{ await tf.setBackend('cpu'); await tf.ready(); }catch(e){}
    }
    await loadVisionModel();
  }catch(e){
    console.error('recoverVisionModel failed', e);
  }
  consecutiveDetectErrors = 0;
  recoveringVisionModel = false;
}
function noteDetectError(e){
  console.warn('detect error', e);
  consecutiveDetectErrors++;
  if(consecutiveDetectErrors >= 5) recoverVisionModel();
}

async function loadVisionModel(){
  if(visionModel || visionModelLoading) return;
  if(typeof cocoSsd === 'undefined'){
    console.error('cocoSsd library missing');
    try{ addMsg('Object detection library (coco-ssd) load nahi hui. Internet on karke page refresh karo.', 'bot'); }catch(e){}
    return;
  }
  visionModelLoading = true;
  try{
    // Ensure TF.js ready + prefer WebGL (fast on most phones), fallback CPU
    if(typeof tf !== 'undefined'){
      try{ await tf.ready(); }catch(e){}
      try{
        await tf.setBackend('webgl');
        await tf.ready();
      }catch(e){
        try{ await tf.setBackend('cpu'); await tf.ready(); }catch(e2){}
      }
    }
    // Try the more accurate model, but actually MEASURE its inference speed
    // on this device (at real camera resolution) before committing to it —
    // on a weak/slow phone it silently falls back to the fast lite model
    // instead of making every detection tick lag.
    const SLOW_MS_THRESHOLD = 400; // if one detect() call takes longer than this, it's too slow for a smooth ~350ms loop
    try{
      visionModel = await cocoSsd.load({ base: 'mobilenet_v2' });
      const dummy = document.createElement('canvas');
      dummy.width = 640; dummy.height = 480; // realistic size, not a tiny 64x64
      const t0 = (typeof performance !== 'undefined') ? performance.now() : Date.now();
      await visionModel.detect(dummy, 20, 0.4);
      const t1 = (typeof performance !== 'undefined') ? performance.now() : Date.now();
      if((t1 - t0) > SLOW_MS_THRESHOLD){
        console.warn('mobilenet_v2 too slow on this device (' + Math.round(t1-t0) + 'ms) — switching to lite_mobilenet_v2');
        visionModel = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
      }
    }catch(e1){
      try{
        visionModel = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
      }catch(e2){
        visionModel = await cocoSsd.load(); // default fallback
      }
    }
    // Warm-up so the first real detection is fast
    try{
      const dummy = document.createElement('canvas');
      dummy.width = 64; dummy.height = 64;
      await visionModel.detect(dummy, 5, 0.1);
    }catch(e){}
  }catch(e){
    addMsg("AI model load nahi ho paaya. Internet check karo (pehli baar model download hone ke liye chahiye).", 'bot');
    console.error('loadVisionModel failed', e);
  }
  visionModelLoading = false;
  if(visionModel && typeof prefetchOfflineAssets === 'function') setTimeout(prefetchOfflineAssets, 5000);
  if(currentPanel === 'objdepth') renderObjDepthPanel();
  if(typeof renderVisionPanel === 'function' && currentPanel === 'vision') renderVisionPanel();
}

// Offline ke liye: COCO-SSD weights (accurate + lite) pehli baar online par background me cache karo
// (service worker unhe 'nancy-libs' me rakhta hai). Sirf ek baar, data-saver par nahi.
async function prefetchOfflineAssets(){
  try{
    if(!navigator.onLine || localStorage.getItem('nancy_offline_models_v1') === '1') return;
    if(navigator.connection && navigator.connection.saveData) return;
    if(!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return; // SW active hone ke baad hi
    try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
    const root = 'https://storage.googleapis.com/tfjs-models/savedmodel/';
    for(const dir of ['ssdlite_mobilenet_v2', 'ssd_mobilenet_v2']){
      const mj = root + dir + '/model.json';
      const r = await fetch(mj); if(!r.ok) return;
      const j = await r.clone().json();
      const paths = (j.weightsManifest || []).reduce((a, g) => a.concat(g.paths || []), []);
      for(const pth of paths){ const rr = await fetch(root + dir + '/' + pth); if(!rr.ok) return; await rr.arrayBuffer(); }
    }
    localStorage.setItem('nancy_offline_models_v1', '1');
    addMsg('✅ Offline Vision ready — object detection ke models ab internet ke bina bhi chalenge.', 'bot');
  }catch(e){ console.warn('prefetchOfflineAssets', e); }
}

async function startCamera(){
  const video = document.getElementById('visionVideo');
  if(!video) return;
  try{
    visionStream = await CamEngine.getStream(false); // BACK camera
    video.setAttribute('playsinline','');
    video.setAttribute('webkit-playsinline','');
    video.muted = true;
    video.srcObject = visionStream;
    CamEngine.removeMirror(video, document.getElementById('visionCanvas'));
    try { await video.play(); } catch(pe){ console.warn('vision play', pe); }
    if(!visionModel) await loadVisionModel();
    startDetectLoop();
    if(currentPanel === 'objdepth') renderObjDepthPanel();
  }catch(e){
    addMsg("Camera access nahi mil paaya. Permission allow karo + camera free check karo.", 'bot');
    console.error('Vision cam error', e);
  }
}

function stopCamera(){
  if(visionStream){
    visionStream.getTracks().forEach(t => t.stop());
    visionStream = null;
  }
  clearInterval(visionDetectTimer);
  visionDetectTimer = null;
  lastDetections = [];
  if(currentPanel === 'objdepth') renderObjDepthPanel();
}

let visionDetectBusy = false;
function startDetectLoop(){
  clearInterval(visionDetectTimer);
  visionDetectBusy = false;
  visionDetectTimer = setInterval(async () => {
    if(visionDetectBusy) return;
    if(!AIScheduler.due('object')) return;
    const video = document.getElementById('visionVideo');
    if(!video || !visionModel || video.readyState < 2 || !video.videoWidth) return;
    visionDetectBusy = true;
    try{
      // Shared pipeline: raw video frame → confidence floor → cross-class
      // dedup → IoU-tracked + smoothed + majority-voted → confirmation gate.
      lastDetections = await runObjectDetection(video);
      drawDetections(video, lastDetections);
      if(currentPanel === 'objdepth') updateObjDepthDetList();
      if(currentPanel === 'vision') updateDetectionList();
      consecutiveDetectErrors = 0;
    }catch(e){ noteDetectError(e); }
    visionDetectBusy = false;
  }, 350);
}

function drawDetections(video, preds){
  const canvas = document.getElementById('visionCanvas');
  if(!canvas || !video.videoWidth) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.lineWidth = 3;
  ctx.font = 'bold 15px monospace';
  preds.forEach(p => {
    const [x,y,w,h] = p.bbox;
    const conf = p.score;
    ctx.strokeStyle = conf > 0.6 ? '#3ee6c4' : (conf > 0.4 ? '#ffd166' : '#ff7eb3');
    ctx.fillStyle = ctx.strokeStyle;
    ctx.strokeRect(x,y,w,h);
    const tid = p.trackId != null ? ` #${p.trackId}` : '';
    const label = `${hindiObjName(p.class)}${tid} ${(conf*100).toFixed(0)}%`;
    const tw = ctx.measureText(label).width + 8;
    const ty = y > 22 ? y - 4 : y + 18;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(x, ty - 14, tw, 18);
    ctx.fillStyle = conf > 0.6 ? '#3ee6c4' : (conf > 0.4 ? '#ffd166' : '#ff7eb3');
    ctx.fillText(label, x + 4, ty);
  });
}

function updateDetectionList(){
  const box = document.getElementById('detList');
  if(!box) return;
  box.innerHTML = lastDetections.length
    ? lastDetections.map(p => {
        const tid = p.trackId != null ? ` <span class="track-id">#${p.trackId}</span>` : '';
        return `<div class="det-row"><span class="oname">${hindiObjName(p.class)}${tid}</span><span class="oconf">${(p.score*100).toFixed(0)}%</span></div>`;
      }).join('')
    : '';
}

  panelTitle.textContent = 'OBJECT DETECTION + TRACK';
  const running = !!visionStream;
  const connected = isSensorConnected();
  const distVal = sensors.ultrasonic.value;
  panelBody.innerHTML = `
    <div id="visionWrap" style="margin-top:8px; ${running ? '' : 'display:none;'}">
      <video webkit-playsinline autoplay id="visionVideo" playsinline muted></video>
      <canvas id="visionCanvas"></canvas>
    </div>
    <div style="margin-top:12px;">
      <button class="act ${running ? 'stop' : ''}" id="btnCamToggle">
        ${running ? '⏹ Stop Camera' : '📷 Start Camera'}

    </div>
    <div class="det-list" id="detList"></div>
    <div class="sdata" style="margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.12);">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span>📏 Distance</span>
        <span id="visionDistanceValue">${connected && distVal !== null ? `${distVal} cm` : 'N/A'}</span>
      </div>
      <button class="act ${ultrasonicNarrationOn ? 'stop' : ''}" id="btnUltraToggle" style="margin-top:10px;" ${connected ? '' : 'disabled'}>
        ${ultrasonicNarrationOn ? '🔇 Stop Ultrasonic Voice Alert' : '🔊 Start Ultrasonic Voice Alert'}
      </button>
      <div class="status-line ${ultrasonicNarrationOn ? 'ok' : ''}" id="ultraStatusLine">
        ${!connected ? 'Sensor is not connected.' : (ultrasonicNarrationOn ? 'Announcing obstacles ahead...' : 'Off.')}
      </div>
    </div>
  `;
  if(!running){
    // agla render tabhi camera dikhega, lekin video element abhi bhi hidden div me maujood ho
    const wrap = document.getElementById('visionWrap');
    wrap.style.display = 'none';
  } else {
    const video = document.getElementById('visionVideo');
    if(visionStream){ video.srcObject = visionStream; video.play().catch(()=>{}); }
  }
  updateDetectionList();
  document.getElementById('btnCamToggle').addEventListener('click', () => {
    running ? stopCamera() : startCamera();
  });

/* =====================================================
   FACE RECOGNITION (ArcFace-style) — face-api.js FaceRecognitionNet
   128-d descriptors — cloud-synced via NANCY face backend,
   with a localStorage mirror so matching stays instant & offline-capable.
===================================================== */
/* ===================================================================
   STEPS 6–13 — FACE PIPELINE · FACE DB v2 · AI SCHEDULER ·
   DECISION MANAGER (voice queue) · SELF TEST
   Rule: Local AI = fast. Face recognition poora on-device chalta hai.
=================================================================== */
function faceUuid(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'f-' + Date.now().toString(36) + '-' + Math.random().toString(16).slice(2, 10);
}
function faceEnsureMeta(f){
  if(!f.id) f.id = faceUuid();
  if(!f.version) f.version = 1;
  if(!f.updatedAt) f.updatedAt = Date.now();
  return f;
}

/* ---------- STEP 10 (pure logic): validate + merge ---------- */
function validateFacesDoc(doc){
  const out = { ok: false, faces: [], tombstones: [], dropped: 0 };
  if(!doc || !Array.isArray(doc.faces)) return out;
  doc.faces.forEach(f => {
    const good = f && typeof f.id === 'string' && f.id && typeof f.name === 'string' && f.name.trim()
      && Array.isArray(f.descriptor) && f.descriptor.length === 128 && f.descriptor.every(v => typeof v === 'number' && isFinite(v));
    if(!good){ out.dropped++; return; }
    const face = { id: f.id, name: f.name.trim(), descriptor: f.descriptor.slice(), version: Number(f.version) || 1, updatedAt: Number(f.updatedAt) || 0 };
    if(typeof f.photo === 'string' && f.photo.indexOf('data:image/') === 0 && f.photo.length < 60000) face.photo = f.photo;
    out.faces.push(face);
  });
  (Array.isArray(doc.tombstones) ? doc.tombstones : []).forEach(t => {
    if(t && typeof t.id === 'string' && t.id) out.tombstones.push({ id: t.id, deletedAt: Number(t.deletedAt) || 0 });
  });
  out.ok = true;
  return out;
}
function buildFacesDoc(m){
  return {
    schema: 1, savedAt: Date.now(),
    faces: m.faces.map(f => ({ id: f.id, name: f.name, version: f.version || 1, updatedAt: f.updatedAt || 0,
      descriptor: f.descriptor.map(v => Math.round(v * 1e5) / 1e5), photo: f.photo || undefined })),
    tombstones: m.tombstones
  };
}
// Last-write-wins per person id + tombstones (delete sab devices par jaaye) + same naam ek hi rakho.
function mergeFaces(lf, lt, rf, rt){
  const TOMB_KEEP_MS = 90 * 86400000, now = Date.now();
  const tomb = new Map();
  (lt || []).concat(rt || []).forEach(t => {
    if(!t || !t.id) return;
    const p = tomb.get(t.id);
    if(!p || (t.deletedAt || 0) > p.deletedAt) tomb.set(t.id, { id: t.id, deletedAt: t.deletedAt || 0 });
  });
  const byId = new Map();
  (lf || []).concat(rf || []).forEach(f => {
    if(!f || !f.id) return;
    const p = byId.get(f.id), fu = f.updatedAt || 0, pu = p ? (p.updatedAt || 0) : -1;
    if(!p || fu > pu || (fu === pu && (f.version || 0) > (p.version || 0))) byId.set(f.id, f);
  });
  let faces = [];
  byId.forEach((f, id) => { const t = tomb.get(id); if(!(t && t.deletedAt >= (f.updatedAt || 0))) faces.push(f); });
  const byName = new Map();
  faces.forEach(f => {
    const k = String(f.name).toLowerCase(), p = byName.get(k);
    if(!p){ byName.set(k, f); return; }
    const winner = (f.updatedAt || 0) > (p.updatedAt || 0) ? f : p, loser = winner === f ? p : f;
    byName.set(k, winner);
    tomb.set(loser.id, { id: loser.id, deletedAt: now });
  });
  faces = Array.from(byName.values());
  const tombstones = Array.from(tomb.values()).filter(t => now - t.deletedAt < TOMB_KEEP_MS);
  return { faces, tombstones };
}
function sameFaceSet(a, b){
  if(a.length !== b.length) return false;
  const m = new Map(a.map(f => [f.id, f]));
  return b.every(f => { const o = m.get(f.id); return o && (o.updatedAt || 0) === (f.updatedAt || 0) && (o.version || 0) === (f.version || 0); });
}

/* ---------- STEP 11: AI SCHEDULER ----------
   Divisor: 1 = har tick, N = har N-vi tick, 0 = OFF. Mode panel / Finder / SOS se set hota hai. */
const AIScheduler = {
  base: 'normal', sos: false, cfg: { backgroundFace: true },
  PROFILES: {
    normal:  { object: 1, face: 4, gesture: 0 },
    face:    { object: 4, face: 1, gesture: 0 },
    finder:  { object: 1, face: 8, gesture: 0 },
    gesture: { object: 4, face: 0, gesture: 1 },
    sos:     { object: 4, face: 0, gesture: 0 }   // AI kam, SOS communication priority
  },
  GAP: { normal: 2500, finder: 5000 },            // background face recognition ka minimum gap (ms)
  _n: {},
  mode(){ return this.sos ? 'sos' : this.base; },
  setMode(m){ if(this.PROFILES[m]) this.base = m; },
  setSos(on){ this.sos = !!on; },
  profile(){ return this.PROFILES[this.mode()]; },
  due(mod){
    const d = this.profile()[mod];
    if(!d) return false;
    this._n[mod] = (this._n[mod] || 0) + 1;
    return d === 1 || this._n[mod] % d === 0;
  },
  minGapMs(){ return this.GAP[this.mode()] || 0; },
  describe(){
    const p = this.profile(), f = v => v === 0 ? 'OFF' : v === 1 ? 'ON' : 'LOW(1/' + v + ')';
    return 'AI mode: ' + this.mode().toUpperCase() + ' — Object ' + f(p.object) + ', Face ' + f(p.face) + ', Gesture ' + f(p.gesture);
  }
};
function aiSchedPanelMode(name){
  try{ AIScheduler.setMode(name === 'facetrim' ? 'face' : name === 'handbodygest' ? 'gesture' : (ObjectFinder.active ? 'finder' : 'normal')); }catch(e){}
}

/* ---------- STEP 12: DECISION MANAGER (voice queue) ----------
   AI result seedha TTS ko nahi: dedupe (key + cooldown) → priority queue → ek ek karke bolna.
   priority 3 = emergency/obstacle (queue saaf + abhi ki aawaz kaat kar turant). */
function makeDecisionManager(out){
  const dm = {
    q: [], last: {}, busy: false, stats: { spoken: 0, dropped: 0 },
    say(text, o){
      o = o || {};
      const now = Date.now(), key = o.key || '', pr = o.priority == null ? 1 : o.priority;
      const cd = o.cooldownMs == null ? 3000 : o.cooldownMs;
      if(key && this.last[key] && now - this.last[key] < cd){ this.stats.dropped++; return false; }
      if(!text) return false;
      if(pr >= 3){ this.q = []; try{ out.cancel(); }catch(e){} }
      const dup = key ? this.q.find(i => i.key === key) : null;
      if(dup){ dup.text = text; dup.at = now; dup.chat = dup.chat || !!o.chat; }
      else this.q.push({ text, key, pr, chat: !!o.chat, at: now, ttl: o.ttlMs || 6000 });
      this.q.sort((a, b) => b.pr - a.pr || a.at - b.at);
      while(this.q.length > 4){ this.q.pop(); this.stats.dropped++; }
      this.pump();
      return true;
    },
    flush(){ this.q = []; try{ out.cancel(); }catch(e){} },
    async pump(){
      if(this.busy) return;
      this.busy = true;
      try{
        while(this.q.length){
          const it = this.q.shift();
          if(Date.now() - it.at > it.ttl){ this.stats.dropped++; continue; } // purani guidance ab kaam ki nahi
          if(it.key) this.last[it.key] = Date.now();
          this.stats.spoken++;
          try{ out.say(it.text, it.chat); }catch(e){}
          await out.wait();
        }
      } finally { this.busy = false; }
    }
  };
  return dm;
}
const DecisionManager = makeDecisionManager({
  say: (t, chat) => { if(chat) voiceSay(t); else if(voiceState.enabled) speak(t); },
  cancel: () => { try{ speechSynthesis.cancel(); }catch(e){} },
  wait: () => waitForSpeechEnd(8000)
});

/* ---------- STEPS 6+7: FACE PIPELINE (low-res detection, recognition sirf zarurat par) ---------- */
const FacePipeline = {
  tracks: [], nextId: 1, wantFull: true, recheckMs: 1500, ema: 0, inputSize: 320,
  stats: { detectOnly: 0, recognized: 0 },
  _busy: false, _last: { detections: [], recognized: [] }, _video: null,
  reset(){ this.tracks = []; this.wantFull = true; this._last = { detections: [], recognized: [] }; },
  opts(){ return new faceapi.TinyFaceDetectorOptions({ inputSize: this.inputSize, scoreThreshold: 0.5 }); },
  _iou(a, b){
    const ix = Math.max(0, Math.min(a.x + a.width, b.x + b.width) - Math.max(a.x, b.x));
    const iy = Math.max(0, Math.min(a.y + a.height, b.y + b.height) - Math.max(a.y, b.y));
    const inter = ix * iy, uni = a.width * a.height + b.width * b.height - inter;
    return uni > 0 ? inter / uni : 0;
  },
  // boxes → tracks (IoU). Naya face → naya track + wantFull. 3 tick gayab → track delete.
  assign(boxes){
    const pairs = [];
    this.tracks.forEach((t, ti) => boxes.forEach((b, bi) => { const v = this._iou(t.box, b); if(v >= 0.3) pairs.push({ ti, bi, v }); }));
    pairs.sort((a, b) => b.v - a.v);
    const mt = new Set(), mb = new Set(), out = new Array(boxes.length), old = this.tracks.slice();
    pairs.forEach(p => {
      if(mt.has(p.ti) || mb.has(p.bi)) return;
      mt.add(p.ti); mb.add(p.bi);
      const t = old[p.ti]; t.box = boxes[p.bi]; t.missed = 0; t.hits++; out[p.bi] = t;
    });
    boxes.forEach((b, bi) => {
      if(out[bi]) return;
      const t = { id: this.nextId++, box: b, name: 'Unknown', dist: null, votes: [], lastRecogAt: 0, hits: 1, missed: 0, announced: '', desc: null };
      this.tracks.push(t); out[bi] = t;
    });
    old.forEach((t, ti) => { if(!mt.has(ti)) t.missed++; });
    this.tracks = this.tracks.filter(t => t.missed <= 3);
    return out;
  },
  _majority(votes){
    const c = {}; let best = votes[votes.length - 1], n = 0;
    votes.forEach(v => { c[v] = (c[v] || 0) + 1; });
    Object.keys(c).forEach(k => { if(c[k] > n || (c[k] === n && k === votes[votes.length - 1])){ n = c[k]; best = k; } });
    return best;
  },
  // → { detections, recognized } (purane consumers wahi format: [{detection, descriptor}], [{name, dist}])
  async run(video, o){
    o = o || {};
    // BUG FIX 1: panel loop + FaceBackground dono ek saath run() chala sakte the (tracks/TF state corrupt).
    if(this._busy) return this._last;
    // BUG FIX 2: alag video (panel badla) ke purane tracks naye video par chipak jaate the.
    if(this._video !== video){ this._video = video; this.reset(); }
    this._busy = true;
    try{ return await this._runInner(video, o); }
    finally{ this._busy = false; }
  },
  async _runInner(video, o){
    const fr = FrameOptimizer.frame(video), now = Date.now();
    const full = !!o.forceFull || this.wantFull || this.tracks.some(t => now - t.lastRecogAt >= this.recheckMs);
    const t0 = (typeof performance !== 'undefined') ? performance.now() : Date.now();
    let items;
    if(full){
      // BUG FIX 3: descriptor pehle 640px downscaled frame se banta tha, jabki enroll full-res video se hota hai
      // (chhota/blur crop => distance badhta => sahi banda "Unknown"). TinyFaceDetector khud inputSize par resize
      // karta hai, to full video dene se detection slow nahi hota — sirf landmarks/descriptor crop saaf milta hai.
      const res = await faceapi.detectAllFaces(video, this.opts()).withFaceLandmarks().withFaceDescriptors();
      items = res.map(r => ({ detection: r.detection, descriptor: r.descriptor }));
      this.stats.recognized++;
    } else {
      const res = await faceapi.detectAllFaces(fr.src, this.opts());
      items = res.map(d => ({ detection: d, descriptor: null }));
      this.stats.detectOnly++;
    }
    const ms = ((typeof performance !== 'undefined') ? performance.now() : Date.now()) - t0;
    this.ema = this.ema ? this.ema * 0.7 + ms * 0.3 : ms;
    this.inputSize = this.ema > 320 ? 224 : (this.ema < 200 ? 320 : this.inputSize); // dheeme phone par chhota input
    const tracks = this.assign(items.map(i => {
      const b = i.detection.box, W = (i.detection.imageDims && i.detection.imageDims.width) || 1, H = (i.detection.imageDims && i.detection.imageDims.height) || 1;
      return { x: b.x / W, y: b.y / H, width: b.width / W, height: b.height / H }; // relative coords: dono pass ka IoU comparable
    }));
    items.forEach((it, i) => {
      const t = tracks[i];
      if(!it.descriptor || !t) return; // FIX #10: tracks[i] undefined edge-case => crash
      const desc = Array.from(it.descriptor), m = matchFaceDescriptor(desc);
      t.votes.push(m.name); if(t.votes.length > 3) t.votes.shift();
      t.name = this._majority(t.votes); t.dist = m.dist; t.desc = desc; t.lastRecogAt = now;
    });
    this.wantFull = tracks.some(t => !t.lastRecogAt);
    if(o.announce !== false){
      tracks.forEach(t => {
        if(!t || t.name === 'Unknown' || t.announced === t.name) return;
        if((t.dist != null && t.dist <= 0.45) || t.votes.length >= 2){
          t.announced = t.name;
          DecisionManager.say(t.name + ' saamne hai.', { key: 'face:' + t.name, priority: 1, cooldownMs: 20000, chat: true });
        }
      });
    }
    this._last = {
      detections: items.map((it, i) => ({ detection: it.detection, descriptor: it.descriptor || (tracks[i] && tracks[i].desc) || null })),
      recognized: items.map((it, i) => tracks[i] ? { name: tracks[i].name, dist: tracks[i].dist } : { name: 'Unknown', dist: null })
    };
    return this._last;
  }
};
// Normal / Finder mode me Face AI "low frequency": Object loop se piggy-back, minimum gap ke saath.
const FaceBackground = {
  busy: false, lastAt: 0, loading: false,
  async tick(video){
    try{
      if(this.busy || !AIScheduler.cfg.backgroundFace || !knownFaces.length || typeof faceapi === 'undefined') return;
      if(!faceRecogModelsLoaded){
        if(!this.loading && navigator.onLine !== false){ this.loading = true; ensureFaceRecogModels().finally(() => { this.loading = false; }); }
        return;
      }
      if(Date.now() - this.lastAt < AIScheduler.minGapMs()) return;
      this.busy = true; this.lastAt = Date.now();
      await FacePipeline.run(video, { forceFull: true, announce: true });
    }catch(e){ console.warn('FaceBackground', e); }
    this.busy = false;
  }
};

/* ---------- STEP 9: chat / voice commands (face + self test) ---------- */
const NancyExtras = {
  handle(text){
    const t = String(text || '').toLowerCase();
    if(/\b(self\s*test|system\s*test|full\s*test|nancy\s*test)\b/.test(t)){
      NancySelfTest.run().catch(e => addMsg('Self test crash: ' + (e && e.message), 'bot'));
      return 'Nancy self test chal raha hai — result thodi der me chat me aayega.';
    }
    if(/\bface\s*(check|diagnos\w*|debug)\b/.test(t)){ faceDiagnostics(); return 'Face Check chal raha hai — result chat me aayega (camera ON rakhna).'; }
    if(/\b(ai\s*scheduler|scheduler\s*status|ai\s*mode\s*status)\b/.test(t)) return AIScheduler.describe();
    if(/\b(?:ye|yeh|ise|isko)\s*kaun\s*(?:hai|hain)\b|\bwho\s+is\s+(?:this|that|in\s+front)\b|\bpehchan(?:o|na)\b/.test(t)){
      if(!knownFaces.length) return 'Abhi koi face enroll nahi hai. Face panel me naam ke saath Enroll Face karo.';
      try{ if(currentPanel !== 'facetrim') openPanel('facetrim'); }catch(e){}
      return 'Face recognition ON — camera ke saamne dekhte hi naam bolunga.';
    }
    if(/\b(delete|hata|hatao|remove|forget|bhool)\b/.test(t) || t.indexOf('bhool jao') >= 0){
      const hit = knownFaces.find(f => new RegExp('(?:^|[^a-z0-9])' + f.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:[^a-z0-9]|$)').test(t));
      if(hit && /\b(face|chehra|ko|ka)\b/.test(t)){ deleteKnownFace(hit.name); return hit.name + ' ka face delete kar diya.'; }
    }
    return null;
  }
};

/* ---------- STEP 13: SELF TEST — chat me "self test" bolo ---------- */
const NancySelfTest = {
  async run(){
    const R = [];
    const ok = (name, pass, detail) => R.push({ name, pass: !!pass, detail: detail || '' });
    const info = (name, detail) => R.push({ name, pass: null, detail });
    try{ const i = CameraManager.info(); info('Camera', (i.open ? 'ON ' + i.facing : 'band (idle)') + ' · handles ' + i.handles + ' · opens ' + i.opens + ' reuses ' + i.reuses); }catch(e){ ok('Camera', false, e.message); }
    info('Frame optimizer', 'AI frame ' + (FrameOptimizer.enabled ? FrameOptimizer.maxW + 'px' : 'raw video (fallback)') + ' · gray ' + (FrameOptimizer.grayOk ? 'OK' : 'off'));
    info('Vision FPS', 'full ' + VisionPerf.stats.full + ' / tracked ' + VisionPerf.stats.tracked + (VisionPerf.emaMs ? ' · detect ~' + Math.round(VisionPerf.emaMs) + 'ms' : ''));
    ok('Finder zones', finderZone(0.1) === 'left' && finderZone(0.5) === 'center' && finderZone(0.9) === 'right' && finderZone(0.35) === 'slightleft', '');
    const bd = finderCamDist('bottle', 100, 720);
    ok('Finder distance', bd != null && bd > 0.5 && bd < 5, 'bottle 100px@720p ≈ ' + (bd == null ? '?' : bd + ' m'));
    const m = mergeFaces([{ id: 'a', name: 'A', updatedAt: 5, version: 1 }], [], [{ id: 'a', name: 'A', updatedAt: 9, version: 2 }, { id: 'b', name: 'B', updatedAt: 1 }], [{ id: 'b', deletedAt: 2 }]);
    ok('Face merge', m.faces.length === 1 && m.faces[0].updatedAt === 9, '');
    ok('Face validate', validateFacesDoc({ faces: [{ id: 'x', name: 'X', descriptor: [1, 2] }] }).dropped === 1, '');
    const dm = makeDecisionManager({ say: () => {}, cancel: () => {}, wait: async () => {} });
    const a1 = dm.say('x', { key: 'k', cooldownMs: 5000 }); await new Promise(r => setTimeout(r, 20));
    const a2 = dm.say('x', { key: 'k', cooldownMs: 5000 });
    ok('Voice dedupe', a1 === true && a2 === false, '');
    const saved = AIScheduler.sos; AIScheduler.setSos(true);
    ok('SOS mode', AIScheduler.profile().face === 0, AIScheduler.describe()); AIScheduler.setSos(saved);
    info('Scheduler', AIScheduler.describe());
    try{
      const T = Object.create(FaceDB); T.dbName = 'nancy_selftest_db';
      const face = faceEnsureMeta({ name: 'T', descriptor: new Array(128).fill(0.1) });
      await T.put({ savedAt: Date.now(), faces: [face] });
      const back = await T.get(); await T.putTombs([{ id: 'z', deletedAt: 1 }]);
      const tb = await T.getTombs();
      const vr = await T.verify([face]);
      ok('Face DB (IndexedDB)', back && back.faces.length === 1 && back.faces[0].id === face.id && tb.length === 1, '');
      ok('Face save read-back verify', vr.ok === true, 'count=' + vr.count);
      try{ indexedDB.deleteDatabase('nancy_selftest_db'); }catch(e){}
    }catch(e){ ok('Face DB (IndexedDB)', false, e && e.message); }
    info('Face storage', 'load source: ' + faceLoadSource + ' · ' + knownFaces.length + ' faces in memory');
    info('Face models', faceRecogModelsLoaded ? 'loaded · ' + knownFaces.length + ' known faces' : 'abhi load nahi (face panel / background par load honge)');
    const bad = R.filter(r => r.pass === false).length;
    addMsg('🧪 Nancy self test: ' + (bad ? bad + ' FAIL' : 'sab PASS') + '\n' + R.map(r => (r.pass === null ? 'ℹ️' : r.pass ? '✅' : '❌') + ' ' + r.name + (r.detail ? ' — ' + r.detail : '')).join('\n'), 'bot');
    return R;
  }
};

async function faceApiCall(path, options = {}){

  if(!res.ok){ const body = await res.json().catch(()=>({})); throw new Error(body.error || ('HTTP ' + res.status)); }

// IndexedDB backup: Android WebView / APK me localStorage kabhi disable ya clear ho jata hai.
// Isliye faces ab DONO jagah save hote hain, aur save hone ka result check hota hai.
const FaceDB = {
  dbName: 'nancy_faces_db',
  // v2: 'people' store (har person ek record: id, name, descriptor, photo, version, updatedAt) + 'kv' (legacy mirror, tombstones)
  open(){
    return new Promise((res, rej) => {
      if(!window.indexedDB) return rej(new Error('IndexedDB nahi hai'));
      const r = indexedDB.open(this.dbName, 2);
      r.onupgradeneeded = () => {
        const db = r.result;
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if(!db.objectStoreNames.contains('people')) db.createObjectStore('people', { keyPath: 'id' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error || new Error('IndexedDB open fail'));
    });
  },
  async put(rec){
    (rec.faces || []).forEach(faceEnsureMeta);
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(['kv', 'people'], 'readwrite');
      const ps = tx.objectStore('people');
      ps.clear();
      (rec.faces || []).forEach(f => ps.put(f));
      tx.objectStore('kv').put(rec, 'faces'); // legacy mirror (purane build par wapas jaane par bhi faces dikhein)
      tx.oncomplete = () => { db.close(); res(true); };
      tx.onerror = tx.onabort = () => { db.close(); rej(tx.error || new Error('IndexedDB write fail')); };
    });
  },
  async get(){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(['kv', 'people'], 'readonly');
      const pr = tx.objectStore('people').getAll(), kr = tx.objectStore('kv').get('faces');
      tx.oncomplete = () => {
        db.close();
        const people = pr.result || [], legacy = kr.result || null;
        if(people.length) res({ savedAt: (legacy && legacy.savedAt) || Math.max.apply(null, people.map(f => f.updatedAt || 0)), faces: people });
        else res(legacy);
      };
      tx.onerror = tx.onabort = () => { db.close(); rej(tx.error || new Error('IndexedDB read fail')); };
    });
  },
  // READ-BACK VERIFY: abhi-abhi likhe faces IndexedDB se dobara padh kar compare karta hai.
  // Sirf tab ok=true jab har face (id, naam, 128-d descriptor) exactly wapas mil jaye.
  async verify(faces){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('people', 'readonly');
      const rq = tx.objectStore('people').getAll();
      tx.oncomplete = () => {
        db.close();
        const got = new Map((rq.result || []).map(f => [f.id, f]));
        const missing = [];
        (faces || []).forEach(f => {
          const g = got.get(f.id);
          const a = g && g.descriptor ? Array.from(g.descriptor) : null, b = Array.from(f.descriptor || []);
          const same = g && g.name === f.name && a && a.length === 128 && a.length === b.length && a.every((v, i) => v === b[i]);
          if(!same) missing.push(f.name);
        });
        res({ ok: missing.length === 0 && got.size === (faces || []).length, count: got.size, missing });
      };
      tx.onerror = tx.onabort = () => { db.close(); rej(tx.error || new Error('IndexedDB verify fail')); };
    });
  },
  // Tombstones: delete hue faces ki list (delete hue faces ka record)
  async getTombs(){
    const db = await this.open();
    return new Promise((res, rej) => {
      const rq = db.transaction('kv', 'readonly').objectStore('kv').get('tombstones');
      rq.onsuccess = () => { db.close(); res(rq.result || []); };
      rq.onerror = () => { db.close(); rej(rq.error); };
    });
  },
  async putTombs(list){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(list || [], 'tombstones');
      tx.oncomplete = () => { db.close(); res(true); };
      tx.onerror = tx.onabort = () => { db.close(); rej(tx.error || new Error('IndexedDB write fail')); };
    });
  },
  async addTomb(id){
    const list = (await this.getTombs().catch(() => [])) || [];
    list.push({ id, deletedAt: Date.now() });
    await this.putTombs(list);
  }
};

/* ===== FACE STORAGE FLOW =====
   Save : Face -> descriptor -> IndexedDB (PRIMARY) -> read-back verify -> localStorage (backup)
   Load : App start -> IndexedDB -> knownFaces[] (memory) -> recognition.  localStorage sirf fallback.
   faceLocalReady: jab tak start-up load poora nahi hota, koi save nahi chalta
   (warna khali knownFaces[] purane faces ko IndexedDB se mita sakta tha). */
let _faceLocalReadyResolve = null;
const faceLocalReady = new Promise(r => { _faceLocalReadyResolve = r; });
let faceLoadSource = 'none'; // 'indexeddb' | 'localstorage-fallback' | 'indexeddb+ls-newer' | 'none'

// Returns { ok, idb, ls, verified, count, error }
//   idb = IndexedDB me save HUA aur read-back me wapas mila (asli verification)
//   ls  = localStorage backup save hua (aur wapas padh kar match hua)
//   ok  = idb || ls   (kam se kam ek jagah safe hai)
let _faceSaveQueue = Promise.resolve();
function saveKnownFaces(){
  const p = _faceSaveQueue.then(_saveKnownFacesNow, _saveKnownFacesNow);
  _faceSaveQueue = p.catch(() => {}); // saves ek ke baad ek chalte hain, overlap nahi
  return p;
}
async function _saveKnownFacesNow(){
  await faceLocalReady;
  const savedAt = Date.now();
  let idb = false, ls = false, error = '';
  knownFaces.forEach(faceEnsureMeta);
  const snapshot = knownFaces.slice();
  // 1) IndexedDB = PRIMARY, phir turant read-back
  try{
    await FaceDB.put({ savedAt, faces: snapshot });
    const v = await FaceDB.verify(snapshot);
    idb = v.ok;
    if(!idb) error = 'IndexedDB read-back match nahi hua (' + v.count + '/' + snapshot.length + ' mile)';
  }catch(e){ error = 'IndexedDB: ' + ((e && e.message) || 'fail'); console.error('saveKnownFaces IndexedDB failed', e); }
  // 2) localStorage = EMERGENCY BACKUP (quota full ho to photo ke bina try)
  const tryLs = (list) => {
    const json = JSON.stringify(list);
    localStorage.setItem('vision_known_faces', json);
    localStorage.setItem('vision_known_faces_at', String(savedAt));
    return localStorage.getItem('vision_known_faces') === json;
  };
  try{ ls = tryLs(snapshot); }
  catch(e){
    try{ ls = tryLs(snapshot.map(f => Object.assign({}, f, { photo: undefined }))); }
    catch(e2){ console.error('saveKnownFaces localStorage failed', e2); }
  }
  return { ok: idb || ls, idb, ls, verified: idb, count: snapshot.length, error };
}

function _readFacesLS(){
  try{
    const raw = localStorage.getItem('vision_known_faces');
    const faces = raw ? JSON.parse(raw) : [];
    return { faces: Array.isArray(faces) ? faces : [], savedAt: Number(localStorage.getItem('vision_known_faces_at') || 0) };
  }catch(e){ return { faces: [], savedAt: 0 }; }
}
function _cleanFaces(list){
  const arr = (list || []).filter(f => f && typeof f.name === 'string').map(faceEnsureMeta);
  return validateFacesDoc({ faces: arr }).faces; // 128-d descriptor + naam check, kharab record skip
}

// Cloud sync: (FACE_BACKEND_ENABLED = false hai to skip) — local data hamesha pehle.
let faceCloudSynced = false;
async function loadKnownFaces(){
  knownFaces = _cleanFaces(_readFacesLS().faces); // instant: IndexedDB padhne tak matching khali na rahe
  let needResave = false;
  try{
    // 1) IndexedDB PRIMARY (5s timeout — hang ho to localStorage fallback)
    let idbRec = null, idbErr = null;
    try{
      idbRec = await Promise.race([FaceDB.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('IndexedDB read timeout')), 5000))]);
    }catch(e){ idbErr = e; console.warn('FaceDB load failed', e); }
    const lsRec = _readFacesLS();
    const tombs = (await FaceDB.getTombs().catch(() => [])) || [];
    const idbFaces = idbRec && Array.isArray(idbRec.faces) ? _cleanFaces(idbRec.faces) : [];
    const lsFaces = _cleanFaces(lsRec.faces);
    if(idbFaces.length){
      knownFaces = idbFaces; faceLoadSource = 'indexeddb';
      if(lsFaces.length && lsRec.savedAt >= (idbRec.savedAt || 0)){
        // localStorage naya (ya barabar) hai: content compare karo (timestamp tie par bhi pakda jaye).
        // Fark hai => pichla IndexedDB write fail hua tha. Merge karke wapas IndexedDB me daalo.
        const merged = mergeFaces(idbFaces, tombs, lsFaces, []).faces;
        if(!sameFaceSet(idbFaces, merged)){ knownFaces = merged; faceLoadSource = 'indexeddb+ls-newer'; needResave = true; }
      }
    } else if(lsFaces.length){
      knownFaces = mergeFaces(lsFaces, tombs, [], []).faces; // IndexedDB khali/fail => localStorage fallback, phir IndexedDB me migrate
      faceLoadSource = 'localstorage-fallback'; needResave = !idbErr;
    } else { knownFaces = []; faceLoadSource = 'none'; }
  }finally{
    _faceLocalReadyResolve(); // ab saves chal sakte hain
  }
  try{ FacePipeline.reset(); }catch(e){}
  if(needResave){ try{ await saveKnownFaces(); }catch(e){ console.warn('face re-save failed', e); } }
  try{ MemoryManager.syncKnownFaceNames(knownFaces.map(f => f.name)); }catch(e){}
  if(currentPanel === 'facetrim') renderFaceTrimPanel();
  if(!FACE_BACKEND_ENABLED){ faceCloudSynced = false; return; }
  try{
    const { faces } = await faceApiCall('/api/faces/sync');
    if(Array.isArray(faces) && faces.length){ knownFaces = _cleanFaces(faces); await saveKnownFaces(); } // khali server list local ko kabhi nahi mitayegi
    faceCloudSynced = true;
  }catch(e){
    faceCloudSynced = false;
    console.warn('Face cloud sync failed, using local cache:', e.message);
  }
  if(currentPanel === 'facetrim') renderFaceTrimPanel();
}

function euclideanDistance(a, b){
  // FIX #6: length mismatch / null / NaN => pehle NaN aata tha aur banda hamesha "Unknown" rehta tha. Ab Infinity (= match nahi).
  if(!a || !b || a.length !== b.length || !a.length) return Infinity;
  let sum = 0;
  for(let i=0;i<a.length;i++){ const d = a[i]-b[i]; sum += d*d; }
  return Number.isFinite(sum) ? Math.sqrt(sum) : Infinity;
}

function matchFaceDescriptor(desc){
  if(!knownFaces.length) return { name: 'Unknown', dist: null };
  let best = null, bestDist = Infinity;
  knownFaces.forEach(f => {
    const d = euclideanDistance(desc, f.descriptor);
    if(d < bestDist){ bestDist = d; best = f.name; }
  });
  if(bestDist <= FACE_MATCH_THRESHOLD) return { name: best, dist: bestDist };
  return { name: 'Unknown', dist: bestDist };
}

let _faceModelsPromise = null;
// BUG FIX: pehle "loading" ke dauran doosra caller turant false pata tha (enroll bolta tha "models load nahi hue").
// Ab sab callers ek hi promise ka wait karte hain.
function ensureFaceRecogModels(){
  if(faceRecogModelsLoaded) return Promise.resolve(true);
  if(_faceModelsPromise) return _faceModelsPromise;
  if(typeof faceapi === 'undefined'){
    addMsg('face-api.js load nahi hua.', 'bot');

      const FT = faceapi.tf || (typeof tf !== 'undefined' ? tf : null);
      if(FT){
        try{ await FT.ready(); }
        catch(e){ try{ await FT.setBackend('cpu'); await FT.ready(); }catch(e2){ console.warn('face tf backend', e2); } }
      }
      let lastErr = null;
      for(const url of FACEAPI_MODEL_URLS){
        try{
          await Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(url),
            faceapi.nets.faceLandmark68Net.loadFromUri(url),

          ]);
          FACEAPI_MODEL_URL = url; faceRecogModelsLoaded = true; lastErr = null; break;
        }catch(e){ lastErr = e; console.warn('face models load failed from', url, e); }
      }
      if(!faceRecogModelsLoaded) throw lastErr || new Error('models load fail');
      // warm-up: pehli inference (shader compile / backend init) yahin ho jaye; WebGL fail ho to cpu par ja kar dobara
      const warm = async () => { const c = document.createElement('canvas'); c.width = c.height = 64; await faceapi.detectAllFaces(c, new faceapi.TinyFaceDetectorOptions({ inputSize: 128 })); };
      try{ await warm(); }
      catch(e){ console.warn('face warm-up failed, cpu try', e); try{ if(FT){ await FT.setBackend('cpu'); await FT.ready(); } await warm(); }catch(e2){ console.warn('face warm-up cpu failed', e2); } }
    }catch(e){
      addMsg('Face Recognition models load fail: ' + (e.message||'error'), 'bot');
    }
    faceRecogModelsLoading = false;
    _faceModelsPromise = null; // fail hua to agli baar dobara try ho sake
    return faceRecogModelsLoaded;
  })();
  return _faceModelsPromise;
}

async function deleteKnownFace(name){
  const gone = knownFaces.filter(f => f.name === name);
  for(const g of gone){ try{ await FaceDB.addTomb(g.id); }catch(e){ console.warn('tombstone fail', e); } }

  FacePipeline.reset(); // BUG FIX: delete ke baad bhi cached track purana naam bolta rehta tha

}

async function startGestureCamera(){
  const video = document.getElementById('gestureVideo');

function drawGesture(video, result){
  const canvas = document.getElementById('gestureCanvas');
  if(!canvas) return;
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!result || !result.landmarks) return;
  result.landmarks.forEach((landmarks, i) => {
    const handed = (result.handednesses && result.handednesses[i] && result.handednesses[i][0])
      ? result.handednesses[i][0].categoryName : '';
    const color = handed === 'Right' ? '#3ee6c4' : '#ff8a8a';
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    // simple connections approx
    const edges = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
    edges.forEach(([a,b]) => {
      if(!landmarks[a]||!landmarks[b]) return;
      ctx.beginPath();
      ctx.moveTo(landmarks[a].x*canvas.width, landmarks[a].y*canvas.height);
      ctx.lineTo(landmarks[b].x*canvas.width, landmarks[b].y*canvas.height);
      ctx.stroke();
    });
    landmarks.forEach(pt => {
      ctx.beginPath();
      ctx.arc(pt.x*canvas.width, pt.y*canvas.height, 3, 0, Math.PI*2);
      ctx.fill();
    });
  });
}

/* =====================================================
   DEPTH ANYTHING (lite) — relative depth via simple monocular
   fallback: uses TF.js brightness/edge heuristic OR ONNX if available.
   Full DepthAnything ONNX ~25–100MB; here we provide panel + optional ORT.
===================================================== */
let depthStream = null;
let depthTimer = null;
let depthMode = 'approx'; // 'approx' | 'onnx' when model loaded
let depthOrtSession = null;
let depthLoading = false;

async function tryLoadDepthOnnx(){
  if(depthOrtSession || depthLoading) return;
  if(typeof ort === 'undefined') return;
  depthLoading = true;
  try{
    // Small public quantized DepthAnything demo model (may be unavailable offline)

    depthOrtSession = await ort.InferenceSession.create(url, { executionProviders: ['wasm'] });

  }

function depthApproxFrame(video, canvas){
  const w = 160, h = 120;
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d');
  octx.drawImage(video, 0, 0, w, h);
  const img = octx.getImageData(0,0,w,h);
  const data = img.data;
  // Inverse-brightness + center bias as crude relative depth heatmap
  const heat = new Float32Array(w*h);
  let min=1e9, max=-1e9;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i = (y*w+x)*4;
      const gray = (data[i]+data[i+1]+data[i+2])/3/255;
      const cx = (x/w-0.5), cy = (y/h-0.5);
      const center = 1 - Math.min(1, Math.sqrt(cx*cx+cy*cy)*1.4);
      // darker / lower texture ≈ farther heuristic (very rough)
      const v = (1-gray)*0.55 + center*0.45;
      heat[y*w+x] = v;
      if(v<min) min=v; if(v>max) max=v;
    }
  }
  const ctx = canvas.getContext('2d');
  const out = ctx.createImageData(canvas.width, canvas.height);
  const sx = canvas.width/w, sy = canvas.height/h;
  const range = Math.max(1e-6, max-min);
  for(let y=0;y<canvas.height;y++){
    for(let x=0;x<canvas.width;x++){
      const hx = Math.min(w-1, Math.floor(x/sx));
      const hy = Math.min(h-1, Math.floor(y/sy));
      const t = (heat[hy*w+hx]-min)/range;
      // turbo-ish colormap
      const r = Math.round(255*Math.min(1, t*2));
      const g = Math.round(255*Math.min(1, t<0.5 ? t*2 : (1-t)*2));
      const b = Math.round(255*Math.min(1, (1-t)*2));
      const o = (y*canvas.width+x)*4;
      out.data[o]=r; out.data[o+1]=g; out.data[o+2]=b; out.data[o+3]=180;
    }
  }
  ctx.putImageData(out, 0, 0);
  // estimate "near" distance proxy for center region
  let csum=0, cn=0;
  for(let y=Math.floor(h*0.35); y<Math.floor(h*0.65); y++){
    for(let x=Math.floor(w*0.35); x<Math.floor(w*0.65); x++){
      csum += (heat[y*w+x]-min)/range; cn++;
    }
  }
  const nearness = cn ? csum/cn : 0.5;
  const approxCm = Math.round(30 + (1-nearness)*350);
  const el = document.getElementById('depthEstimate');
  if(el) el.textContent = `Depth (center): ~${approxCm} cm`;
  // optionally feed ultrasonic-style narration source
  if(!isRealDataLive() && isSensorConnected()){
    // don't override real sensors
  }
}

  try{
