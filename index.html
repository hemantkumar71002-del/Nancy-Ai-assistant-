/* ---------- Single-intent matcher ----------
   Returns true if `text` matched something and was handled. Does NOT
   split multi-step or resolve context — that happens one level up in
   handleVoiceCommand(). */
function matchSingleVoiceIntent(text){
  if(!text) return false;

  // Object Finder: "Nancy, bottle dhundho" → Vision AI + camera + Object Finder ON
  { const extrasReply = NancyExtras.handle(text);
    if(extrasReply !== null){ voiceSay(extrasReply); return true; } }
  { const finderReply = ObjectFinder.handle(text);
    if(finderReply !== null){ voiceSay(finderReply); return true; } }

  // "it / that / isse / ise / isko / usse" → whatever we last opened/started
  const pronounRe = /\b(it|that|isse|ise|isko|usse|usko|is\s*(?:ko|ka|ki|se))\b/;
  if(pronounRe.test(text) && voiceContext.lastFeature){
    text = text.replace(pronounRe, voiceContext.lastFeature);
  }

  /* ---------- Menu control (with synonyms) ---------- */
  if(/^(open |go to )?hardware\s*(hub)?$|hardware\s*hub\s*kholo|^hardware\s*connect\s*karo$/.test(text)){ voiceOpenPanel('controller'); return true; }
  if(/^(open |go to |start )?vision\s*(ai)?$|vision\s*(ai\s*)?kholo|^camera\s*mode$|^object\s*detection\s*(chalu|start)\s*karo$|^start\s*vision$|^scan\s*surroundings$/.test(text)){
    voiceOpenPanel('objdepth');
    startObjDepthCamera();
    voiceContext.lastFeature = 'vision';
    voiceSay('Vision AI on kar diya, camera aur object detection dono chalu.');
    return true;
  }
  if(/^(open )?face\s*intelligence$|face\s*intelligence\s*kholo|^(open )?face\s*recognition$/.test(text)){ voiceOpenPanel('facetrim'); return true; }
  if(/^(open )?gesture\s*(ai)?$|gesture\s*(ai\s*)?kholo/.test(text)){ voiceOpenPanel('handbodygest'); return true; }
  if(/^(open )?smart\s*ocr$|smart\s*ocr\s*kholo|^open\s*ocr$/.test(text)){ voiceOpenPanel('ocr'); return true; }
  if(/^(open )?ai\s*brain$|ai\s*brain\s*kholo/.test(text)){ voiceOpenPanel('brain'); return true; }
  if(/^(open )?health\s*ai$|health\s*ai\s*kholo/.test(text)){ voiceOpenPanel('sensors'); return true; }
  if(/^(open )?lcd\s*(display)?$|lcd\s*(display\s*)?kholo/.test(text)){ voiceOpenPanel('lcd'); return true; }
  if(/^(open )?memory\s*vault$|memory\s*vault\s*kholo/.test(text)){ voiceOpenPanel('ltm'); return true; }
  if(/^(open )?ai\s*knowledge$|ai\s*knowledge\s*kholo/.test(text)){ voiceOpenPanel('kb'); return true; }
  if(/^close\s*menu$|menu\s*band\s*karo/.test(text)){ closePanel(); closeSidebar(); voiceSay('Closing menu.'); return true; }
  if(/^go\s*back$|wapas\s*jao|peeche\s*jao/.test(text)){ closePanel(); voiceSay('Going back.'); return true; }
  if(/^home$|^ghar$/.test(text)){ closePanel(); closeSidebar(); voiceSay('Home.'); return true; }

  /* ---------- Vision AI ---------- */
  if(/^start\s*camera$|camera\s*(chalu|start)\s*karo/.test(text)){
    if(currentPanel !== 'objdepth') openPanel('objdepth');
    startObjDepthCamera();
    voiceContext.lastFeature = 'camera';
    voiceSay('Starting camera.'); return true;
  }
  if(/^stop\s*camera$|camera\s*band\s*karo/.test(text)){
    stopObjDepthCamera();
    voiceSay('Stopping camera.'); return true;
  }
  if(/^start\s*object\s*detection$|object\s*detection\s*(chalu|start)\s*karo|^object\s*detect\s*karo$/.test(text)){
    if(currentPanel !== 'objdepth') openPanel('objdepth');
    startObjDepthCamera();
    voiceContext.lastFeature = 'object detection';
    voiceSay('Starting object detection.'); return true;
  }
  if(/^stop\s*object\s*detection$|object\s*detection\s*band\s*karo/.test(text)){
    stopObjDepthCamera();
    voiceSay('Stopping object detection.'); return true;
  }
  if(/^start\s*face\s*recognition$|face\s*recognition\s*(chalu|start)\s*karo/.test(text)){
    if(currentPanel !== 'facetrim') openPanel('facetrim');
    startFaceTrimCamera();
    voiceContext.lastFeature = 'face recognition';
    voiceSay('Starting face recognition.'); return true;
  }
  if(/^start\s*ocr$|ocr\s*(chalu|start)\s*karo/.test(text)){
    AutoVision.enable(false);
    AutoVision.switchTo('ocr', 'voice command');
    voiceContext.lastFeature = 'ocr';
    return true;
  }
  if(/^read\s*text$|text\s*padho|padh\s*kar\s*sunao/.test(text)){
    if(!ocrStream){
      AutoVision.switchTo('ocr', 'voice read text');
    }
    const t = PerceptionState.lastOcrText();
    voiceSay(t ? ('Text: ' + t) : 'Abhi koi text read nahi hua — book ko camera ke saamne rakho.');
    return true;
  }
  if(/^auto\s*mode$|auto\s*mode\s*(chalu|on)|automatic\s*mode/.test(text)){
    AutoVision.enable(true);
    return true;
  }
  if(/^auto\s*mode\s*(band|off)|stop\s*auto/.test(text)){
    AutoVision.enable(false);
    voiceSay('AUTO mode band.');
    return true;
  }

  /* ---------- Generic start/stop for last-used feature ("start it" / "stop it") ---------- */
  if(/^start\s*(it|that)$/.test(text) && voiceContext.lastFeature){
    return matchSingleVoiceIntent(`start ${voiceContext.lastFeature}`.replace('start vision','start camera'));
  }
  if(/^stop\s*(it|that)$/.test(text) && voiceContext.lastFeature){
    if(/camera|vision|object/.test(voiceContext.lastFeature)){ stopObjDepthCamera(); voiceSay('Stopping.'); return true; }
  }

  /* ---------- Hardware (with synonyms) ---------- */
  if(/^connect\s*bluetooth$|bluetooth\s*(jodo|connect\s*karo)|^bluetooth\s*on\s*(kar\s*do|karo)$/.test(text)){
    connectBluetooth();
    voiceContext.lastFeature = 'bluetooth';
    return true;
  }
  if(/^disconnect\s*bluetooth$|bluetooth\s*(hatao|disconnect\s*karo)/.test(text)){
    askConfirmation('Disconnect Bluetooth', () => { disconnectBluetooth(); voiceSay('Bluetooth disconnected.'); });
    return true;
  }
  if(/^(connect\s*esp32|esp\s*connect\s*karo|esp32\s*(jodo|connect\s*karo)|pair\s*controller|hardware\s*connect\s*karo)$/.test(text)){
    const ipField = document.getElementById('ipEsp32');
    const ip = ipField ? ipField.value.trim() : '';
    voiceContext.lastFeature = 'esp32';
    if(!ip){
      voiceSay('ESP32 IP address is not set. Open Hardware Hub and enter the IP first.');
    } else {
      connectWifiDevice('wifiEsp32', ip, 'ESP32');
    }
    return true;
  }
  if(/^disconnect\s*esp32$|esp32\s*disconnect\s*karo/.test(text)){
    askConfirmation('Disconnect ESP32', () => { disconnectWifiDevice('wifiEsp32', 'ESP32'); voiceSay('ESP32 disconnected.'); });
    return true;
  }
  if(/^show\s*sensor\s*data$|sensor\s*data\s*dikhao/.test(text)){
    voiceOpenPanel('sensors'); return true;
  }
  if(/^read\s*distance$|distance\s*batao/.test(text)){
    if(!isSensorConnected()) voiceSay('No sensor is connected.');
    else if(sensors.ultrasonic.value === null) voiceSay('Distance data is not available yet.');
    else voiceSay(`Distance is ${sensors.ultrasonic.value} centimeters.`);
    return true;
  }
  if(/^read\s*temperature$|temperature\s*batao/.test(text)){
    if(!isSensorConnected()) voiceSay('No sensor is connected.');
    else if(sensors.temperature.value === null) voiceSay('Temperature data is not available yet.');
    else voiceSay(`Temperature is ${sensors.temperature.value} degrees Celsius.`);
    return true;
  }
  if(/^read\s*heart\s*rate$|heart\s*rate\s*batao|dhadkan\s*batao/.test(text)){
    if(!isSensorConnected()) voiceSay('No sensor is connected.');
    else if(sensors.heartRate.value === null) voiceSay('Heart rate data is not available yet.');
    else voiceSay(`Heart rate is ${sensors.heartRate.value} beats per minute.`);
    return true;
  }

  /* ---------- Parameterized hardware commands ---------- */
  if(/^brightness\b/.test(text)){
    const { percent } = extractParams(text);
    if(percent === undefined){ voiceSay('Brightness kitne percent karu? Jaise "brightness 70%".'); return true; }
    const sent = HardwareCommander.sendAndConfirm({ action:'set_brightness', value: percent });
    if(!sent) voiceSay(`Brightness ${percent}% set karne ki koshish ki, par koi hardware connect nahi hai abhi.`);
    return true;
  }
  if(/^volume\b/.test(text)){
    const { percent } = extractParams(text);
    if(percent === undefined){ voiceSay('Volume kitna karu? Jaise "volume 40".'); return true; }
    voiceVolume = Math.max(0, Math.min(1, percent / 100));
    voiceSay(`Volume ${percent}% set kar diya.`);
    return true;
  }
  if(/^(move|chalo|badho)\b/.test(text)){
    const { meters, direction } = extractParams(text);
    const dir = direction || 'forward';
    const sent = HardwareCommander.sendAndConfirm({ action:'move', direction: dir, distance_m: meters || null });
    voiceSay(sent
      ? `Moving ${dir}${meters ? ' ' + meters + ' meters' : ''}.`
      : `Move command bana diya, par koi hardware connect nahi hai — ${dir}${meters ? ' ' + meters + ' meters' : ''} nahi bhej paayi.`);
    return true;
  }
  if(/^turn\b/.test(text)){
    const { degrees, direction } = extractParams(text);
    const dir = direction || 'left';
    const sent = HardwareCommander.sendAndConfirm({ action:'turn', direction: dir, degrees: degrees || 90 });
    voiceSay(sent
      ? `Turning ${dir} ${degrees || 90} degrees.`
      : `Turn command bana diya, par koi hardware connect nahi hai.`);
    return true;
  }

  /* ---------- Risky commands: require explicit confirmation ---------- */
  if(/^erase\s*memory$|memory\s*erase\s*karo|memory\s*mita\s*do/.test(text)){
    askConfirmation('Erase memory', () => {
      MemoryManager.data = { userName:null, favouriteLanguage:null, facts:{}, learnedCommands:{}, knownFaces:[], devices:[], history:[] };
      MemoryManager.save();
      voiceSay('Memory erase kar di.');
    });
    return true;
  }
  if(/^reset\s*settings$|settings\s*reset\s*karo/.test(text)){
    askConfirmation('Reset settings', () => {
      try{ localStorage.removeItem(MemoryManager.KEY); }catch(e){}
      voiceSay('Settings reset kar di. Page reload karne par defaults wapas aa jayenge.');
    });
    return true;
  }
  if(/^disconnect\s*(esp32|hardware)$/.test(text)){
    askConfirmation('Disconnect ESP32', () => { disconnectWifiDevice('wifiEsp32', 'ESP32'); voiceSay('ESP32 disconnected.'); });
    return true;
  }

  /* ---------- Voice control ---------- */
  if(/^voice\s*on$/.test(text)){
    voiceState.enabled = true;
    updateVoiceToggleUI();
    voiceSay('Voice is on.'); return true;
  }
  if(/^voice\s*off$/.test(text)){
    voiceSay('Voice is off.');
    voiceState.enabled = false;
    updateVoiceToggleUI();
    if('speechSynthesis' in window) speechSynthesis.cancel();
    return true;
  }
  if(/^mute$/.test(text)){
    voiceSay('Muted.');
    voiceVolume = 0;
    return true;
  }
  if(/^increase\s*volume$/.test(text)){
    voiceVolume = Math.min(1, voiceVolume + 0.2);
    voiceSay('Volume increased.'); return true;
  }

  /* ---------- AI reasoning chains: goal-oriented sentences that imply
     several steps, e.g. "mujhe saamne kya hai dekhna hai" (what's in front
     of me) → camera on → vision open → detect → speak result. ---------- */
  if(/saamne\s*kya\s*hai|what'?s?\s*(is\s*)?in\s*front|kya\s*dikh\s*raha\s*hai|object\s*(ki\s*)?detail|detail\s*(me\s*)?bata|describe\s*(the\s*)?(scene|objects?)/.test(text)){
    const wasRunning = !!objDepthStream;
    if(currentPanel !== 'objdepth') openPanel('objdepth');
    if(!wasRunning){
      startObjDepthCamera();
      voiceContext.lastFeature = 'vision';
      voiceSay('Camera on kar rahi hoon, turant details bataungi...');
    }
    voiceContext.lastFeature = 'vision';
    // Poll fast (every 150ms, up to ~2.5s) instead of a fixed wait — replies
    // the moment the model has something, so it's quick when camera is
    // already running and still responsive on a cold start.
    let waited = 0;
    const poll = setInterval(() => {
      waited += 150;
      if((lastDetections && lastDetections.length) || waited >= 2500){
        clearInterval(poll);
        // narration cycle (detect -> bolo -> refresh) khud pehli baar bolegi; pehle se ON ho to abhi bol do
        if(!objectNarrationOn) startObjectNarration();
        else voiceSay(buildObjectDetailsSpeech());
      }
    }, 150);
    return true;
  }
  if(/live\s*narration\s*(band|stop)|narration\s*band\s*karo|stop\s*narrating|chup\s*ho\s*jao/.test(text)){
    stopObjectNarration();
    voiceSay('Live narration band kar di.');
    if(currentPanel === 'objdepth') renderObjDepthPanel();
    return true;
  }

  /* ---------- Generic hardware-not-connected fallback (e.g. "start lidar") ---------- */
  const hwWordMatch = text.match(/^start (\w+)$/);
  if(hwWordMatch){
    const word = hwWordMatch[1];
    voiceSay(`${word[0].toUpperCase()}${word.slice(1)} hardware is not connected.`);
    return true;
  }

  return false;
}

/* ---------- Top-level handler ----------
   Handles: pending-confirmation replies, multi-step splitting, and fuzzy
   fallback for anything the exact patterns above miss. */
function handleVoiceCommand(rawText){
  const raw = normalizeVoiceText(rawText);
  if(!raw) return false;

  // A risky command is awaiting yes/no — resolve that before anything else.
  if(pendingConfirmation){
    if(isYes(raw)){
      const { run } = pendingConfirmation;
      pendingConfirmation = null;
      run();
      return true;
    }
    if(isNo(raw)){
      pendingConfirmation = null;
      voiceSay('Theek hai, cancel kar diya.');
      return true;
    }
    // anything else while a confirmation is pending: nudge, don't silently drop it
    voiceSay('Pehle bolo Yes ya No — chahiye ya nahi?');
    return true;
  }

  const steps = splitVoiceSteps(raw);
  let handledAny = false;
  for(const step of steps){
    if(matchSingleVoiceIntent(step)){ handledAny = true; continue; }
    // exact match failed — retry once with fuzzy-corrected words
    const fuzzy = fuzzyNormalize(step);
    if(fuzzy !== step && matchSingleVoiceIntent(fuzzy)){ handledAny = true; continue; }
  }
  return handledAny;
}

/* ---------- Wake word: "Nancy, <command>" — hands-free, always listening.
   After the wake word, stays in an active listening window (~25s) so you
   can give several commands without repeating "Nancy" each time. ---------- */
let wakeModeEnabled = false;
let wakeRecognizer = null;
let pushToTalkActive = false;
let activeListenUntil = 0; // timestamp; while now < this, no wake word needed

function buildWakeRecognizer(){
  if(!SpeechRecognitionAPI) return null;
  const r = new SpeechRecognitionAPI();
  r.lang = 'hi-IN';
  r.continuous = true;
  r.interimResults = false;
  r.maxAlternatives = 4;
  // "nancy" often gets mis-heard by the recognizer (nensy, nanci, nasi...) —
  // check every alternative transcript, not just the top guess.
  const WAKE_WORD_RE = /\b(nancy|nensy|nansy|nanci|nensi|nasi|nency)\b[,]?\s*(.*)/i;
  r.onresult = (e) => {
    for(let i = e.resultIndex; i < e.results.length; i++){
      const inActiveWindow = Date.now() < activeListenUntil;
      let cmd = null;
      for(let a = 0; a < e.results[i].length; a++){
        const transcript = e.results[i][a].transcript || '';
        const m = transcript.match(WAKE_WORD_RE);
        if(m){ cmd = (m[2] || '').trim(); break; }
        if(inActiveWindow && a === 0){
          // already inside the post-wake-word window: no need to say "Nancy" again
          cmd = transcript.trim();
        }
      }
      if(cmd === null) continue; // outside window and no wake word heard — ignore
      activeListenUntil = Date.now() + 25000; // extend the window on every command
      if(!cmd){
        voiceSay('Ji, boliye.');
      } else {
        // try every alternative transcript for this result against the
        // command matcher before giving up
        let handled = handleVoiceCommand(cmd);
        if(!handled){
          for(let a = 1; a < e.results[i].length && !handled; a++){
            const alt = (e.results[i][a].transcript || '').replace(WAKE_WORD_RE, '$2').trim() || e.results[i][a].transcript;
            if(alt && alt !== cmd) handled = handleVoiceCommand(alt);
          }
        }
        if(!handled) voiceSay("Sorry, I didn't understand that command.");
      }
    }
  };
  r.onerror = () => { /* swallow — onend restarts */ };
  r.onend = () => {
    if(wakeModeEnabled && !pushToTalkActive){
      try{ r.start(); }catch(e){ /* already running */ }
    }
  };
  return r;
}

const wakeToggle = document.getElementById('wakeToggle');
function startWakeMode(){
  if(!SpeechRecognitionAPI){
    addMsg('Is browser me hands-free wake-word listening support nahi hai. Chrome try karo.', 'bot');
    return;
  }
  wakeModeEnabled = true;
  if(!wakeRecognizer) wakeRecognizer = buildWakeRecognizer();
  if(!pushToTalkActive){
    try{ wakeRecognizer.start(); }catch(e){ /* already running */ }
  }
  updateWakeToggleUI();
  addMsg('Wake word ON hai — bolo "Nancy" phir apni command, jaise "Nancy, open Vision AI." Uske baad ~25 sec tak bina "Nancy" bole bhi commands sun sakti hoon.', 'bot');
}
function stopWakeMode(){
  wakeModeEnabled = false;
  activeListenUntil = 0;
  if(wakeRecognizer){ try{ wakeRecognizer.stop(); }catch(e){} }
  updateWakeToggleUI();
}
function updateWakeToggleUI(){
  if(!wakeToggle) return;
  wakeToggle.classList.toggle('on', wakeModeEnabled);
  wakeToggle.classList.toggle('wake-on', wakeModeEnabled);
  const lab = document.getElementById('wakeStateLabel');
  if(lab) lab.textContent = wakeModeEnabled ? 'ON' : 'OFF';
}
if(wakeToggle){
  wakeToggle.addEventListener('click', () => {
    wakeModeEnabled ? stopWakeMode() : startWakeMode();
  });
}

/* ---------- Cloud API (any OpenAI-compatible key) ---------- */
const CloudAPI = {
  KEY: 'nancy_cloud_api_v1',
  data: { provider:'openai', apiKey:'', model:'', baseUrl:'', enabled:false },
  load(){
    try{
      const raw = localStorage.getItem(this.KEY);
      if(raw) this.data = Object.assign({}, this.data, JSON.parse(raw));
    }catch(e){}
  },
  save(){
    try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }catch(e){}
    updateApiKeyMenuUI();
  },
  clear(){
    this.data = { provider:'openai', apiKey:'', model:'', baseUrl:'', enabled:false };
    this.save();
  },
  defaults: {
    // NOTE (checked Sep 2026, see /backend/README.md for a fuller writeup):
    // - 'llama-3.3-70b-versatile' was shut down by Groq on 16 Aug 2026 for
    //   free/dev-tier usage, and Groq's current free text models (gpt-oss)
    //   don't support images at all — so Groq alone can't run this app's
    //   vision features (Object Detection cloud mode, OCR, Face help).
    // - Gemini is the only one of these four where ONE free key does
    //   BOTH text chat and image/vision in the same request — that's why
    //   it's the recommended default for "sab kaam ek hi API se" setups.
    openai:     { base:'https://api.openai.com/v1', model:'gpt-4o-mini' },
    groq:       { base:'https://api.groq.com/openai/v1', model:'openai/gpt-oss-120b' }, // text-only, no vision
    gemini:     { base:'https://generativelanguage.googleapis.com/v1beta/openai', model:'gemini-2.5-flash' },
    openrouter: { base:'https://openrouter.ai/api/v1', model:'openai/gpt-4o-mini' },
    custom:     { base:'', model:'' }
  },
  resolveBase(){
    if(this.data.provider === 'custom' && this.data.baseUrl) return this.data.baseUrl.replace(/\/+$/,'');
    return (this.defaults[this.data.provider] || this.defaults.openai).base;
  },
  resolveModel(){
    if(this.data.model && this.data.model.trim()) return this.data.model.trim();
    return (this.defaults[this.data.provider] || this.defaults.openai).model;
  },
  isReady(){
    return !!(this.data.enabled && this.data.apiKey && this.data.apiKey.trim());
  },
  buildSystemPrompt(){
    const bits = [
      'You are Nancy, a formal AI assistant.',
      'Always reply in clear, formal, professional English (1-3 sentences unless the user asks for more detail). Do not use romantic language, pet names, or flirtatious tone. Stay helpful, courteous, and neutral.'
    ];
    if(userName.value) bits.push('The user\'s name is ' + userName.value + '.');
    const lang = MemoryManager.getFavouriteLanguage && MemoryManager.getFavouriteLanguage();
    if(lang) bits.push('Their preferred language is ' + lang + '.');
    return bits.join(' ');
  },
  async reply(userMsg){
    if(!this.isReady()) return null;
    const base = this.resolveBase();
    const model = this.resolveModel();
    if(!base) return null;
    const history = MemoryManager.recentHistory(9).slice(0, -1);
    const messages = [{ role:'system', content: this.buildSystemPrompt() }];
    history.forEach(h => messages.push({ role: h.who === 'bot' ? 'assistant' : 'user', content: h.text }));
    messages.push({ role:'user', content: userMsg });
    try{
      const res = await fetch(base + '/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + this.data.apiKey.trim()
        },
        body: JSON.stringify({ model, messages, temperature: 0.7, max_tokens: 300 })
      });
      if(!res.ok){
        const errText = await res.text().catch(()=> '');
        console.warn('CloudAPI error', res.status, errText);
        addMsg('API error (' + res.status + '). Key / model / endpoint check karo.', 'bot');
        return null;
      }
      const data = await res.json();
      const text = data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content : null;
      return text ? String(text).trim() : null;
    }catch(e){
      console.warn('CloudAPI fetch failed', e);
      addMsg('API call fail ho gaya — internet / CORS / endpoint check karo.', 'bot');
      return null;
    }
  },
  async test(){
    if(!this.data.apiKey || !this.data.apiKey.trim()) return { ok:false, msg:'API key empty hai.' };
    const base = this.resolveBase();
    const model = this.resolveModel();
    if(!base) return { ok:false, msg:'Base URL set nahi hai (custom provider ke liye zaroori).' };
    try{
      const res = await fetch(base + '/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + this.data.apiKey.trim()
        },
        body: JSON.stringify({
          model,
          messages: [{ role:'user', content:'Reply with exactly: OK' }],
          max_tokens: 8,
          temperature: 0
        })
      });
      if(!res.ok){
        const t = await res.text().catch(()=> '');
        return { ok:false, msg: 'HTTP ' + res.status + (t ? ': ' + t.slice(0,120) : '') };
      }
      return { ok:true, msg: 'Connection OK — model "' + model + '" respond kar raha hai.' };
    }catch(e){
      return { ok:false, msg: (e && e.message) || 'Network / CORS error' };
    }
  },
  // Chhote crops (har detected box ka) bhej kar sahi naam puchhta hai. JSON array of strings return.
  // Fail / timeout / bad reply par null — caller COCO ka naam hi bolta hai.
  async nameCrops(crops, hints, timeoutMs){
    if(!this.isReady() || !crops.length) return null;
    const base = this.resolveBase(), model = this.resolveModel();
    if(!base) return null;
    const content = [{ type:'text', text:
      'You will get ' + crops.length + ' cropped photos, in order. A basic detector guessed these labels (may be wrong): ' +
      JSON.stringify(hints) + '. For EACH photo name the main object in 1 or 2 simple English words (lowercase, singular). ' +
      'If unsure write the closest everyday name. Reply with ONLY a JSON array of ' + crops.length + ' strings, nothing else.' }];
    crops.forEach(b64 => content.push({ type:'image_url', image_url:{ url:'data:image/jpeg;base64,' + b64 } }));
    const body = { model, messages:[{ role:'user', content }], max_tokens:300, temperature:0 };
    if(this.data.provider === 'gemini') body.reasoning_effort = 'none'; // thinking band — jaldi jawab
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const to = setTimeout(() => { try{ ctrl && ctrl.abort(); }catch(e){} }, timeoutMs || 5000);
    try{
      const res = await fetch(base + '/chat/completions', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + this.data.apiKey.trim() },
        body: JSON.stringify(body),
        signal: ctrl ? ctrl.signal : undefined
      });
      if(!res.ok){
        if(res.status === 429 || res.status >= 500) this.backoffUntil = Date.now() + 30000; // limit/server dikkat: 30s rukho
        return null;
      }
      const data = await res.json();
      let txt = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
      txt = String(txt || '').replace(/```json|```/g, '').trim();
      const a = txt.indexOf('['), b = txt.lastIndexOf(']');
      if(a < 0 || b < a) return null;
      const arr = JSON.parse(txt.slice(a, b + 1));
      if(!Array.isArray(arr) || arr.length !== crops.length) return null;
      return arr.map(x => String(x || '').toLowerCase().replace(/[^a-z0-9 \-]/g, '').trim().slice(0, 30));
    }catch(e){
      return null;
    }finally{
      clearTimeout(to);
    }
  },
  backoffUntil: 0,
  // Vision / multimodal analysis (for Online mode of Vision, Face, Gesture, OCR)
  async visionAnalyze(base64Jpeg, userPrompt, opts){
    if(!this.isReady()) return null;
    opts = opts || {};
    const base = this.resolveBase();
    const model = this.resolveModel();
    if(!base) return null;
    const img = { url: 'data:image/jpeg;base64,' + base64Jpeg };
    // 'detail' sirf OpenAI-style endpoints samajhte hain; baaki ignore kar dete hain
    if(opts.detail && (this.data.provider === 'openai' || this.data.provider === 'openrouter')) img.detail = opts.detail;
    const messages = [
      { role: 'user', content: [
          { type: 'text', text: userPrompt || 'Describe what you see in this image clearly and concisely.' },
          { type: 'image_url', image_url: img }
      ] }
    ];
    const body = { model, messages, max_tokens: opts.maxTokens || 200, temperature: 0.2 };
    if(this.data.provider === 'gemini') body.reasoning_effort = 'none'; // thinking band — jaldi jawab
    const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const to = setTimeout(() => { try{ ctrl && ctrl.abort(); }catch(e){} }, opts.timeoutMs || 12000);
    try{
      const res = await fetch(base + '/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + this.data.apiKey.trim()
        },
        body: JSON.stringify(body),
        signal: ctrl ? ctrl.signal : undefined
      });
      if(!res.ok){
        const errText = await res.text().catch(()=> '');
        console.warn('CloudAPI vision error', res.status, errText);
        if(res.status === 429 || res.status >= 500) this.backoffUntil = Date.now() + 20000;
        return 'Cloud vision error (' + res.status + '). Vision-capable model use karo (gpt-4o / gemini-2.0-flash / etc).';
      }
      const data = await res.json();
      const text = data.choices && data.choices[0] && data.choices[0].message
        ? data.choices[0].message.content : null;
      return text ? String(text).trim() : null;
    }catch(e){
      console.warn('CloudAPI vision failed', e);
      return (e && e.name === 'AbortError') ? 'Network / CORS error — cloud ne time par jawab nahi diya.' : 'Network / CORS error — internet check karo.';
    }finally{
      clearTimeout(to);
    }
  }
};

function updateOnlineModeUI(){
  const online = typeof CloudAPI !== 'undefined' && CloudAPI.isReady();
  // Sidebar items pe ONLINE badge dikhao
  document.querySelectorAll('.sb-item').forEach(item => {
    const panel = item.getAttribute('data-panel');
    // Settings (onlineai) panel always special
    let label = item.textContent.replace(/\s*\[ONLINE\]\s*$/,'').trim();
    if(online && panel !== 'onlineai'){
      item.innerHTML = label + ' <span style="color:#7CFC8B;font-size:10px;letter-spacing:0.5px;">[ONLINE]</span>';
    } else if(panel === 'onlineai' && online){
      item.innerHTML = label + ' <span style="color:#7CFC8B;font-size:10px;">● ACTIVE</span>';
    } else {
      item.textContent = label;
    }
  });

// FIX: Vision AI / Face Intelligence / Gesture AI / Smart OCR har ek apna

function stopAllCameraStreams(exceptPanel){
  if(exceptPanel !== 'objdepth' && typeof stopObjDepthCamera === 'function') stopObjDepthCamera();
  if(exceptPanel !== 'facetrim' && typeof stopFaceTrimCamera === 'function') stopFaceTrimCamera();
  if(exceptPanel !== 'handbodygest' && typeof stopHbgCamera === 'function') stopHbgCamera();
  if(exceptPanel !== 'ocr' && typeof stopOcrCamera === 'function') stopOcrCamera();
}
const CAMERA_PANELS = ['objdepth', 'facetrim', 'handbodygest', 'ocr'];
// AUTO CAMERA ON: in panels ka camera ab khud start ho jaata hai, button
// dabane ki zarurat nahi. Manual Start/Stop button abhi bhi kaam karta hai
// agar user beech me khud band/chalu karna chahe.
function startCameraForPanel(name){
  if(name === 'objdepth' && typeof startObjDepthCamera === 'function') startObjDepthCamera();
  else if(name === 'facetrim' && typeof startFaceTrimCamera === 'function') startFaceTrimCamera();
  else if(name === 'handbodygest' && typeof startHbgCamera === 'function') startHbgCamera();
  else if(name === 'ocr' && typeof startOcrCamera === 'function') startOcrCamera();
}
// AUTO CAMERA OFF: app background/minimize me jaate hi camera turant band ho
// jaata hai (battery + privacy ke liye), aur foreground me wapas aane par
// agar koi camera-panel khula tha to camera khud phir se chalu ho jaata hai.
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    stopAllCameraStreams(null);
  } else if(currentPanel && CAMERA_PANELS.includes(currentPanel)){
    startCameraForPanel(currentPanel);
  }
});
let healthView = 'list'; // Health AI page: 'list' ya kisi sensor ka key
async function openPanel(name){
  if(name === 'sensors' && currentPanel !== 'sensors') healthView = 'list';
  // FIX: if the user manually navigates to a panel AutoVision doesn't drive
  // (Health AI, Alerts, etc.), that's an explicit "I'm done watching"
  // signal too — otherwise AutoVision's background tick() would notice the
  // camera is off ~900ms later and yank the user back into Vision AI.
  if(typeof AutoVision !== 'undefined' && AutoVision.enabled && !CAMERA_PANELS.includes(name)){
    AutoVision.enable(false);
  }
  const wasCameraPanel = currentPanel && CAMERA_PANELS.includes(currentPanel) && currentPanel !== name;
  if(currentPanel !== name){
    stopAllCameraStreams(name);
  }
  currentPanel = name;
  aiSchedPanelMode(name);
  panelOverlay.classList.add('open');
  renderPanel(name);
  clearInterval(panelRefreshTimer);
  if(CAMERA_PANELS.includes(name)){
    if(wasCameraPanel){
      // Switching from one camera panel straight to another — give the
      // previous stream's hardware a moment to actually release before
      // requesting a new one (Android WebView/H2APK doesn't always free
      // the camera the instant track.stop() is called).
      await new Promise(r => setTimeout(r, 250));
      if(currentPanel === name) startCameraForPanel(name);
    } else {
      startCameraForPanel(name);
    }
  }
  if(name === 'sensors' || name === 'alert' || name === 'lcd'
     || (name === 'activity' && currentActivityTab === 'sensor')
     || (name === 'brain' && currentBrainTab === 'tinyml')){
    panelRefreshTimer = setInterval(() => renderPanel(name), 1500);
  } else if(name === 'objdepth'){
    panelRefreshTimer = setInterval(updateObjDepthDistanceDisplay, 1500);
  }
}
function closePanel(){
  // FIX: AutoVision.watchTimer runs on its own setInterval and is NOT tied
  // to whether any panel is open. If AUTO mode was ever turned on, closing
  // this panel used to leave that timer running — 900ms later tick() would
  // see the camera is off and call switchTo('vision'), which force-reopens
  // Vision AI and restarts the camera itself. That's why it kept running
  // "in the background" until the whole app was killed. Closing the panel
  // is an explicit "stop watching" signal, so turn AUTO mode off with it.
  if(typeof AutoVision !== 'undefined' && AutoVision.enabled) AutoVision.enable(false);
  if(currentPanel === 'objdepth') stopObjDepthCamera();
  if(currentPanel === 'facetrim') stopFaceTrimCamera();
  if(currentPanel === 'handbodygest') stopHbgCamera();
  if(currentPanel === 'ocr') stopOcrCamera();
  panelOverlay.classList.remove('open');
  panelOverlay.classList.remove('page');
  clearInterval(panelRefreshTimer);
  currentPanel = null;
}
panelClose.addEventListener('click', closePanel);
panelOverlay.addEventListener('click', (e) => { if(e.target === panelOverlay) closePanel(); });

function renderPanel(name){

  if(name === 'kb') return renderKbPanel();
  if(name === 'brain') return renderBrainPanel();

}

const controllerStatus = { bluetooth: null, wifiEsp32: null, wifiNodemcu: null, serial: null };
const wifiSockets = { wifiEsp32: null, wifiNodemcu: null };

// ---- Web Serial (COM Port) state — HC-05 (OS-paired, appears as COM port) ya seedha USB dono ke liye ----
let serialPort = null;
let serialReader = null;
let serialKeepReading = false;
let serialReadLoopPromise = null;

const BLE_SERVICE_UUID = '12345678-1234-5678-1234-56789abcdef0';
const BLE_CHAR_UUID    = '12345678-1234-5678-1234-56789abcdef1';

      ${controllerStatus.wifiNodemcu ? '<button class="act stop" id="btnDisconnectNodemcu">Disconnect</button>' : ''}
      <div class="status-line ${controllerStatus.wifiNodemcu ? 'ok' : ''}">
        ${controllerStatus.wifiNodemcu ? 'Connected: ' + controllerStatus.wifiNodemcu : 'NodeMCU is not currently connected.'}
      </div>
    </div>

    <div style="margin-top:18px; border-top:1px solid var(--line); padding-top:12px;">
      <div style="color:var(--accent); font-size:11px; letter-spacing:1px; margin-bottom:8px;">SERIAL / COM PORT (HC-05 paired or USB)</div>

function disconnectBluetooth(){
  if(bleDevice && bleDevice.gatt.connected){
    bleDevice.gatt.disconnect(); // ye 'gattserverdisconnected' event trigger karega, jo cleanup khud kar dega
  } else {
    controllerStatus.bluetooth = null;
    bleDevice = null;
    bleCharacteristic = null;
    onSensorConnectionChanged();
    if(currentPanel === 'controller') renderControllerPanel();
  }
}

function disconnectWifiDevice(key, label){
  if(wifiSockets[key]){
    wifiSockets[key].onclose = null; // manual disconnect, dobara error msg mat dikhao
    wifiSockets[key].close();
    wifiSockets[key] = null;
  }
  controllerStatus[key] = null;
  addMsg(`${label} disconnect kar diya.`, 'bot');
  onSensorConnectionChanged();
  if(currentPanel === 'controller') renderControllerPanel();
}

async function connectBluetooth(){
  if(!navigator.bluetooth){
    addMsg("Ye browser Bluetooth support nahi karta. Chrome (Android/Desktop) try karo — iPhone/Safari me Web Bluetooth kaam nahi karta.", 'bot');
    return;
  }
  try{
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [BLE_SERVICE_UUID]
    });
    addMsg(`"${device.name || 'Device'}" se pairing ho rahi hai...`, 'bot');

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(BLE_SERVICE_UUID);
    const characteristic = await service.getCharacteristic(BLE_CHAR_UUID);
    await characteristic.startNotifications();
    characteristic.addEventListener('characteristicvaluechanged', onBleDataReceived);
    device.addEventListener('gattserverdisconnected', onBleDisconnected);

    bleDevice = device;
    bleCharacteristic = characteristic;
    controllerStatus.bluetooth = device.name || 'Unnamed device';
    MemoryManager.rememberDevice('bluetooth', controllerStatus.bluetooth);
    addMsg(`Bluetooth se "${controllerStatus.bluetooth}" par live connection ho gaya! Real sensor data ab yahin se aayega.`, 'bot');
    onSensorConnectionChanged();
  }catch(e){
    addMsg(`Bluetooth connection nahi ho paaya: ${e.message || 'cancel ya fail ho gaya'}.`, 'bot');
  }
  if(currentPanel === 'controller') renderControllerPanel();
}

function onBleDataReceived(event){
  const value = event.target.value; // DataView
  const text = new TextDecoder('utf-8').decode(value);
  // FIX: BLE notify packets often arrive in 20-byte pieces — JSON.parse on each piece failed silently. Buffer + reassemble.
  ingestSensorText('ble', text);
}

function onBleDisconnected(){
  addMsg("Bluetooth connection cut gaya.", 'bot');
  controllerStatus.bluetooth = null;
  bleDevice = null;
  bleCharacteristic = null;
  onSensorConnectionChanged();
  if(currentPanel === 'controller') renderControllerPanel();
}

// Real WiFi connection: ESP32/NodeMCU dono ek hi tarah se connect hote hain
// (dono par WebSocket server chalta hai — port 81, ws://<ip>:81/)
function connectWifiDevice(key, ip, label){
  if(!ip){
    addMsg(`Pehle ${label} ka IP address daalo.`, 'bot');
    return;
  }
  if(wifiSockets[key]){
    wifiSockets[key].close();
  }
  let opened = false;
  let socket;
  try{
    socket = new WebSocket(`ws://${ip}:81/`);
  }catch(e){
    addMsg(`${label} se connect nahi ho paaya — IP address check karo.`, 'bot');
    return;
  }
  wifiSockets[key] = socket;

  const connectTimeout = setTimeout(() => {
    if(!opened){
      socket.close();
      addMsg(`${label} (${ip}) se connection timeout ho gaya. Board aur browser same WiFi network par hone chahiye.`, 'bot');
    }
  }, 6000);

  socket.onopen = () => {
    opened = true;
    clearTimeout(connectTimeout);
    controllerStatus[key] = ip;
    MemoryManager.rememberDevice('wifi', `${label} (${ip})`);
    addMsg(`${label} se "${ip}" par live connection ho gaya! Real sensor data ab yahin se aayega.`, 'bot');
    onSensorConnectionChanged();
    if(currentPanel === 'controller') renderControllerPanel();
  };

  socket.onmessage = (event) => {
    if(typeof event.data !== 'string') return;
    ingestSensorText('ws:' + key, event.data + '\n');
  };

  socket.onerror = () => {
    if(!opened){
      const httpsHint = (location.protocol === 'https:') ? ' Note: ye page https par khula hai, isliye browser ws:// (non-secure) connection block kar sakta hai — app ko http:// / local se kholo.' : '';
      addMsg(`${label} (${ip}) se connect nahi ho paaya. IP sahi hai aur board WiFi par on hai, check karo.${httpsHint}`, 'bot');
    }
  };

  socket.onclose = () => {
    clearTimeout(connectTimeout);
    if(wifiSockets[key] !== socket) return; // FIX: purana socket band hua, naya chal raha hai — state mat todo
    if(opened){
      addMsg(`${label} se connection cut gaya.`, 'bot');
      controllerStatus[key] = null;
      wifiSockets[key] = null;
      onSensorConnectionChanged();
      if(currentPanel === 'controller') renderControllerPanel();
    }
  };
}

// ---- Web Serial (COM Port) — HC-05 (OS-paired) ya USB-wired board dono isi se connect hote hain ----
async function connectSerial(baudRate){
  if(!('serial' in navigator)){
    addMsg("Ye browser Web Serial support nahi karta. Chrome ya Edge (desktop) try karo — mobile browsers aur Firefox/Safari me ye kaam nahi karta.", 'bot');
    return;
  }
  if(serialPort){
    addMsg("Ek Serial device pehle se connect hai. Pehle usse disconnect karo.", 'bot');
    return;
  }
  try{
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: baudRate || 9600 });
    serialPort = port;
    serialKeepReading = true;
    controllerStatus.serial = `COM port @ ${baudRate || 9600} baud`;
    MemoryManager.rememberDevice('serial', controllerStatus.serial);
    addMsg(`Serial/COM port se connect ho gaya (HC-05 ya USB)! Real sensor data ab yahin se aayega.`, 'bot');
    onSensorConnectionChanged();
    if(currentPanel === 'controller') renderControllerPanel();
    serialReadLoopPromise = serialReadLoop();
  }catch(e){
    addMsg(`Serial/COM port connect nahi ho paaya: ${e.message || 'cancel ya fail ho gaya'}.`, 'bot');
  }
}

async function serialReadLoop(){
  const textDecoder = new TextDecoderStream();
  const readableClosed = serialPort.readable.pipeTo(textDecoder.writable).catch(() => {});
  serialReader = textDecoder.readable.getReader();
  serialLineBuffer = '';
  try{
    while(serialKeepReading){
      const { value, done } = await serialReader.read();
      if(done) break;
      if(value) ingestSensorText('serial', value);
    }
  }catch(e){
    // port unplug ya read error — neeche cleanup ho jayega
  }finally{
    try{ serialReader.releaseLock(); }catch(e){}
    await readableClosed;
  }
  // Loop khatam — agar user ne khud disconnect nahi kiya (yani device physically hat gaya), to yahan bata do
  if(controllerStatus.serial){
    addMsg("Serial/COM device se connection cut gaya (shayad unplug ho gaya ya HC-05 range se bahar chala gaya).", 'bot');
    controllerStatus.serial = null;
    serialPort = null;
    onSensorConnectionChanged();
    if(currentPanel === 'controller') renderControllerPanel();
  }
}

async function disconnectSerial(){
  if(!serialPort) return;
  serialKeepReading = false;
  try{ if(serialReader) await serialReader.cancel(); }catch(e){}
  if(serialReadLoopPromise) await serialReadLoopPromise;
  try{ await serialPort.close(); }catch(e){}
  serialPort = null;
  serialReader = null;
  controllerStatus.serial = null;
  addMsg("Serial/COM port disconnect kar diya.", 'bot');
  onSensorConnectionChanged();
  if(currentPanel === 'controller') renderControllerPanel();
}

// Board se aaya real JSON data seedha sensors object me daalo (random simulation ko override karta hai)
// ---- Incoming data reassembly + tolerant parsing (BLE chunks / Serial / WebSocket) ----
const sensorRxBuffers = {};
const lastRawPacket = { at:0, src:'', text:'' };
let unknownKeyWarnAt = 0;

// Board kisi bhi naam se bheje (distance/dist/ultrasonic, hr/bpm/pulse, temp, mq2...) — sab map ho jayega
const SENSOR_KEY_ALIASES = {
  ultrasonic:  ['distance','dist','ultrasonic','distancecm','distance_cm','range','cm'],
  heartRate:   ['heartrate','heart_rate','hr','bpm','pulse'],
  ecg:         ['ecg','ecgmv'],
  temperature: ['temperature','temp','bodytemp','body_temp','celsius'],
  gas:         ['gas','mq2','mq135','airquality','air_quality','ppm']
};

function ingestSensorText(src, chunk){
  let buf = (sensorRxBuffers[src] || '') + chunk;
  const objs = [];
  let depth = 0, start = -1, inStr = false, esc = false, consumed = 0;
  for(let i = 0; i < buf.length; i++){
    const c = buf[i];
    if(inStr){ if(esc) esc = false; else if(c === '\\') esc = true; else if(c === '"') inStr = false; continue; }
    if(c === '"' && depth > 0){ inStr = true; continue; }
    if(c === '{'){ if(depth === 0) start = i; depth++; }
    else if(c === '}' && depth > 0){
      depth--;
      if(depth === 0 && start >= 0){ objs.push(buf.slice(start, i + 1)); consumed = i + 1; start = -1; }
    }
  }
  let rest = buf.slice(consumed);
  const packets = [];
  objs.forEach(t => {
    lastRawPacket.at = Date.now(); lastRawPacket.src = src; lastRawPacket.text = t;
    try{ packets.push(JSON.parse(t)); }catch(e){ /* bad JSON — skip */ }
  });
  if(depth === 0){
    // JSON ke bahar plain-text lines: "Distance: 25 cm" / "temp=36.5"
    const lines = rest.split(/\r?\n/);
    rest = lines.pop(); // incomplete last line wait karega
    lines.forEach(line => {
      line = line.trim();
      if(!line) return;
      lastRawPacket.at = Date.now(); lastRawPacket.src = src; lastRawPacket.text = line;
      const obj = {}; let found = false, m;
      const re = /([A-Za-z_][A-Za-z_ ]*?)\s*[:=]\s*(-?\d+(?:\.\d+)?)/g;
      while((m = re.exec(line))){ obj[m[1].trim()] = Number(m[2]); found = true; }
      if(found) packets.push(obj);
    });
  } else {
    rest = buf.slice(start); // adhura JSON — agla chunk ka wait
  }
  if(rest.length > 4000) rest = '';
  sensorRxBuffers[src] = rest;
  const el = document.getElementById('rawPacketLine');
  if(el) el.textContent = 'Last data (' + lastRawPacket.src + '): ' + lastRawPacket.text.slice(0, 160);
  packets.forEach(p => { if(p && typeof p === 'object' && !Array.isArray(p)) applyLiveSensorData(p); });
}

// Board se aaya real JSON data seedha sensors object me daalo (random simulation ko override karta hai)
function applyLiveSensorData(data){
  // lowercase + flatten (e.g. {"sensors":{...}} / {"data":{...}})
  const flat = {};
  Object.entries(data).forEach(([k, v]) => {
    if(v && typeof v === 'object' && !Array.isArray(v) && k !== 'tinyml'){
      Object.entries(v).forEach(([k2, v2]) => { flat[String(k2).toLowerCase().replace(/\s+/g, '')] = v2; });
    } else {
      flat[String(k).toLowerCase().replace(/\s+/g, '')] = v;
    }
  });
  let updated = false;
  Object.entries(SENSOR_KEY_ALIASES).forEach(([sensorKey, aliases]) => {
    const jsonKey = aliases.find(a => flat[a] !== undefined);
    if(jsonKey === undefined || !sensors[sensorKey]) return;
    const raw = flat[jsonKey];
    const num = Number(raw);
    if(raw === null || raw === '' || !Number.isFinite(num)) return; // FIX: garbage/NaN ignore
    sensors[sensorKey].value = num;
    lastSensorDataAt = Date.now();
    recordSensorPoint(sensorKey, num);
    updated = true;
  });
  if(!updated){
    const ctrl = ['print','tinyml','voiceBtn','micBtn','appBtn','autoBtn','modeBtn','sosBtn','allBtn','mode','btn'];
    const keys = Object.keys(data);
    if(keys.length && !keys.some(k => ctrl.includes(k)) && Date.now() - unknownKeyWarnAt > 15000){
      unknownKeyWarnAt = Date.now();
      addMsg('Board se data aa raha hai par sensor keys samajh nahi aayi. Mili keys: ' + keys.join(', ') + '. Expected: distance, heartRate, ecg, temperature, gas.', 'bot');
    }
  }
  if(data.print !== undefined) applyLcdData(data.print);
  if(data.tinyml !== undefined) applyTinymlData(data.tinyml);
  // External hardware push buttons — ESP32 OR NodeMCU (WiFi/BLE/Serial).
  // Sirf teen controls (edge-triggered, ek baar per press):
  //   {"micBtn":true}           → mic toggle
  //   {"appBtn":true}           → app focus / fullscreen
  //   {"mode":"auto"} / {"autoBtn":true} / {"btn":3} → AUTO mode on/off toggle
  // Baaki vision modes (face/ocr/gesture) hardware button se nahi — menu/voice/auto se.
  // 6 external buttons (btn 1..6 or named keys):
  //   1 voiceBtn  → Voice ON/OFF      2 micBtn  → Mic ON/OFF
  //   3 autoBtn   → Auto AI ON/OFF    4 modeBtn → Vision→Face→OCR→Gesture
  //   5 sosBtn    → SOS emergency     6 allBtn  → All AI modes ON/OFF
  ['voice','mic','auto','mode','sos','all','app'].forEach(n => {
    if(data[n + 'Btn'] === true) dispatchHwButton(n);
  });
  if(data.mode !== undefined && data.mode !== null){
    const m = String(data.mode).toLowerCase().trim();
    if(m === 'auto' || m === 'automatic') dispatchHwButton('auto');
  }
  if(data.btn !== undefined && data.btn !== null){
    dispatchHwButton(HW_BTN_MAP[Number(data.btn)]);
  }
  if(!updated) return;
  logAndCheck();
  if(currentPanel === 'sensors' || currentPanel === 'alert' || (currentPanel === 'activity' && currentActivityTab === 'sensor')){
    renderPanel(currentPanel);
  }
  if(currentPanel === 'objdepth') updateObjDepthDistanceDisplay();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

/** Capture current frame from a <video> element as JPEG base64 (no data: prefix) */
let _capCanvas = null, _sigCanvas = null, _sigCtx = null;
// Cloud ke liye frame: pehle 480px/0.38 tha (dhundhla, text/chhoti cheezein kho jaati thin).
// Ab default 768px/0.72; OCR/one-shot ke liye opts={maxW:1280, quality:0.85}. Canvas reuse = kam GC.
function captureVideoFrameBase64(videoEl, quality, opts){
  if(!videoEl || !videoEl.videoWidth) return null;
  opts = opts || {};
  const maxW = opts.maxW || 768;
  const q = quality || opts.quality || 0.72;
  if(!_capCanvas) _capCanvas = document.createElement('canvas');
  const canvas = _capCanvas;
  const scale = Math.min(1, maxW / Math.max(videoEl.videoWidth, videoEl.videoHeight * 16 / 9));
  const w = Math.round(videoEl.videoWidth * scale), h = Math.round(videoEl.videoHeight * scale);
  if(canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(videoEl, 0, 0, w, h);
  const dataUrl = canvas.toDataURL('image/jpeg', q);
  return dataUrl.split(',')[1] || null;
}
// 16x12 grayscale signature — scene badla ya nahi (cloud call bachane ke liye). null = nahi bana.
function frameSignature(videoEl){
  try{
    if(!videoEl || !videoEl.videoWidth) return null;
    if(!_sigCanvas){ _sigCanvas = document.createElement('canvas'); _sigCanvas.width = 16; _sigCanvas.height = 12; _sigCtx = _sigCanvas.getContext('2d', { willReadFrequently: true }); }
    _sigCtx.drawImage(videoEl, 0, 0, 16, 12);
    const px = _sigCtx.getImageData(0, 0, 16, 12).data, sig = new Uint8Array(192);
    for(let i = 0, j = 0; i < 192; i++, j += 4) sig[i] = (px[j] * 77 + px[j+1] * 150 + px[j+2] * 29) >> 8;
    return sig;
  }catch(e){ return null; }
}
function signatureDiff(a, b){
  if(!a || !b) return 255;
  let d = 0; for(let i = 0; i < a.length; i++) d += Math.abs(a[i] - b[i]);
  return d / a.length;
}

/* ========== LIVE CLOUD VIDEO ANALYSIS ========== */
const LiveCloud = {
  timer: null,
  busy: false,
  active: false,
  videoId: null,
  prompt: null,
  resultBoxId: null,
  intervalMs: 1500, // check har ~1.5s, lekin cloud call tabhi jab scene badla ho
  lastSpokenResult: '',
  lastSig: null, lastCallAt: 0, lastResult: '', skipped: 0,
  MIN_DIFF: 6,        // avg gray difference (0-255) — isse kam = same scene
  MAX_STALE_MS: 15000, // same scene par bhi itne baad ek refresh

  isRunning(){ return !!this.timer; },

  stop(){
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
    this.active = false;
    this.busy = false;
    this.videoId = null;
    this.lastSpokenResult = '';
    this.lastSig = null; this.lastResult = '';
  },

  async tick(){
    if(this.busy || !this.active) return;
    if(!CloudAPI.isReady()){ this.stop(); return; }
    const video = document.getElementById(this.videoId);
    if(!video || !video.srcObject || !video.videoWidth){
      // camera stopped — stop live cloud too
      this.stop();
      return;
    }
    if(Date.now() < CloudAPI.backoffUntil) return; // rate-limit: thoda ruko
    // Scene wahi hai → cloud call skip (speed + quota). Result screen par pehle se hai.
    const sig = frameSignature(video);
    const now = Date.now();
    if(sig && this.lastSig && this.lastResult && signatureDiff(sig, this.lastSig) < this.MIN_DIFF
       && (now - this.lastCallAt) < this.MAX_STALE_MS){ this.skipped++; return; }
    this.busy = true;
    const statusEl = this.resultBoxId ? document.getElementById(this.resultBoxId) : null;
    try{
      const isOcr = this.videoId === 'ocrVideo';
      const b64 = captureVideoFrameBase64(video, null, isOcr ? { maxW:1280, quality:0.85 } : { maxW:768, quality:0.72 });
      if(!b64){ this.busy = false; return; }
      if(statusEl && !this.lastResult) statusEl.textContent = '☁️ Live cloud analyzing video…';
      this.lastSig = sig; this.lastCallAt = now;
      const result = await CloudAPI.visionAnalyze(b64, this.prompt, isOcr ? { maxTokens:700, detail:'high' } : { maxTokens:160, detail:'low' });
      if(result && !/^(Cloud vision error|Network)/.test(result) ) this.lastResult = result; else this.lastSig = null; // error par agli tick retry
      if(statusEl && result) statusEl.textContent = '☁️ ' + result;
      // FIX: Live Cloud Vision is a real vision-language model, not a fixed
      // 80-class detector like COCO-SSD — it can name things COCO-SSD has
      // never heard of (donkey, cart, rickshaw, etc). That was only ever
      // shown as silent on-screen text though, so for a blind/low-vision
      // user it was effectively invisible. Speak it too (for the object
      // detection panel), skipping repeats so it doesn't narrate the same
      // scene over and over.
      if(result && this.videoId === 'objDepthVideo' && voiceState && voiceState.enabled
         && result !== this.lastSpokenResult){
        this.lastSpokenResult = result;
        voiceSay('Cloud vision: ' + result);
      }
    }catch(e){
      if(statusEl) statusEl.textContent = 'Cloud live error: ' + (e.message || 'fail');
    }finally{
      this.busy = false;
    }
  },

  start(videoId, prompt, resultBoxId){
    this.stop();
    if(!CloudAPI.isReady()){
      addMsg('Pehle Settings panel se Cloud API enable + Save karo.', 'bot');
      return false;
    }
    const video = document.getElementById(videoId);
    if(!video || !video.srcObject || !video.videoWidth){
      addMsg('Pehle camera Start karo, phir Live Cloud ON karo.', 'bot');
      return false;
    }
    this.videoId = videoId;
    this.prompt = prompt;
    this.resultBoxId = resultBoxId;
    this.active = true;
    this.tick(); // immediate first frame
    this.timer = setInterval(() => this.tick(), this.intervalMs);
    addMsg('☁️ Live Cloud ON — video se har ~2s analysis ho rahi hai (fast mode).', 'bot');
    return true;
  },

  toggle(videoId, prompt, resultBoxId){
    if(this.isRunning() && this.videoId === videoId){
      this.stop();
      addMsg('☁️ Live Cloud OFF.', 'bot');
      return false;
    }
    return this.start(videoId, prompt, resultBoxId);
  },

  // Presets for each panel (used by auto mode)
  presets: {
    ocr: {
      videoId: 'ocrVideo',
      resultBoxId: 'ocrResultBox',
      prompt: 'Extract ALL readable text from this image accurately. Preserve line breaks if possible. If no text, say "No text detected". Reply only with the text.'
    },
    objdepth: {
      videoId: 'objDepthVideo',
      resultBoxId: 'objDepthEstimate',
      prompt: 'List main objects visible with positions (left/center/right). Keep very short (1-2 lines).'
    },
    facetrim: {
      videoId: 'faceTrimVideo',
      resultBoxId: 'faceTrimInfo',
      prompt: 'Describe faces: age range, expression, notable features. Keep very short (1-2 lines). If no face say so.'
    },
    hbg: {
      videoId: 'hbgVideo',
      resultBoxId: 'hbgInfo',
      prompt: 'Describe hand gestures and body pose briefly (1-2 lines). If unclear say so.'
    }
  },

  /** Auto: if Cloud API ready → start live cloud on this panel's video; else stay on local models */
  autoFor(panelKey){
    if(!CloudAPI.isReady()){
      // Offline / no API → local models only
      if(this.isRunning() && this.presets[panelKey] && this.videoId === this.presets[panelKey].videoId){
        this.stop();
      }
      return false;
    }
    const p = this.presets[panelKey];
    if(!p) return false;
    // already running on this video
    if(this.isRunning() && this.videoId === p.videoId) return true;
    // wait a moment for video to get dimensions
    setTimeout(() => {
      const video = document.getElementById(p.videoId);
      if(video && video.srcObject && video.videoWidth){
        this.start(p.videoId, p.prompt, p.resultBoxId);
      }
    }, 600);
    return true;
  },

  /** Call when camera stops or API is cleared */
  autoStopIf(videoId){
    if(this.isRunning() && this.videoId === videoId) this.stop();
  }
};

/** One-shot cloud analysis from current video frame */
async function runCloudVisionAnalyze(videoId, prompt, resultBoxId){
  if(!CloudAPI.isReady()){
    addMsg('Pehle Settings panel se Cloud API enable + Save karo.', 'bot');
    return;
  }
  const video = document.getElementById(videoId);
  if(!video || !video.srcObject || !video.videoWidth){
    addMsg('Pehle camera start karo, phir Cloud Analyze dabao.', 'bot');
    return;
  }
  const statusEl = resultBoxId ? document.getElementById(resultBoxId) : null;
  if(statusEl) statusEl.textContent = '☁️ Cloud analyze ho raha hai… thoda wait karo';
  const b64 = captureVideoFrameBase64(video, null, { maxW:1280, quality:0.85 });
  if(!b64){
    if(statusEl) statusEl.textContent = 'Frame capture fail.';
    return;
  }
  const result = await CloudAPI.visionAnalyze(b64, prompt, { maxTokens:600, detail:'high', timeoutMs:20000 });
  if(statusEl) statusEl.textContent = result || 'No result from cloud.';
  if(result) addMsg('☁️ Cloud: ' + result, 'bot');
}

function applyLcdData(text){

}

/* =====================================================
   TinyML MODEL — microcontroller (ESP32/NodeMCU) par
   TensorFlow Lite Micro / Edge Impulse / EloquentTinyML
   se inference ke results yahan live dikhte hain.
   Board JSON me "tinyml" key bhejta hai.
===================================================== */
let tinymlHistory = []; // {time, label, confidence, model, raw}
let lastTinyml = null;

function applyTinymlData(payload){
  if(payload === undefined || payload === null) return;
  const time = new Date().toLocaleTimeString('en-IN');
  let label = '', confidence = null, model = '', raw = payload;
  if(typeof payload === 'string' || typeof payload === 'number'){
    label = String(payload);
  } else if(typeof payload === 'object'){
    label = payload.label || payload.class || payload.prediction || payload.name || payload.result || '';
    confidence = (payload.confidence !== undefined) ? payload.confidence
               : (payload.score !== undefined) ? payload.score
               : (payload.prob !== undefined) ? payload.prob
               : (payload.probability !== undefined) ? payload.probability
               : null;
    model = payload.model || payload.modelName || payload.net || '';
    if(!label && payload.tinyml) label = String(payload.tinyml);
  }
  if(!label) label = JSON.stringify(payload);
  // confidence 0–1 ya 0–100 dono accept
  if(typeof confidence === 'number' && confidence > 1.0) confidence = confidence / 100;
  const entry = { time, label: String(label), confidence, model: String(model), raw };
  tinymlHistory.push(entry);
  if(tinymlHistory.length > 50) tinymlHistory = tinymlHistory.slice(-50);
  lastTinyml = entry;
  if(currentPanel === 'brain' && currentBrainTab === 'tinyml') renderBrainPanel();
  // Optional voice announce for high-confidence new labels
  if(voiceState.enabled && confidence !== null && confidence >= 0.75){
    const confPct = Math.round(confidence * 100);
    speak(`TinyML: ${label}, confidence ${confPct} percent`);
  }
}

function renderTinymlPanel(){
  panelTitle.textContent = 'TinyML MODEL';
  const connected = isSensorConnected();
  if(!connected && tinymlHistory.length === 0){
    panelBody.innerHTML = `
      <div class="status-line">⚠ Controller connect nahi hai.</div>`;
    return;
  }
  const latest = lastTinyml;
  const confStr = (latest && latest.confidence !== null && latest.confidence !== undefined)
    ? Math.round(latest.confidence * 100) + '%'
    : '—';
  const historyRows = tinymlHistory.slice(-20).reverse().map(l => {
    const c = (l.confidence !== null && l.confidence !== undefined) ? Math.round(l.confidence * 100) + '%' : '—';
    const m = l.model ? ` <span class="tinyml-badge">${escapeHtml(l.model)}</span>` : '';
    return `<div class="tinyml-line"><span class="tinyml-time">${l.time}</span><span class="tinyml-text">${escapeHtml(l.label)} (${c})${m}</span></div>`;
  }).join('');
  panelBody.innerHTML = `
    <div class="status-line ${connected ? 'ok' : ''}">
      ${connected
        ? 'Controller connected'
        : '⚠ Controller disconnect hai'}
    </div>
    <div class="tinyml-card">
      <div class="tinyml-label">${latest ? escapeHtml(latest.label) : 'Waiting for TinyML data...'}</div>
      <div class="tinyml-conf">Confidence: ${confStr}${latest && latest.model ? ' · Model: ' + escapeHtml(latest.model) : ''}</div>
      <div class="tinyml-meta">${latest ? 'Last update: ' + latest.time : ''}</div>
    </div>
    <div class="status-line" style="margin-top:12px;">Recent predictions (last 20)</div>
    <div class="tinyml-history">${historyRows || '<div class="status-line">Abhi tak koi TinyML prediction nahi aayi.</div>'}</div>
  `;
}

/* =====================================================
   AUTO VISION CONTROLLER
   Scene-driven mode selection (also triggered by hardware buttons
   / voice: "auto mode"). Watches COCO-SSD detections + hand
   presence and switches the active vision panel automatically:
     • person detected  → Face Intelligence
     • book detected    → Real-time OCR
     • hand-like cues   → Gesture AI (or when hand landmarks appear)
     • otherwise        → Object Detection stays active as the base
   Debounced so it doesn't thrash between panels every frame.
===================================================== */
const AutoVision = {
  enabled: false,
  current: null,          // 'vision' | 'face' | 'ocr' | 'gesture' | null
  lastSwitchAt: 0,
  minDwellMs: 4500,       // stay in a mode at least this long
  watchTimer: null,
  lastReason: '',

  enable(on){
    this.enabled = !!on;
    if(this.enabled){
      // Ensure base object detection is running so we can see the scene
      if(!objDepthStream){
        openPanel('objdepth');
        startObjDepthCamera();
      }
      clearInterval(this.watchTimer);
      this.watchTimer = setInterval(() => this.tick(), 900);
      this.lastReason = 'auto enabled';
      addMsg('AUTO mode ON — insaan → face, kitaab → OCR, haath → gesture.', 'bot');
    } else {
      clearInterval(this.watchTimer);
      this.watchTimer = null;
    }
    if(typeof updateAutoAiToggleUI === 'function') updateAutoAiToggleUI();
  },

  stopAll(){
    this.enable(false);
    try{ stopObjDepthCamera(); }catch(e){}
    try{ stopFaceTrimCamera(); }catch(e){}
    try{ stopHbgCamera(); }catch(e){}
    try{ stopOcrCamera(); }catch(e){}
    this.current = null;
  },

  switchTo(mode, reason){
    const now = Date.now();
    if(this.current === mode && (
      (mode === 'vision' && objDepthStream) ||
      (mode === 'face' && faceTrimStream) ||
      (mode === 'ocr' && ocrStream) ||
      (mode === 'gesture' && hbgStream)
    )) return;

    // Respect dwell time only when auto is driving the switch
    if(this.enabled && this.current && (now - this.lastSwitchAt) < this.minDwellMs){
      return;
    }

    // Stop whatever is not the target (keep cameras lean on mobile)
    if(mode !== 'vision'){ try{ stopObjDepthCamera(); }catch(e){} }
    if(mode !== 'face'){ try{ stopFaceTrimCamera(); }catch(e){} }
    if(mode !== 'ocr'){ try{ stopOcrCamera(); }catch(e){} }
    if(mode !== 'gesture'){ try{ stopHbgCamera(); }catch(e){} }

    this.current = mode;
    this.lastSwitchAt = now;
    this.lastReason = reason || mode;

    if(mode === 'vision'){
      openPanel('objdepth');
      startObjDepthCamera();
      addMsg('📷 Mode: Vision AI (object detection) — ' + this.lastReason, 'bot');
    } else if(mode === 'face'){
      openPanel('facetrim');
      startFaceTrimCamera();
      addMsg('🙂 Mode: Face Intelligence — ' + this.lastReason, 'bot');
    } else if(mode === 'ocr'){
      openPanel('ocr');
      startOcrCamera();
      addMsg('📖 Mode: Real-time OCR — ' + this.lastReason, 'bot');
    } else if(mode === 'gesture'){
      openPanel('handbodygest');
      startHbgCamera();
      addMsg('✋ Mode: Gesture AI — ' + this.lastReason, 'bot');
    }
  },

  tick(){
    if(!this.enabled) return;
    const dets = (typeof lastDetections !== 'undefined' && lastDetections) ? lastDetections : [];
    const classes = dets.map(d => d.class);

    // Priority: book → OCR, person → face, else if hands already seen → gesture, else vision
    const hasBook = classes.includes('book');
    const hasPerson = classes.includes('person');
    // Hand cue: COCO has no "hand" class; use gesture pipeline state or cell phone as weak cue.
    // Prefer real hand landmarks if gesture cam was recently running.
    const hasHand = (typeof lastHbgHandsCount !== 'undefined' && lastHbgHandsCount > 0) ||
                    (typeof lastHandsCount !== 'undefined' && lastHandsCount > 0);

    if(hasBook){
      this.switchTo('ocr', 'kitaab detect hui');
      return;
    }
    if(hasPerson){
      this.switchTo('face', 'insaan detect hua');
      return;
    }
    if(hasHand){
      this.switchTo('gesture', 'haath detect hua');
      return;
    }
    // Base layer: keep object detection alive so AutoVision can keep watching
    if(!objDepthStream){
      this.switchTo('vision', 'scene watch');
    }
  }
};

/* =====================================================
   OCR (Text Recognition) — Tesseract.js
   Image / Camera se text extract karta hai (on-device).
   Pehli baar language data download hota hai, baad me offline.
===================================================== */
let ocrWorker = null;
let ocrWorkerReady = false;
let ocrWorkerLoading = false;
let ocrHistory = []; // {time, text, confidence, lang}
let lastOcrResult = null;
let ocrStream = null;
let ocrTimer = null;
let ocrBusy = false;
let ocrLangPreferred = 'eng+hin';

async function ensureOcrWorker(lang){
  if(ocrWorker && ocrWorkerReady){
    try{
      await ocrWorker.reinitialize(lang);
      try{
        await ocrWorker.setParameters({
          tessedit_pageseg_mode: (typeof Tesseract !== 'undefined' && Tesseract.PSM) ? Tesseract.PSM.AUTO : '3',
          preserve_interword_spaces: '1',
        });
      }catch(e){}
      return ocrWorker;
    }catch(e){ /* recreate */ }
  }
  if(ocrWorkerLoading){
    for(let i=0;i<40 && ocrWorkerLoading;i++) await new Promise(r => setTimeout(r, 250));
    if(ocrWorker && ocrWorkerReady) return ocrWorker;
  }
  ocrWorkerLoading = true;
  try{
    if(ocrWorker){
      try{ await ocrWorker.terminate(); }catch(e){}
      ocrWorker = null;
    }
    ocrWorker = await Tesseract.createWorker(lang, 1, {
      logger: (m) => {
        if(m.status === 'recognizing text' && currentPanel === 'ocr'){
          const bar = document.getElementById('ocrProgressBar');
          const wrap = document.getElementById('ocrProgress');
          if(bar && wrap){
            wrap.classList.add('show');
            bar.style.width = Math.round((m.progress || 0) * 100) + '%';
          }
        }
      }
    });
    // Human-like reading: auto-detect layout (single column, paragraph, sparse
    // text, etc.) instead of assuming one block, keep real word spacing so
    // sentences read naturally, and don't let the dictionary "correct" words
    // it merely guessed at.
    try{
      await ocrWorker.setParameters({
        tessedit_pageseg_mode: (typeof Tesseract !== 'undefined' && Tesseract.PSM) ? Tesseract.PSM.AUTO : '3',
        preserve_interword_spaces: '1',
      });
    }catch(e){ console.warn('ocr setParameters failed', e); }
    ocrWorkerReady = true;
  }catch(e){
    ocrWorkerReady = false;
    ocrWorker = null;
    throw e;
  }finally{
    ocrWorkerLoading = false;
  }
  return ocrWorker;
}

async function runOcrOnImage(source, lang){
  const worker = await ensureOcrWorker(lang);
  const { data } = await worker.recognize(source);
  const time = new Date().toLocaleTimeString('en-IN');
  const entry = {
    time,
    text: (data.text || '').trim(),
    confidence: typeof data.confidence === 'number' ? data.confidence : null,
    lang
  };
  lastOcrResult = entry;
  ocrHistory.push(entry);
  if(ocrHistory.length > 30) ocrHistory = ocrHistory.slice(-30);
  return entry;
}

// Turns a raw camera frame into a clean, high-contrast black-on-white image —
// much closer to what a scanner produces, which is what Tesseract reads best.
// 1) grayscale  2) percentile contrast stretch (robust to uneven lighting)
// 3) light unsharp-mask sharpen (crisper letter edges)  4) Otsu binarization.
function preprocessForOcr(ctx, w, h){
  const id = ctx.getImageData(0, 0, w, h);
  const d = id.data;
  const n = w * h;
  const gray = new Uint8ClampedArray(n);
  for(let i=0, p=0; i<d.length; i+=4, p++){
    gray[p] = (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]) | 0;
  }
  // Percentile (2%-98%) contrast stretch — adapts to whatever lighting the
  // camera frame actually has, instead of assuming a fixed midpoint.
  const hist = new Uint32Array(256);
  for(let p=0; p<n; p++) hist[gray[p]]++;
  let cum = 0, lo = 0, hi = 255;
  const lowCut = n * 0.02;
  for(let v=0; v<256; v++){ cum += hist[v]; if(cum >= lowCut){ lo = v; break; } }
  cum = 0;
  const highCut = n * 0.02;
  for(let v=255; v>=0; v--){ cum += hist[v]; if(cum >= highCut){ hi = v; break; } }
  if(hi <= lo){ lo = 0; hi = 255; }
  const range = Math.max(1, hi - lo);
  for(let p=0; p<n; p++){
    let g = (gray[p] - lo) * 255 / range;
    gray[p] = g < 0 ? 0 : (g > 255 ? 255 : g);
  }
  // Light unsharp-mask sharpen so letter edges are crisper (helps Tesseract
  // separate touching characters and thin strokes).
  const sharp = new Uint8ClampedArray(n);
  const amount = 0.6;
  for(let y=0; y<h; y++){
    for(let x=0; x<w; x++){
      const idx = y*w + x;
      if(x===0 || y===0 || x===w-1 || y===h-1){ sharp[idx] = gray[idx]; continue; }
      const blur = (
        gray[idx-w-1] + gray[idx-w] + gray[idx-w+1] +
        gray[idx-1]   + gray[idx]   + gray[idx+1]   +
        gray[idx+w-1] + gray[idx+w] + gray[idx+w+1]
      ) / 9;
      let v = gray[idx] + (gray[idx] - blur) * amount;
      sharp[idx] = v < 0 ? 0 : (v > 255 ? 255 : v);
    }
  }
  // Otsu's method — finds the best black/white split automatically per frame,
  // giving Tesseract a clean scanner-like image instead of noisy grayscale.
  const hist2 = new Uint32Array(256);
  for(let p=0; p<n; p++) hist2[sharp[p]]++;
  let sum = 0; for(let t=0; t<256; t++) sum += t * hist2[t];
  let sumB = 0, wB = 0, maxVar = 0, threshold = 127;
  for(let t=0; t<256; t++){
    wB += hist2[t];
    if(wB === 0) continue;
    const wF = n - wB;
    if(wF === 0) break;
    sumB += t * hist2[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const varBetween = wB * wF * (mB - mF) * (mB - mF);
    if(varBetween > maxVar){ maxVar = varBetween; threshold = t; }
  }
  // Uneven roshni (parchhai / ek taraf andhera) me ek global threshold aadha page kaala kar deta hai.
  // 4x4 blocks ka mean dekho: bahut farak ho to local (Bradley) threshold, warna wahi Otsu.
  let bmin = 255, bmax = 0;
  const bw = Math.max(1, (w / 4) | 0), bh = Math.max(1, (h / 4) | 0);
  for(let by = 0; by < 4; by++) for(let bx = 0; bx < 4; bx++){
    let sm = 0, c = 0;
    for(let y = by * bh; y < Math.min(h, (by + 1) * bh); y += 4) for(let x = bx * bw; x < Math.min(w, (bx + 1) * bw); x += 4){ sm += sharp[y * w + x]; c++; }
    if(c){ const mv = sm / c; if(mv < bmin) bmin = mv; if(mv > bmax) bmax = mv; }
  }
  if(bmax - bmin > 45){
    const W1 = w + 1, integ = new Float64Array(W1 * (h + 1));
    for(let y = 0; y < h; y++){
      let row = 0;
      for(let x = 0; x < w; x++){ row += sharp[y * w + x]; integ[(y + 1) * W1 + x + 1] = integ[y * W1 + x + 1] + row; }
    }
    const r = Math.max(8, (w / 24) | 0);
    for(let y = 0, p = 0; y < h; y++){
      const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
      for(let x = 0; x < w; x++, p++){
        const x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
        const area = (x1 - x0) * (y1 - y0);
        const sum = integ[y1 * W1 + x1] - integ[y0 * W1 + x1] - integ[y1 * W1 + x0] + integ[y0 * W1 + x0];
        const v = (sharp[p] * area) < (sum * 0.88) ? 0 : 255;
        const k = p * 4; d[k] = d[k+1] = d[k+2] = v;
      }
    }
  } else {
    for(let i=0, p=0; i<d.length; i+=4, p++){
      const v = sharp[p] > threshold ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = v;
    }
  }
  ctx.putImageData(id, 0, 0);
}

async function startOcrCamera(){
  // Ensure panel is open so the <video id="ocrVideo"> exists in DOM
  if(currentPanel !== 'ocr'){
    openPanel('ocr');
    // Give render a moment so the video element is in the DOM
    await new Promise(r => setTimeout(r, 80));
  }
  const v = document.getElementById('ocrVideo');
  if(!v){
    console.error('ocrVideo element not found after openPanel');
    return;
  }
  try{
    if(ocrStream){
      // already running — just re-attach if needed
      await CamEngine.attachStream(v, ocrStream, false);
      return;
    }
    ocrStream = await CamEngine.getStream(false); // FORCE BACK camera
    await CamEngine.attachStream(v, ocrStream, false);
    ensureOcrWorker(ocrLangPreferred || 'eng+hin').catch(()=>{});
    clearInterval(ocrTimer);
    // Blind-friendly: faster local OCR ticks (~1.5s)
    if(typeof CloudAPI !== 'undefined' && CloudAPI.isReady()){
      ocrTimer = setInterval(ocrTick, 2500);
      LiveCloud.autoFor('ocr');
    } else {
      ocrTimer = setInterval(ocrTick, 1500);
    }
    try { if(typeof speak === 'function') speak('Back camera on. Point at text for reading.'); } catch(e){}
    if(currentPanel === 'ocr') renderOcrPanel();
  }catch(e){
    addMsg('Camera access nahi mil paaya (Smart OCR). Permission allow karo + H2APK me Camera permission ON karo.', 'bot');
    console.error('OCR cam error', e);
    ocrStream = null;
  }
}

function stopOcrCamera(){
  clearInterval(ocrTimer);
  ocrTimer = null;
  ocrBusy = false;
  LiveCloud.autoStopIf('ocrVideo');
  if(ocrStream){
    ocrStream.getTracks().forEach(t => t.stop());
    ocrStream = null;
  }
  if(currentPanel === 'ocr') renderOcrPanel();
}

let lastSpokenOcr = '';
let _ocrSig = null, _ocrSigAt = 0;
async function ocrTick(){
  if(ocrBusy || !ocrStream) return;
  const video = document.getElementById('ocrVideo');
  if(!video || video.readyState < 2) return;
  // Page/scene wahi hai → heavy Tesseract dobara mat chalao (offline me CPU/battery bachta hai); 12s baad refresh.
  const _sig = (typeof frameSignature === 'function') ? frameSignature(video) : null;
  if(_sig && _ocrSig && lastOcrResult && signatureDiff(_sig, _ocrSig) < 4 && (Date.now() - _ocrSigAt) < 12000) return;
  _ocrSig = _sig; _ocrSigAt = Date.now();
  ocrBusy = true;
  try{
    // Snapshot current frame to canvas for Tesseract
    const w = video.videoWidth || 640;
    const h = video.videoHeight || 480;
    const canvas = document.createElement('canvas');
    // Keep more detail for small/dense text — only downscale if the source
    // is larger than this, never upscale (upscaling adds no real detail).
    const scale = Math.min(1, 1400 / Math.max(w, 1));
    canvas.width = Math.max(1, Math.round(w * scale));
    canvas.height = Math.max(1, Math.round(h * scale));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    try {
      preprocessForOcr(ctx, canvas.width, canvas.height);
    } catch(e){ console.warn('ocr preprocess failed', e); }

    const langSel = document.getElementById('ocrLang');
    const lang = (langSel && langSel.value) || ocrLangPreferred;
    ocrLangPreferred = lang;

    const entry = await runOcrOnImage(canvas, lang);
    // Blind mode: speak new OCR text (avoid repeating same line)
    try {
      const t = (entry && entry.text) ? String(entry.text).trim() : '';
      if(t && t.length > 2 && t !== lastSpokenOcr && (entry.confidence == null || entry.confidence > 35)){
        lastSpokenOcr = t;
        if(typeof speak === 'function' && voiceState && voiceState.enabled) speak(t);
      }
    } catch(e){}
    const resultBox = document.getElementById('ocrResultBox');
    const status = document.getElementById('ocrStatusLine');
    if(resultBox && entry.text){
      resultBox.textContent = entry.text;
    }
    if(status){
      status.textContent = entry.text
        ? (`Live OCR · conf ${entry.confidence != null ? Math.round(entry.confidence) + '%' : '—'} · ${entry.time}`)
        : 'Live OCR running — text clear nahi dikh raha, book/page ko camera ke saamne stabil rakho.';
    }
    // Optional soft voice only when confidence is decent and text changed meaningfully
    if(voiceState.enabled && entry.text && entry.confidence != null && entry.confidence >= 55){
      const prev = (ocrHistory.length >= 2) ? ocrHistory[ocrHistory.length - 2].text : '';
      if(entry.text !== prev && entry.text.length > 8){
        const short = entry.text.length > 100 ? entry.text.slice(0, 100) + '...' : entry.text;
        speak('Text: ' + short);
      }
    }
    if(currentPanel === 'ocr'){
      const hist = document.getElementById('ocrHistoryBox');
      if(hist){
        hist.innerHTML = ocrHistory.slice(-12).reverse().map(l => {
          const conf = (l.confidence != null) ? Math.round(l.confidence) + '%' : '—';
          return `<div class="ocr-line"><span class="ocr-time">${l.time}</span><span class="ocr-text">${escapeHtml((l.text||'').slice(0,120)) || '(empty)'} (${conf})</span></div>`;
        }).join('') || '<div class="status-line">No readings yet.</div>';
      }
    }
  }catch(err){
    const status = document.getElementById('ocrStatusLine');
    if(status) status.textContent = 'OCR tick error: ' + (err.message || 'fail');
  }finally{
    ocrBusy = false;
    const progress = document.getElementById('ocrProgress');
