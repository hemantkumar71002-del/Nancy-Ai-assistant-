}

/* =====================================================
   COMBINED C) HAND + BODY POSE + GESTURE COMMANDS
   Ek camera: MediaPipe Hands + MoveNet + GestureRecognizer
===================================================== */
let hbgStream = null;
let hbgPoseTimer = null;
let hbgHandsCamera = null;
let hbgHandsRafId = null;
let hbgGestureRafId = null;
let lastHbgHandsCount = 0;
let lastHbgHandsLabels = [];
let lastHbgPoses = [];
let lastHbgGestureLabel = '';
let lastHbgGestureScore = 0;

let hbgStarting = false;
async function startHbgCamera(){
  if(hbgStarting) return;                       // FIX: double-tap par do stream nahi khulenge
  if(hbgStream){                                 // pehle se chal raha hai — sirf re-attach
    const v0 = document.getElementById('hbgVideo');
    if(v0) await CamEngine.attachStream(v0, hbgStream, false);
    return;
  }
  const video = document.getElementById('hbgVideo');
  if(!video) return;
  hbgStarting = true;
  try{
    hbgStream = await CamEngine.getStream(false);   // BACK camera
  }catch(e){
    hbgStream = null; hbgStarting = false;
    addMsg('Back camera nahi khul paaya (Gesture AI). Camera permission allow karo (APK me bhi). Error: ' + ((e && e.name) || 'unknown'), 'bot');
    return;
  }
  try{ await CamEngine.attachStream(video, hbgStream, false); }catch(e){ console.warn('hbg attach', e); }
  // FIX: camera turant dikhao — models (CDN se) baad me load hote hain
  if(currentPanel === 'handbodygest') renderHbgPanel();
  // FIX: har model alag try — ek fail ho to baaki chalte rahein, camera band na ho
  try{ if(!handsReady) await initHands(); }catch(e){ console.warn('initHands', e); }
  try{ if(!poseModelReady) await loadPoseDetector(); }catch(e){ console.warn('loadPoseDetector', e); }
  try{ if(!gestureReady) await initGestureRecognizer(); }catch(e){ console.warn('initGestureRecognizer', e); }
  hbgStarting = false;
  if(!hbgStream) return;                          // loading ke beech user ne stop kar diya
  startHbgHandsLoop(video);
  startHbgPoseLoop(video);
  startHbgGestureLoop(video);
  if(CloudAPI.isReady()) LiveCloud.autoFor('hbg');
  if(currentPanel === 'handbodygest') renderHbgPanel();
}

function stopHbgCamera(){
  clearInterval(hbgPoseTimer); hbgPoseTimer = null;
  if(hbgHandsCamera){ try{ hbgHandsCamera.stop(); }catch(e){} hbgHandsCamera = null; }
  if(hbgHandsRafId){ cancelAnimationFrame(hbgHandsRafId); hbgHandsRafId = null; }
  if(hbgGestureRafId){ cancelAnimationFrame(hbgGestureRafId); hbgGestureRafId = null; }
  LiveCloud.autoStopIf('hbgVideo');
  // FIX: MediaPipe's Camera utility silently replaces video.srcObject with
  // its own internal getUserMedia() stream, and Camera.stop() (above) never
  // releases that hardware track. Stop whatever stream is ACTUALLY on the
  // video element right now — this is why Vision AI's auto-switch-to-gesture
  // and Gesture AI's own camera were staying on after close.
  const hbgVideoEl = document.getElementById('hbgVideo');
  if(hbgVideoEl && hbgVideoEl.srcObject){
    hbgVideoEl.srcObject.getTracks().forEach(t=>t.stop());
    hbgVideoEl.srcObject = null;
  }
  if(hbgStream){ hbgStream.getTracks().forEach(t=>t.stop()); hbgStream = null; }
  lastHbgHandsCount = 0; lastHbgHandsLabels = []; lastHbgPoses = [];
  lastHbgGestureLabel = ''; lastHbgGestureScore = 0;
  if(currentPanel === 'handbodygest') renderHbgPanel();
}

function startHbgHandsLoop(_v0){
  const V = () => document.getElementById('hbgVideo') || _v0; // FIX: panel re-render se video node badalta hai
  if(!handsInstance) return;
  handsInstance.onResults((results) => {
    const canvas = document.getElementById('hbgHandsCanvas');
    if(!canvas || !V()) return;
    canvas.width = V().videoWidth || 640;
    canvas.height = V().videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    lastHbgHandsLabels = [];
    if(results.multiHandLandmarks && results.multiHandLandmarks.length){
      lastHbgHandsCount = results.multiHandLandmarks.length;
      for(let i = 0; i < results.multiHandLandmarks.length; i++){
        const landmarks = results.multiHandLandmarks[i];
        const handedness = (results.multiHandedness && results.multiHandedness[i])
          ? results.multiHandedness[i].label
          : ('Hand ' + (i + 1));
        lastHbgHandsLabels.push(handedness);
        const isRight = handedness === 'Right';
        const lineColor = isRight ? '#3ee6c4' : '#ff8a8a';
        const pointColor = isRight ? '#7CFC8B' : '#ffb0b0';
        if(typeof drawConnectors === 'function' && typeof HAND_CONNECTIONS !== 'undefined'){
          drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: lineColor, lineWidth: 2 });
        }
        if(typeof drawLandmarks === 'function'){
          drawLandmarks(ctx, landmarks, { color: pointColor, lineWidth: 1, radius: 3 });
        } else {
          ctx.fillStyle = pointColor;
          for(const pt of landmarks){
            ctx.beginPath();
            ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 2.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    } else {
      lastHbgHandsCount = 0;
    }
    ctx.restore();
    if(currentPanel === 'handbodygest') updateHbgInfo();
  });
  if(USE_MP_CAMERA_UTIL && typeof Camera !== 'undefined'){
    hbgHandsCamera = new Camera(V(), {
      onFrame: async () => { if(handsInstance) await handsInstance.send({ image: V() }); },
      width: 640, height: 480
    });
    hbgHandsCamera.start();
  } else {
    const loop = async () => {
      if(!hbgStream || !handsInstance) return;
      if(V().readyState >= 2){ try{ await handsInstance.send({ image: V() }); }catch(e){} }
      hbgHandsRafId = requestAnimationFrame(loop);
    };
    hbgHandsRafId = requestAnimationFrame(loop);
  }
}

function startHbgPoseLoop(_v0){
  const V = () => document.getElementById('hbgVideo') || _v0; // FIX: panel re-render se video node badalta hai
  clearInterval(hbgPoseTimer);
  hbgPoseTimer = setInterval(async () => {
    if(!V() || !poseDetector || V().readyState < 2) return;
    try{
      const poses = await poseDetector.estimatePoses(V(), {
        maxPoses: poseModelType === 'MULTIPOSE_LIGHTNING' ? 6 : 1,
        flipHorizontal: false,
      });
      lastHbgPoses = poses || [];
      const canvas = document.getElementById('hbgPoseCanvas');
      if(!canvas) return;
      const w = V().videoWidth || 640;
      const h = V().videoHeight || 480;
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, w, h);
      ctx.lineWidth = 3; ctx.font = '12px monospace';
      lastHbgPoses.forEach((pose, pi) => {
        const kps = {};
        (pose.keypoints || []).forEach(kp => { kps[kp.name] = kp; });
        ctx.strokeStyle = pi === 0 ? '#3ee6c4' : '#ff8a8a';
        POSE_CONNECTIONS.forEach(([a, b]) => {
          const ka = kps[a], kb = kps[b];
          if(!ka || !kb) return;
          if((ka.score || 0) < 0.3 || (kb.score || 0) < 0.3) return;
          ctx.beginPath(); ctx.moveTo(ka.x, ka.y); ctx.lineTo(kb.x, kb.y); ctx.stroke();
        });
        (pose.keypoints || []).forEach(kp => {
          if((kp.score || 0) < 0.3) return;
          ctx.fillStyle = '#7CFC8B';
          ctx.beginPath(); ctx.arc(kp.x, kp.y, 4, 0, Math.PI * 2); ctx.fill();
        });
      });
      if(currentPanel === 'handbodygest') updateHbgInfo();
    }catch(e){}
  }, 100);
}

function startHbgGestureLoop(_v0){
  const V = () => document.getElementById('hbgVideo') || _v0; // FIX: panel re-render se video node badalta hai
  if(!gestureRecognizer) return;
  const loop = () => {
    if(!hbgStream || !gestureRecognizer) return;
    if(V().readyState >= 2){
      try{
        const now = performance.now();
        const result = gestureRecognizer.recognizeForVideo(V(), now);
        const canvas = document.getElementById('hbgGestureCanvas');
        if(canvas){
          canvas.width = V().videoWidth || 640;
          canvas.height = V().videoHeight || 480;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0,0,canvas.width,canvas.height);
          // light dots only to avoid clutter with hands canvas
          if(result && result.landmarks){
            result.landmarks.forEach((landmarks) => {
              ctx.fillStyle = '#ffd166';
              landmarks.forEach(pt => {
                ctx.beginPath();
                ctx.arc(pt.x*canvas.width, pt.y*canvas.height, 2, 0, Math.PI*2);
                ctx.fill();
              });
            });
          }
        }
        if(result.gestures && result.gestures.length){
          const g = result.gestures[0][0];
          lastHbgGestureLabel = g.categoryName;
          lastHbgGestureScore = g.score;
          const el = document.getElementById('hbgGestureBadge');
          if(el) el.textContent = `${lastHbgGestureLabel} (${Math.round(lastHbgGestureScore*100)}%)`;
        } else {
          lastHbgGestureLabel = '';
          const el = document.getElementById('hbgGestureBadge');
          if(el) el.textContent = '—';
        }
      }catch(e){}
    }
    hbgGestureRafId = requestAnimationFrame(loop);
  };
  hbgGestureRafId = requestAnimationFrame(loop);
}

function updateHbgInfo(){
  const box = document.getElementById('hbgInfo');
  if(!box) return;
  let html = '';
  html += lastHbgHandsCount
    ? `<div class="face-row"><span class="fname">Hands</span><span class="fconf">${lastHbgHandsCount} · 21 pts</span></div>
       <div class="status-line" style="margin-top:4px;">${escapeHtml(lastHbgHandsLabels.map((l,i)=>`Hand #${i+1}: ${l}`).join(' · '))}</div>`
    : `<div class="status-line">No hands detected yet.</div>`;
  if(lastHbgPoses.length){
    html += lastHbgPoses.map((pose, i) => {
      const score = pose.score != null ? Math.round(pose.score * 100) + '%' : '—';
      const visible = (pose.keypoints || []).filter(k => (k.score || 0) >= 0.3).length;
      return `<div class="face-row" style="margin-top:6px;"><span class="fname">Pose #${i+1}</span><span class="fconf">${score} · ${visible}/17</span></div>`;
    }).join('');
  } else {
    html += `<div class="status-line" style="margin-top:6px;">No body pose detected yet.</div>`;
  }
  box.innerHTML = html;
}

      <div class="status-line" style="margin-top:10px;">${escapeHtml(LocalLLM.progressText || 'Loading...')} ${LocalLLM.progressPct ? '('+LocalLLM.progressPct+'%)' : ''}</div>
    ` : ''}

    <div style="margin-top:18px; border-top:1px solid var(--line); padding-top:12px;">
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" id="llmEnabledToggle" ${LocalLLM.enabled && LocalLLM.ready ? 'checked' : ''} ${!LocalLLM.ready ? 'disabled' : ''} />
        <span>Use Local LLM for chat replies (when ready)</span>
      </label>
      ${LocalLLM.ready ? '<button class="act stop" id="btnUnloadLlm" style="margin-top:10px;">Unload model</button>' : ''}
    </div>

  `;

  panelBody.querySelectorAll('[data-load-model]').forEach(btn => {
    btn.addEventListener('click', () => LocalLLM.load(btn.dataset.loadModel));
  });
  const toggle = document.getElementById('llmEnabledToggle');
  if(toggle){
    toggle.addEventListener('change', () => {
      LocalLLM.enabled = toggle.checked;
      renderLlmPanel();
    });
  }
  const btnUnload = document.getElementById('btnUnloadLlm');
  if(btnUnload) btnUnload.addEventListener('click', () => LocalLLM.unload());
}

/* =====================================================
   ULTRASONIC — CONTINUOUS VOICE NARRATION
   (aage diwar/car/insaan waghera bolkar batata hai)
===================================================== */
let ultrasonicNarrationOn = false;
let ultrasonicInterval = null;
const obstacleObjects = ['diwar', 'car', 'insaan', 'kursi', 'darwaza', 'khamba (pole)', 'table', 'bike'];

function startUltrasonicNarration(){
  if(!isSensorConnected()){
    addMsg("Pehle sensor/controller connect karo, tabhi ultrasonic voice alert kaam karega.", 'bot');
    return;
  }
  ultrasonicNarrationOn = true;
  narrateOnce(); // turant ek baar bolo
  ultrasonicInterval = setInterval(narrateOnce, 4000);
}
function stopUltrasonicNarration(){
  ultrasonicNarrationOn = false;
  clearInterval(ultrasonicInterval);
}
function narrateOnce(){
  if(!isSensorConnected()){
    stopUltrasonicNarration();
    return;
  }
  const distance = sensors.ultrasonic.value;
  if(distance === null) return; // reading abhi tak nahi aayi
  // Agar AI camera chalu hai aur kuch detect hua hai, to wahi asli object bolo;
  // warna purana fallback (random) object list use karo.
  const obj = lastDetections.length
    ? hindiObjName(lastDetections[0].class)
    : obstacleObjects[Math.floor(Math.random() * obstacleObjects.length)];
  let sentence;
  if(distance < 50){
    sentence = `Savdhan! Bahut paas — sirf ${distance} centimeter par ${obj} hai.`;
  } else if(distance < 150){
    sentence = `Aage ${distance} centimeter par ${obj} hai.`;
  } else {
    sentence = `Saamne ${obj} hai, taqriban ${(distance/100).toFixed(1)} meter door.`;
  }
  speak(sentence);
  const line = document.getElementById('ultraStatusLine');
  if(line) line.textContent = sentence;
}

// ---- Simple math evaluator (safe, no eval of arbitrary code) ----
function tryMath(msg){
  const cleaned = msg.replace(/[^0-9+\-*/().\s]/g, '');
  if(!cleaned.trim() || !/[0-9]/.test(cleaned)) return null;
  if(!/^[0-9+\-*/().\s]+$/.test(cleaned)) return null;
  try{
    // Restricted evaluation: only digits/operators allowed (checked above)
    const result = Function('"use strict";return (' + cleaned + ')')();
    if(typeof result === 'number' && isFinite(result)) return result;
  }catch(e){ return null; }
  return null;
}

/* ===================================================================
   PHASE 8 — LOCAL LANGUAGE MODEL (on-device, no API calls)
   Uses WebLLM (@mlc-ai/web-llm) to run a compact, quantized LLM fully
   inside the browser via WebGPU. First load downloads model weights
   (needs internet once), which the browser then caches (Cache API /
   IndexedDB) — after that it runs 100% offline, same philosophy as the
   OCR/vision models elsewhere in this app.

   Device-capability aware: only offered where navigator.gpu exists,
   and 3 model sizes are offered so low-end devices can pick something
   that actually fits. If unavailable/disabled/still loading, the
   chatbot gracefully falls back to the Phase-1 regex personality rules
   — the LLM only takes over the "natural chit-chat" fallback slot,
   never the deterministic memory/knowledge/vision/sensor/planning
   intents, which stay hard-wired for reliability.
=================================================================== */
const LocalLLM = {
  engine: null,
  loading: false,
  ready: false,
  enabled: false,          // user must explicitly turn it on (model download is heavy)
  currentModelId: null,
  progressText: '',
  progressPct: 0,
  models: [
    { id: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', label: 'Qwen2.5 0.5B', size: '~400 MB', note: 'Lightest option — suitable for low-end phones and laptops.' },
    { id: 'Llama-3.2-1B-Instruct-q4f16_1-MLC', label: 'Llama 3.2 1B', size: '~700 MB', note: 'Balanced — good speed and quality.' },
    { id: 'Phi-3.5-mini-instruct-q4f16_1-MLC', label: 'Phi-3.5 mini 3.8B', size: '~2.2 GB', note: 'Best quality — requires a stronger GPU and more RAM.' }
  ],
  supportCheck(){
    if(!('gpu' in navigator)){
      return { ok:false, reason:'This browser or device does not support WebGPU, so the local LLM cannot run here. Please try Chrome or Edge (desktop, or recent Android). Until then, replies will use the built-in rule-based personality system.' };
    }
    return { ok:true };
  },
  async load(modelId){
    if(this.loading) return;
    const support = this.supportCheck();
    if(!support.ok){ addMsg(support.reason, 'bot'); return; }
    this.loading = true; this.ready = false; this.progressText = 'Shuru ho raha hai...'; this.progressPct = 0;
    if(currentPanel === 'brain' && currentBrainTab === 'llm') renderBrainPanel();
    try{
      const webllm = await import('https://esm.run/@mlc-ai/web-llm');
      const engine = await webllm.CreateMLCEngine(modelId, {
        initProgressCallback: (p) => {
          this.progressText = p.text || '';
          this.progressPct = typeof p.progress === 'number' ? Math.round(p.progress*100) : this.progressPct;
          if(currentPanel === 'brain' && currentBrainTab === 'llm') renderBrainPanel();
        }
      });
      this.engine = engine;
      this.currentModelId = modelId;
      this.ready = true;
      this.enabled = true;
      addMsg(`Local LLM ("${modelId}") load ho gaya ✅ Ab natural, context-wale jawab de sakti hoon — is download ke baad se poori tarah offline chalega.`, 'bot');
    }catch(e){
      addMsg('Local LLM load fail ho gaya: ' + (e.message || 'unknown error') + '. Pehli baar model download ke liye internet chahiye hota hai — check karo aur dobara try karo.', 'bot');
      this.ready = false; this.engine = null; this.currentModelId = null;
    }
    this.loading = false;
    if(currentPanel === 'brain' && currentBrainTab === 'llm') renderBrainPanel();
  },
  unload(){
    if(this.engine && typeof this.engine.unload === 'function'){
      this.engine.unload().catch(()=>{});
    }
    this.engine = null; this.ready = false; this.currentModelId = null; this.enabled = false;
    if(currentPanel === 'brain' && currentBrainTab === 'llm') renderBrainPanel();
  },
  // Persona + light memory context so the model stays in-character and
  // keeps replying in the same Hinglish style as the rest of the app.
  buildSystemPrompt(){
    const bits = [
      'You are Nancy, a formal AI assistant running entirely on the user\'s own device, offline.',
      'Always reply in clear, formal, professional English (1-3 sentences). Do not use romantic language, pet names, or flirtatious tone. Stay helpful, courteous, and neutral in tone.'
    ];
    if(userName.value) bits.push(`The user's name is ${userName.value}.`);
    const lang = MemoryManager.getFavouriteLanguage();
    if(lang) bits.push(`Their preferred language is ${lang}.`);
    return bits.join(' ');
  },
  async reply(userMsg){
    if(!this.ready || !this.engine) return null;
    try{
      const history = MemoryManager.recentHistory(9).slice(0, -1); // drop the just-added current message
      const messages = [{ role:'system', content: this.buildSystemPrompt() }];
      history.forEach(h => messages.push({ role: h.who === 'bot' ? 'assistant' : 'user', content: h.text }));
      messages.push({ role:'user', content: userMsg });
      const res = await this.engine.chat.completions.create({ messages, temperature:0.85, max_tokens:120 });
      const text = res.choices && res.choices[0] && res.choices[0].message ? res.choices[0].message.content : null;
      return text ? text.trim() : null;
    }catch(e){
      console.warn('LocalLLM reply failed', e);
      return null; // caller falls back to regex rules
    }
  }
};

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

async function getReply(userMsg){
  MemoryManager.addHistory('user', userMsg);

  // ---- CORE PIPELINE: Intent Detection → Memory Check → Knowledge Search → Reasoning ----
  const pipelineReply = ResponseGenerator.handle(userMsg);
  if(pipelineReply !== null){
    MemoryManager.addHistory('bot', pipelineReply);
    return pipelineReply;
  }

  // ---- Cloud API (if user added a key in ⋮ → API Key) ----
  if(typeof CloudAPI !== 'undefined' && CloudAPI.isReady()){
    const cloudReply = await CloudAPI.reply(userMsg);
    if(cloudReply){
      MemoryManager.addHistory('bot', cloudReply);
      return cloudReply;
    }
    // API failed — fall through
  }

  // ---- Phase 8: Local LLM (on-device) for natural, context-aware chit-chat ----
  if(LocalLLM.enabled && LocalLLM.ready){
    const llmReply = await LocalLLM.reply(userMsg);
    if(llmReply){
      MemoryManager.addHistory('bot', llmReply);
      return llmReply;
    }
    // LLM gave nothing usable — fall through to the regex personality rules below
  }

  // ---- Fallback: personality / emotional rules (regex-based, always available offline) ----
  for(const rule of rules){
    const m = userMsg.match(rule.test);
    if(m){
      const reply = rule.reply(m);
      MemoryManager.addHistory('bot', reply);
      return reply;
    }
  }

  // ---- Final fallback: neutral, professional ----
  const fallback = pick([
    "Could you please provide more detail?",
    "I would like to understand this better — could you elaborate?",
    "Noted. Please continue, and let me know if you need assistance.",
    "I am listening. Please share whatever you would like to discuss.",
    userName.value
      ? `${userName.value}, could you tell me more about what you need?`
      : "Please go ahead — I am ready to assist with whatever you need."
  ]);
  MemoryManager.addHistory('bot', fallback);
  return fallback;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const val = input.value.trim();
  if(!val) return;
  addMsg(val, 'user');
  input.value = '';
  const reply = await getReply(val);
  setTimeout(() => addMsg(reply, 'bot'), 90 + Math.random()*80);
});

/* =====================================================
   BOOT SEQUENCE — load all AI models up-front behind a
   loading screen, in this order:
   TF.js -> Face -> Object Detection -> Pose -> Hand/Gesture
   -> OCR -> Depth -> Local LLM -> reveal main screen
===================================================== */
(function(){
  const loaderEl = document.getElementById('appLoader');
  const stepTextEl = document.getElementById('loaderStepText');
  const barFillEl = document.getElementById('loaderBarFill');
  const pctEl = document.getElementById('loaderPct');
  const listEl = document.getElementById('loaderChecklist');
  if(!loaderEl) return;

  // Race a step against a timeout so a slow/stuck model (e.g. a big first-time
  // LLM download) can never hang the whole app open — it keeps loading quietly
  // in the background and the boot sequence just moves on.
  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise((resolve) => setTimeout(resolve, ms))
    ]);
  }

  const steps = [
    { label: 'TensorFlow.js',      timeout: 12000, run: async () => { if(typeof tf !== 'undefined'){ try{ await tf.ready(); }catch(e){} } } },
    { label: 'Face Model',         timeout: 20000, run: async () => { try{ await ensureFaceRecogModels(); }catch(e){} } },
    { label: 'Object Detection',   timeout: 20000, run: async () => { try{ await loadVisionModel(); }catch(e){} } },
    { label: 'Pose Model',         timeout: 20000, run: async () => { try{ await loadPoseDetector(); }catch(e){} } },
    { label: 'Hand / Gesture Model', timeout: 20000, run: async () => {
        try{ await initHands(); }catch(e){}
        try{ await initGestureRecognizer(); }catch(e){}
      } },
    { label: 'OCR',                timeout: 20000, run: async () => { try{ await ensureOcrWorker(ocrLangPreferred); }catch(e){} } },
    { label: 'Depth Model',        timeout: 12000, run: async () => { try{ await tryLoadDepthOnnx(); }catch(e){} } },
    // FIX: "Local AI / LLM" boot step removed — it was silently starting a
    // 400 MB-2.2 GB on-device model download/GPU-load on EVERY app launch,
    // which is exactly why startup felt slow/heavy. This is now fully
    // opt-in: open ☰ → AI Brain → Local LLM and tap "Load" once, only if
    // you actually want it. Everything else (chat, vision, face, gestures)
    // works fully without it via the rule-based reply system.
  ];

  // Render checklist rows up-front
  listEl.innerHTML = steps.map((s, i) =>
    `<div class="loader-check-item" id="loaderItem${i}"><span class="loader-check-dot"></span><span>${s.label}</span></div>`
  ).join('');

  async function runBoot(){
    // Mute chat-log side-effects (addMsg) from model init functions during boot
    // so the first thing the user sees isn't a wall of status messages.
    const realAddMsg = (typeof addMsg === 'function') ? addMsg : null;
    if(realAddMsg) window.addMsg = function(){};

    for(let i = 0; i < steps.length; i++){
      const step = steps[i];
      const item = document.getElementById('loaderItem' + i);
      if(item) item.classList.add('active');
      stepTextEl.textContent = 'Loading ' + step.label + '...';
      try{ await withTimeout(step.run(), step.timeout || 20000); }catch(e){ /* never block boot on a single model failing */ }
      if(item){ item.classList.remove('active'); item.classList.add('done'); }
      const pct = Math.round(((i + 1) / steps.length) * 100);
      barFillEl.style.width = pct + '%';
      pctEl.textContent = pct + '%';
    }

    stepTextEl.textContent = 'All models ready ✅';
    if(realAddMsg) window.addMsg = realAddMsg;

    setTimeout(() => { loaderEl.classList.add('hide'); }, 350);
  }

  runBoot();
})();
</script>
