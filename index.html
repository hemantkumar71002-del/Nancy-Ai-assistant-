/* =====================================================
   HAND TRACKING — MediaPipe Hands (21 landmarks per hand)
===================================================== */
let handsInstance = null;
let handsReady = false;
let handsLoading = false;
let handsStream = null;
let handsCamera = null;
let handsRafId = null;
let lastHandsCount = 0;
let lastHandsLabels = []; // e.g. ['Left', 'Right']

async function initHands(){
  if(handsReady || handsLoading) return;
  if(typeof Hands === 'undefined'){
    addMsg('MediaPipe Hands script load nahi hua. Internet check karo.', 'bot');
    return;
  }
  handsLoading = true;
  try{
    handsInstance = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
    });
    handsInstance.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    handsInstance.onResults(onHandsResults);
    handsReady = true;
  }catch(e){
    addMsg('Hands init fail: ' + (e.message || 'error'), 'bot');
    handsInstance = null;
  }
  handsLoading = false;
  if(currentPanel === 'hands') renderHandsPanel();
  if(currentPanel === 'handpose') renderHandPoseComboPanel();
}

function onHandsResults(results){
  const video = document.getElementById('handsVideo');
  const canvas = document.getElementById('handsCanvas');
  if(!canvas || !video) return;
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  lastHandsLabels = [];
  if(results.multiHandLandmarks && results.multiHandLandmarks.length){
    lastHandsCount = results.multiHandLandmarks.length;
    for(let i = 0; i < results.multiHandLandmarks.length; i++){
      const landmarks = results.multiHandLandmarks[i];
      const handedness = (results.multiHandedness && results.multiHandedness[i])
        ? results.multiHandedness[i].label
        : ('Hand ' + (i + 1));
      lastHandsLabels.push(handedness);
      const isRight = handedness === 'Right';
      const lineColor = isRight ? '#3ee6c4' : '#ff8a8a';
      const pointColor = isRight ? '#7CFC8B' : '#ffb0b0';
      if(typeof drawConnectors === 'function' && typeof HAND_CONNECTIONS !== 'undefined'){
        drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: lineColor, lineWidth: 2 });
      }
      if(typeof drawLandmarks === 'function'){
        drawLandmarks(ctx, landmarks, { color: pointColor, lineWidth: 1, radius: 3 });
      } else {
        ctx.fillStyle = pointColor;
        for(const pt of landmarks){
          ctx.beginPath();
          ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  } else {
    lastHandsCount = 0;
  }
  ctx.restore();
  const info = document.getElementById('handsInfo');
  if(info){
    if(lastHandsCount){
      const labels = lastHandsLabels.map((l, i) => `Hand #${i + 1}: ${l}`).join(' · ');
      info.innerHTML = `<div class="face-row"><span class="fname">Hands detected</span><span class="fconf">${lastHandsCount} · 21 landmarks each</span></div>
        <div class="status-line" style="margin-top:4px;">${escapeHtml(labels)}</div>`;
    } else {
      info.innerHTML = '<div class="status-line">No hands detected yet.</div>';
    }
  }
}

async function startHandsCamera(){
  const video = document.getElementById('handsVideo');
  if(!video) return;
  try{
    if(!handsReady) await initHands();
    if(!handsInstance) return;
    handsStream = await CamEngine.getStream(false);
    video.srcObject = handsStream;
    CamEngine.removeMirror(video, document.getElementById('handsCanvas'));
    await video.play();
    if(USE_MP_CAMERA_UTIL && typeof Camera !== 'undefined'){
      handsCamera = new Camera(video, {
        onFrame: async () => {
          if(handsInstance) await handsInstance.send({ image: video });
        },
        width: 640,
        height: 480
      });
      handsCamera.start();
    } else {
      const loop = async () => {
        if(!handsStream || !handsInstance) return;
        if(video.readyState >= 2){ try{ await handsInstance.send({ image: video }); }catch(e){} }
        handsRafId = requestAnimationFrame(loop);
      };
      handsRafId = requestAnimationFrame(loop);
    }
    if(currentPanel === 'hands') renderHandsPanel();
  }catch(e){
    addMsg('Camera access nahi mil paaya (Hand Tracking). Browser permission check karo.', 'bot');
  }
}

function stopHandsCamera(){
  if(handsCamera){
    try{ handsCamera.stop(); }catch(e){}
    handsCamera = null;
  }
  if(handsRafId){
    cancelAnimationFrame(handsRafId);
    handsRafId = null;
  }
  // FIX: MediaPipe's Camera utility silently replaces video.srcObject with
  // its own internal getUserMedia() stream, and Camera.stop() only cancels
  // the animation loop — it never releases that hardware track. Stop
  // whatever stream is ACTUALLY attached to the video element right now,
  // not just the one we originally requested, or the camera light stays on.
  const handsVideoEl = document.getElementById('handsVideo');
  if(handsVideoEl && handsVideoEl.srcObject){
    handsVideoEl.srcObject.getTracks().forEach(t => t.stop());
    handsVideoEl.srcObject = null;
  }
  if(handsStream){
    handsStream.getTracks().forEach(t => t.stop());
    handsStream = null;
  }
  lastHandsCount = 0;
  lastHandsLabels = [];
  if(currentPanel === 'hands') renderHandsPanel();
}

function renderHandsPanel(){
  panelTitle.textContent = 'HAND TRACKING (MediaPipe)';
  const running = !!handsStream;
  panelBody.innerHTML = `
    <div id="handsWrap" style="margin-top:8px; ${running ? '' : 'display:none;'}">
      <video webkit-playsinline autoplay id="handsVideo" playsinline muted></video>
      <canvas id="handsCanvas"></canvas>
    </div>
    <div style="margin-top:12px;">
      <button class="act ${running ? 'stop' : ''}" id="btnHandsCamToggle">
        ${running ? '⏹ Stop Camera' : '📷 Start Camera'}
      </button>
    </div>
    <div class="face-info" id="handsInfo"></div>
  `;
  if(running){
    const video = document.getElementById('handsVideo');
    if(handsStream){ video.srcObject = handsStream; video.play().catch(()=>{}); }
  }
  const info = document.getElementById('handsInfo');
  if(info){
    info.innerHTML = lastHandsCount
      ? `<div class="face-row"><span class="fname">Hands detected</span><span class="fconf">${lastHandsCount}</span></div>`
      : '<div class="status-line">Camera start karo — hand landmarks live dikhenge.</div>';
  }
  document.getElementById('btnHandsCamToggle').addEventListener('click', () => {
    running ? stopHandsCamera() : startHandsCamera();
  });
}


/* =====================================================
   POSE / MoveNet — TensorFlow.js pose-detection
   17 body keypoints (nose, eyes, ears, shoulders, elbows,
   wrists, hips, knees, ankles). Lightning (fast) by default.
   Pehli baar model download, baad me on-device offline.
===================================================== */
let poseDetector = null;
let poseModelLoading = false;
let poseModelReady = false;
let poseStream = null;
let poseDetectTimer = null;
let lastPoses = []; // estimatePoses result
let poseModelType = 'SINGLEPOSE_LIGHTNING'; // or SINGLEPOSE_THUNDER / MULTIPOSE_LIGHTNING

// COCO-style skeleton edges for MoveNet 17 keypoints
const POSE_CONNECTIONS = [
  ['left_shoulder', 'right_shoulder'],
  ['left_shoulder', 'left_elbow'],
  ['left_elbow', 'left_wrist'],
  ['right_shoulder', 'right_elbow'],
  ['right_elbow', 'right_wrist'],
  ['left_shoulder', 'left_hip'],
  ['right_shoulder', 'right_hip'],
  ['left_hip', 'right_hip'],
  ['left_hip', 'left_knee'],
  ['left_knee', 'left_ankle'],
  ['right_hip', 'right_knee'],
  ['right_knee', 'right_ankle'],
  ['nose', 'left_eye'],
  ['left_eye', 'left_ear'],
  ['nose', 'right_eye'],
  ['right_eye', 'right_ear'],
];

const POSE_KEYPOINT_HI = {
  nose: 'Naak', left_eye: 'Bayan aankh', right_eye: 'Dayan aankh',
  left_ear: 'Bayan kaan', right_ear: 'Dayan kaan',
  left_shoulder: 'Bayan kandha', right_shoulder: 'Dayan kandha',
  left_elbow: 'Bayan kohni', right_elbow: 'Dayan kohni',
  left_wrist: 'Bayan kalai', right_wrist: 'Dayan kalai',
  left_hip: 'Bayan kamar', right_hip: 'Dayan kamar',
  left_knee: 'Bayan ghutna', right_knee: 'Dayan ghutna',
  left_ankle: 'Bayan takhna', right_ankle: 'Dayan takhna',
};

async function loadPoseDetector(forceType){
  if(poseModelLoading) return;
  if(typeof poseDetection === 'undefined'){
    addMsg('pose-detection (MoveNet) script load nahi hua. Internet check karo (pehli baar).', 'bot');
    return;
  }
  if(typeof tf !== 'undefined'){
    try{ await tf.ready(); }catch(e){}
  }
  const typeKey = forceType || poseModelType;
  poseModelLoading = true;
  poseModelReady = false;
  if(currentPanel === 'pose') renderPosePanel();
  if(currentPanel === 'handpose') renderHandPoseComboPanel();
  try{
    // dispose previous
    if(poseDetector && poseDetector.dispose){
      try{ poseDetector.dispose(); }catch(e){}
    }
    poseDetector = null;
    const modelTypeMap = {
      SINGLEPOSE_LIGHTNING: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
      SINGLEPOSE_THUNDER: poseDetection.movenet.modelType.SINGLEPOSE_THUNDER,
      MULTIPOSE_LIGHTNING: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
    };
    const detectorConfig = {
      modelType: modelTypeMap[typeKey] || poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
      enableSmoothing: true,
    };
    if(typeKey === 'MULTIPOSE_LIGHTNING'){
      detectorConfig.enableTracking = true;
      detectorConfig.trackerType = poseDetection.TrackerType.BoundingBox;
    }
    poseDetector = await poseDetection.createDetector(
      poseDetection.SupportedModels.MoveNet,
      detectorConfig
    );
    poseModelType = typeKey;
    poseModelReady = true;
    addMsg('MoveNet model ready (' + typeKey.replace(/_/g, ' ') + '). Camera start karke pose dekho.', 'bot');
  }catch(e){
    poseDetector = null;
    poseModelReady = false;
    addMsg('MoveNet load fail: ' + (e.message || e) + '. Pehli baar internet chahiye (model download).', 'bot');
  }
  poseModelLoading = false;
  if(currentPanel === 'pose') renderPosePanel();
  if(currentPanel === 'handpose') renderHandPoseComboPanel();
}

function drawPoses(video, poses){
  const canvas = document.getElementById('poseCanvas');
  if(!canvas || !video) return;
  const w = video.videoWidth || 640;
  const h = video.videoHeight || 480;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  ctx.lineWidth = 3;
  ctx.font = '12px monospace';

  poses.forEach((pose, pi) => {
    const kps = {};
    (pose.keypoints || []).forEach(kp => {
      kps[kp.name] = kp;
    });
    // skeleton
    ctx.strokeStyle = pi === 0 ? '#3ee6c4' : '#ff8a8a';
    POSE_CONNECTIONS.forEach(([a, b]) => {
      const ka = kps[a], kb = kps[b];
      if(!ka || !kb) return;
      if((ka.score || 0) < 0.3 || (kb.score || 0) < 0.3) return;
      ctx.beginPath();
      ctx.moveTo(ka.x, ka.y);
      ctx.lineTo(kb.x, kb.y);
      ctx.stroke();
    });
    // keypoints
    (pose.keypoints || []).forEach(kp => {
      if((kp.score || 0) < 0.3) return;
      ctx.fillStyle = '#7CFC8B';
      ctx.beginPath();
      ctx.arc(kp.x, kp.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
    // score label
    if(pose.score != null){
      ctx.fillStyle = '#3ee6c4';
      ctx.fillText('Pose #' + (pi + 1) + ' ' + Math.round(pose.score * 100) + '%', 8, 18 + pi * 16);
    }
  });
}

function updatePoseInfo(){
  const box = document.getElementById('poseInfo');
  if(!box) return;
  if(!lastPoses.length){
    box.innerHTML = '<div class="status-line">No pose detected yet.</div>';
    return;
  }
  box.innerHTML = lastPoses.map((pose, i) => {
    const score = pose.score != null ? Math.round(pose.score * 100) + '%' : '—';
    const visible = (pose.keypoints || []).filter(k => (k.score || 0) >= 0.3).length;
    const top = (pose.keypoints || [])
      .filter(k => (k.score || 0) >= 0.5)
      .sort((a, b) => (b.score || 0) - (a.score || 0))
      .slice(0, 5)
      .map(k => (POSE_KEYPOINT_HI[k.name] || k.name) + ' ' + Math.round((k.score || 0) * 100) + '%')
      .join(' · ');
    return `<div class="face-row"><span class="fname">Pose #${i + 1}</span><span class="fconf">${score} · ${visible}/17 points</span></div>
      <div class="status-line" style="margin-top:4px;">${escapeHtml(top || 'Keypoints low confidence')}</div>`;
  }).join('');
}

function startPoseDetectLoop(){
  clearInterval(poseDetectTimer);
  poseDetectTimer = setInterval(async () => {
    const video = document.getElementById('poseVideo');
    if(!video || !poseDetector || video.readyState < 2) return;
    try{
      const poses = await poseDetector.estimatePoses(video, {
        maxPoses: poseModelType === 'MULTIPOSE_LIGHTNING' ? 6 : 1,
        flipHorizontal: false,
      });
      lastPoses = poses || [];
      drawPoses(video, lastPoses);
      if(currentPanel === 'pose') updatePoseInfo();
    }catch(e){ /* skip frame */ }
  }, 100);
}

async function startPoseCamera(){
  const video = document.getElementById('poseVideo');
  if(!video) return;
  try{
    if(!poseModelReady) await loadPoseDetector();
    if(!poseDetector) return;
    poseStream = await CamEngine.getStream(false);
    video.srcObject = poseStream;
    CamEngine.removeMirror(video, document.getElementById('poseCanvas'));
    await video.play();
    startPoseDetectLoop();
    if(currentPanel === 'pose') renderPosePanel();
  }catch(e){
    addMsg('Camera access nahi mil paaya (MoveNet Pose). Browser permission check karo.', 'bot');
  }
}

function stopPoseCamera(){
  clearInterval(poseDetectTimer);
  poseDetectTimer = null;
  if(poseStream){
    poseStream.getTracks().forEach(t => t.stop());
    poseStream = null;
  }
  lastPoses = [];
  if(currentPanel === 'pose') renderPosePanel();
}

function renderPosePanel(){
  panelTitle.textContent = 'POSE / MoveNet';
  const running = !!poseStream;
  panelBody.innerHTML = `
    <div class="row" style="margin-top:10px; align-items:center; flex-wrap:wrap;">
      <select id="poseModelSelect" class="ocr-lang-select">
        <option value="SINGLEPOSE_LIGHTNING" ${poseModelType === 'SINGLEPOSE_LIGHTNING' ? 'selected' : ''}>SinglePose Lightning (fast)</option>
        <option value="SINGLEPOSE_THUNDER" ${poseModelType === 'SINGLEPOSE_THUNDER' ? 'selected' : ''}>SinglePose Thunder (accurate)</option>
        <option value="MULTIPOSE_LIGHTNING" ${poseModelType === 'MULTIPOSE_LIGHTNING' ? 'selected' : ''}>MultiPose Lightning (multi-person)</option>
      </select>
      <button class="act" id="btnPoseLoadModel" style="margin-left:6px;">⬇ Model Load</button>
    </div>
    <div id="poseWrap" style="margin-top:8px; ${running ? '' : 'display:none;'}">
      <video webkit-playsinline autoplay id="poseVideo" playsinline muted></video>
      <canvas id="poseCanvas"></canvas>
    </div>
    <div style="margin-top:12px;">
      <button class="act ${running ? 'stop' : ''}" id="btnPoseCamToggle">
        ${running ? '⏹ Stop Camera' : '📷 Start Camera'}
      </button>
    </div>
    <div class="face-info" id="poseInfo"></div>
  `;
  if(running){
    const video = document.getElementById('poseVideo');
    if(poseStream && video){ video.srcObject = poseStream; video.play().catch(()=>{}); }
  }
  updatePoseInfo();
  document.getElementById('btnPoseLoadModel').addEventListener('click', async () => {
    const sel = document.getElementById('poseModelSelect').value;
    stopPoseCamera();
    await loadPoseDetector(sel);
  });
  document.getElementById('btnPoseCamToggle').addEventListener('click', () => {
    running ? stopPoseCamera() : startPoseCamera();
  });
}

    POSE_CONNECTIONS.forEach(([a, b]) => {
      const ka = kps[a], kb = kps[b];
      if(!ka || !kb) return;
      if((ka.score || 0) < 0.3 || (kb.score || 0) < 0.3) return;
      ctx.beginPath();
      ctx.moveTo(ka.x, ka.y);
      ctx.lineTo(kb.x, kb.y);
      ctx.stroke();
    });
    (pose.keypoints || []).forEach(kp => {
      if((kp.score || 0) < 0.3) return;
      ctx.fillStyle = '#7CFC8B';
      ctx.beginPath();
      ctx.arc(kp.x, kp.y, 4, 0, Math.PI * 2);
      ctx.fill();
    });
    if(pose.score != null){
      ctx.fillStyle = '#3ee6c4';
      ctx.fillText('Pose #' + (pi + 1) + ' ' + Math.round(pose.score * 100) + '%', 8, 18 + pi * 16);
    }
  });
}

/* =====================================================
   COMBINED A) OBJECT DETECTION + TRACK + DEPTH
   Ek camera: COCO-SSD + ByteTrack-style IDs + depth heatmap
===================================================== */
let objDepthStream = null;
let objDepthDetectTimer = null;
let objDepthDepthTimer = null;
let objectNarrationOn = false;
let objectNarrationTimer = null;
let lastNarratedSignature = '';

// Position of an object in the frame (left/centre/right), from its bbox.
function objectPositionLabel(bbox, videoWidth){
  if(!videoWidth) return '';
  const [x, , w] = bbox;
  const centerX = x + w/2;
  const third = videoWidth/3;
  if(centerX < third) return 'left par';
  if(centerX > third*2) return 'right par';
  return 'saamne';
}

// Rough near/far cue from how much of the frame the box fills — no depth
// model needed, just gives the spoken details one more accurate dimension.
function objectSizeLabel(bbox, videoWidth, videoHeight){
  if(!videoWidth || !videoHeight) return '';
  const areaRatio = (bbox[2]*bbox[3]) / (videoWidth*videoHeight);
  if(areaRatio > 0.25) return 'bahut paas';
  if(areaRatio > 0.08) return 'paas';
  if(areaRatio > 0.02) return 'medium door';
  return 'dur';
}

// Direction (left / saamne / right) — frame ko 3 hisson me baanta hai.
function objectDirectionSpeech(bbox, videoWidth){
  if(!videoWidth) return 'saamne';
  const cx = bbox[0] + bbox[2]/2;
  if(cx < videoWidth/3) return 'left side';
  if(cx > videoWidth*2/3) return 'right side';
  return 'saamne';
}

// Distance in meters. Priority: (1) ultrasonic (sirf saamne wali sabse paas cheez ke liye),
// (2) known object height se estimate, (3) bbox ka frame me size (rough).
function objectDistanceMeters(d, vw, vh){
  // estimateDistanceMeters 480px-high frame maan kar chalta hai — asli video height ke hisaab se normalize
  let m = estimateDistanceMeters(d.class, d.bbox[3] * (480 / (vh || 480)));
  if(m == null){
    const area = (d.bbox[2]*d.bbox[3]) / ((vw||1)*(vh||1));
    m = area > 0.25 ? 0.5 : area > 0.08 ? 1 : area > 0.02 ? 2 : 3;
  }
  return m;
}
function distanceSpeech(m){
  if(m > 10) return '10 meter se zyada door';
  if(m < 1) return `${Math.max(10, Math.round(m*10)*10)} centimeter`;
  return `${Math.round(m*10)/10} meter`;
}

// Format: "<direction>, <object name>, <distance>" — nearest object pehle, max 4.
// Example: "Saamne, Kursi, 1.2 meter. Left side, Botal, 50 centimeter."
function buildObjectDetailsSpeech(dets){
  dets = dets || lastDetections;
  if(!dets || !dets.length) return 'Kuch detect nahi hua.';
  const video = document.getElementById('objDepthVideo') || document.getElementById('visionVideo');
  const vw = video ? video.videoWidth : 0;
  const vh = video ? video.videoHeight : 0;
  const items = dets.map(d => ({
    name: d.cloudName || hindiObjName(d.class),
    dir: objectDirectionSpeech(d.bbox, vw),
    m: objectDistanceMeters(d, vw, vh),
    center: objectDirectionSpeech(d.bbox, vw) === 'saamne'
  })).sort((a, b) => a.m - b.m);
  // Ultrasonic seedha aage naapta hai — isliye sirf saamne wali sabse paas cheez par lagao
  if(isSensorConnected() && sensors.ultrasonic.value !== null){
    const us = Number(sensors.ultrasonic.value);
    const front = items.find(i => i.center);
    if(front && Number.isFinite(us) && us > 0 && us <= 400) front.m = us / 100;
  }
  items.sort((a, b) => a.m - b.m);
  return items.slice(0, 4).map(i => `${i.dir.charAt(0).toUpperCase() + i.dir.slice(1)}, ${i.name}, ${distanceSpeech(i.m)}`).join('. ') + '.';
}

// Continuous narration = ek hi cycle:
//   DETECT (object milne tak ruko) -> SPEAK (poora bolne tak detection freeze)
//   -> REFRESH (tracker/list/overlay reset) -> phir se DETECT ...
// Bolna khatam hue bina refresh kabhi nahi hota.
const SPEAK_MIN_SCORE = 0.5;   // FIX: 0.6 -> 0.5 — 50% confidence par bhi bolega
const SPEAK_MIN_HITS = 5;      // itne frames lagatar wahi track dikhe tab hi bolo
function speakableDetections(){
  const hits = {};
  activeTracks.forEach(t => { hits[t.id] = t.hits; });
  return (lastDetections || []).filter(d =>
    d.score >= SPEAK_MIN_SCORE && (hits[d.trackId] || 0) >= SPEAK_MIN_HITS);
}
let narrationRunId = 0;
let narrationPhase = 'idle'; // 'idle' | 'detect' | 'speak' | 'refresh'
const _sleep = ms => new Promise(r => setTimeout(r, ms));

async function refreshVision(){
  activeTracks = [];
  lastDetections = [];
  const v = document.getElementById('objDepthVideo');
  if(v && v.paused) v.play().catch(()=>{});
  const c = document.getElementById('objDepthDetCanvas');
  if(c && c.width) c.getContext('2d').clearRect(0, 0, c.width, c.height);
  if(currentPanel === 'objdepth'){ updateObjDepthDetList(); updateObjDepthDistanceDisplay(); }
  await _sleep(600); // naya frame / fresh detection ka time
}

function startObjectNarration(){
  objectNarrationOn = true;
  const run = ++narrationRunId;
  narrationLoop(run);
}
function stopObjectNarration(){
  objectNarrationOn = false;
  narrationRunId++;
  narrationPhase = 'idle';
}
// Online ho + API key ho to har box ka sahi naam Gemini/OpenAI se lo; warna COCO ka naam hi rahega.
function cropDetection(video, bbox){
  const vw = video.videoWidth, vh = video.videoHeight;
  const padX = bbox[2] * 0.12, padY = bbox[3] * 0.12;
  const x = Math.max(0, bbox[0] - padX), y = Math.max(0, bbox[1] - padY);
  const w = Math.min(vw - x, bbox[2] + padX * 2), h = Math.min(vh - y, bbox[3] + padY * 2);
  if(w < 8 || h < 8) return null;
  const scale = Math.min(1, 320 / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(8, Math.round(w * scale)); c.height = Math.max(8, Math.round(h * scale));
  const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high';
  cx.drawImage(video, x, y, w, h, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}
async function refineNamesOnline(dets){
  try{
    if(typeof CloudAPI === 'undefined' || !CloudAPI.isReady()) return;
    if(!navigator.onLine || Date.now() < CloudAPI.backoffUntil) return;
    const video = document.getElementById('objDepthVideo');
    if(!video || !video.videoWidth) return;
    const pick = dets.slice(0, 4);
    const crops = [], idx = [];
    pick.forEach((d, i) => { const b = cropDetection(video, d.bbox); if(b){ crops.push(b); idx.push(i); } });
    if(!crops.length) return;
    const names = await CloudAPI.nameCrops(crops, idx.map(i => pick[i].class), 5000);
    if(!names) return;
    names.forEach((n, k) => {
      if(!n || /^(unknown|none|unsure|object|thing|item)$/.test(n)) return;
      const d = pick[idx[k]];
      // COCO ka hi naam mila to Hindi label (Kursi, Botal...) rakho; naya naam mila to wahi bolo
      d.cloudName = (cocoHindiNames[n] ? hindiObjName(n) : n.charAt(0).toUpperCase() + n.slice(1));
    });
  }catch(e){ console.warn('refineNamesOnline', e); }
}

async function narrationLoop(run){
  const alive = () => run === narrationRunId && objectNarrationOn && !!objDepthStream;
  let spokeEmpty = false;
  while(alive()){
    // pehle koi bhi chal rahi aawaz poori hone do (kisi aur feature ki bhi)
    await waitForSpeechEnd();
    if(!alive()) break;

    // 1) DETECT — sirf pakke (high confidence + kai frames se dikhne wale) objects bolenge
    narrationPhase = 'detect';
    let stable = 0, waited = 0, snapshot = null;
    while(alive()){
      if(ObjectFinder.active){ await _sleep(500); continue; } // Finder ki guidance se clash nahi
      const sp = speakableDetections();
      if(sp.length){
        if(++stable >= 2){ snapshot = sp; break; }
      } else { stable = 0; }
      await _sleep(300);
      waited += 300;
      if(waited >= 5000 && !spokeEmpty){ break; } // 5s kuch nahi mila — ek baar bolo
    }
    if(!alive()) break;

    // 2) SPEAK — poora bolne tak detection freeze (neeche detect loops 'speak' phase me skip karte hain)
    narrationPhase = 'speak';
    if(snapshot){
      spokeEmpty = false;
      snapshot = snapshot.map(d => Object.assign({}, d)); // copy: cloudName sirf is baar ke liye
      await refineNamesOnline(snapshot);                  // online + key ho tabhi, warna turant aage
      if(!alive()) break;
      lastNarratedSignature = snapshot.map(d => d.class).sort().join(',');
      voiceSay(buildObjectDetailsSpeech(snapshot));
    } else {
      spokeEmpty = true;
      voiceSay('Kuch detect nahi hua.');
    }
    await waitForSpeechEnd();
    if(voiceState && !voiceState.enabled) await _sleep(2000); // voice OFF: padhne ka time
    if(!alive()) break;

    // 3) REFRESH — bolna khatam hone ke baad hi
    narrationPhase = 'refresh';
    await refreshVision();
  }
  if(run === narrationRunId) narrationPhase = 'idle';
}

    addMsg('Camera access nahi mil paaya (Vision AI). Permission allow karo + camera free hai check karo.', 'bot');

function drawObjDepthDetections(video, preds){
  const canvas = document.getElementById('objDepthDetCanvas');
  if(!canvas || !video.videoWidth) return;
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.lineWidth = 3;
  ctx.font = 'bold 15px monospace';
  preds.forEach(p => {
    const [x,y,w,h] = p.bbox;
    // color by confidence
    const conf = p.score;
    ctx.strokeStyle = conf > 0.6 ? '#3ee6c4' : (conf > 0.4 ? '#ffd166' : '#ff7eb3');
    ctx.fillStyle = ctx.strokeStyle;
    ctx.strokeRect(x, y, w, h);
    const tid = p.trackId != null ? ` #${p.trackId}` : '';
    const label = `${hindiObjName(p.class)}${tid} ${(conf*100).toFixed(0)}%`;
    // text background for readability
    const tw = ctx.measureText(label).width + 8;
    const ty = y > 22 ? y - 4 : y + 18;
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(x, ty - 14, tw, 18);
    ctx.fillStyle = conf > 0.6 ? '#3ee6c4' : (conf > 0.4 ? '#ffd166' : '#ff7eb3');
    ctx.fillText(label, x + 4, ty);
  });
}

function depthApproxFrameToCanvas(video, canvas, estimateId){
  const w = 160, h = 120;
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const octx = off.getContext('2d');
  octx.drawImage(video, 0, 0, w, h);
  const img = octx.getImageData(0,0,w,h);
  const data = img.data;
  const heat = new Float32Array(w*h);
  let min=1e9, max=-1e9;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i = (y*w+x)*4;
      const gray = (data[i]+data[i+1]+data[i+2])/3/255;
      const cx = (x/w-0.5), cy = (y/h-0.5);
      const center = 1 - Math.min(1, Math.sqrt(cx*cx+cy*cy)*1.4);
      const v = (1-gray)*0.55 + center*0.45;
      heat[y*w+x] = v;
      if(v<min) min=v; if(v>max) max=v;
    }
  }
  const ctx = canvas.getContext('2d');
  const out = ctx.createImageData(canvas.width, canvas.height);
  const sx = canvas.width/w, sy = canvas.height/h;
  const range = Math.max(1e-6, max-min);
  for(let y=0;y<canvas.height;y++){
    for(let x=0;x<canvas.width;x++){
      const hx = Math.min(w-1, Math.floor(x/sx));
      const hy = Math.min(h-1, Math.floor(y/sy));
      const t = (heat[hy*w+hx]-min)/range;
      const r = Math.round(255*Math.min(1, t*2));
      const g = Math.round(255*Math.min(1, t<0.5 ? t*2 : (1-t)*2));
      const b = Math.round(255*Math.min(1, (1-t)*2));
      const o = (y*canvas.width+x)*4;
      out.data[o]=r; out.data[o+1]=g; out.data[o+2]=b; out.data[o+3]=120;
    }
  }
  ctx.putImageData(out, 0, 0);
  let csum=0, cn=0;
  for(let y=Math.floor(h*0.35); y<Math.floor(h*0.65); y++){
    for(let x=Math.floor(w*0.35); x<Math.floor(w*0.65); x++){
      csum += (heat[y*w+x]-min)/range; cn++;
    }
  }
  const nearness = cn ? csum/cn : 0.5;
  const approxCm = Math.round(30 + (1-nearness)*350);
  const el = document.getElementById(estimateId);
  if(el) el.textContent = `Depth (center): ~${approxCm} cm`;
}

function updateObjDepthDetList(){
  const box = document.getElementById('objDepthDetList');

    ? lastDetections.map(p => {

        return `<div class="det-row"><span class="oname">${hindiObjName(p.class)}${tid}</span><span class="oconf">${(p.score*100).toFixed(0)}%</span></div>`;

}

/* =====================================================
   OBJECT FINDER MODE (Vision AI ka feature)
   Trigger: voice ("Nancy, bottle dhundho"), chat ("find bottle"),
   ya Vision AI panel ka 🔎 Object Finder button.
   Flow: Vision AI + camera ON → COCO-SSD detection → object LEFT /
   CENTER / RIGHT guidance → ultrasonic obstacle check → close aane par
   "mil gayi" → Object Finder OFF.
   Saare numbers neeche FINDER_CFG me hain — field testing ke baad yahin tune karo.
===================================================== */
const FINDER_CFG = {
  tickMs: 500,            // kitni der me ek baar decision (500ms = 2 baar/sec)
  repeatFoundMs: 4000,    // same direction dobara bolne ka gap
  repeatLostMs: 7000,     // "nahi mili" dobara bolne ka gap
  graceMs: 1500,          // object thodi der gayab ho to "nahi mili" nahi bolna
  obstacleCm: 40,         // isse kam distance = obstacle
  obstacleClearCm: 55,    // itna door hone par obstacle clear (hysteresis)
  arriveCm: 35,           // ultrasonic: itna paas + object center me = pahunch gaye
  arriveHeightRatio: 0.55,// camera: object frame ki height ka itna hissa = bahut paas
  arriveAreaRatio: 0.18,  // camera: ya frame ka itna area ghere
  arriveNeedTicks: 2,     // itni baar lagatar pass ho tab "mil gayi"
  timeoutMs: 120000,      // itni der object na dikhe to search band
  camWarmupMs: 15000      // itni der me camera start na ho to band
};

// Bolne wale lines — yahin se badal sakte ho. f = feminine noun (bottle, chair...)
const FINDER_FEM = ['bottle', 'chair', 'book', 'clock', 'scissors'];
const FINDER_TEXT = {
  seen:     (n, f) => `${n} dikh ${f ? 'gayi' : 'gaya'}.`,
  notFound: (n, f) => `${n} nahi ${f ? 'mili' : 'mila'}, search kar raha hoon.`,
  left: 'Left jao.', center: 'Seedha jao.', right: 'Right jao.',
  obstacle: 'Ruko, obstacle hai.',
  safe: (side) => `Thoda ${side} jao.`,
  clear: 'Rasta clear hai, aage badho.',
  found:    (n, f) => `${n} mil ${f ? 'gayi' : 'gaya'}.`,
  timeout:  (n, f) => `${n} nahi ${f ? 'mili' : 'mila'}, search band kar diya.`,
  camFail: 'Camera start nahi ho paya, Object Finder band kar diya.',
  slightleft: 'Thoda left jao.', slightright: 'Thoda right jao.'
};
// Step 5: camera se andaza lagaya hua distance (meter). bbox height video-resolution se independent (720p par normalize).
function finderCamDist(cls, bboxH, vh){
  if(!bboxH || !vh) return null;
  return estimateDistanceMeters(cls, bboxH * 720 / vh);
}
function finderDistText(m){
  if(m == null) return '';
  if(m < 1) return 'ek meter se kam door';
  if(m < 2) return `lagbhag ${Math.round(m * 2) / 2} meter door`;
  return `lagbhag ${Math.round(m)} meter door`;
}
// 5 zones: left / slightleft / center / slightright / right (cxN = box center, 0..1)
function finderZone(cxN){
  return cxN < 0.25 ? 'left' : cxN < 0.42 ? 'slightleft' : cxN <= 0.58 ? 'center' : cxN <= 0.75 ? 'slightright' : 'right';
}

// Hindi / Hinglish / Devanagari naam → COCO-SSD classes (model sirf 80 fixed classes jaanta hai)
const FINDER_EXTRA_ALIASES = {
  'botal':['bottle'], 'bottel':['bottle'], 'botel':['bottle'], 'बोतल':['bottle'],
  'phone':['cell phone'], 'mobile':['cell phone'], 'fone':['cell phone'], 'cellphone':['cell phone'], 'smartphone':['cell phone'], 'फोन':['cell phone'], 'मोबाइल':['cell phone'],
  'glass':['cup','wine glass'], 'gilas':['cup','wine glass'], 'glaas':['cup','wine glass'], 'गिलास':['cup','wine glass'],
  'cup':['cup'], 'kap':['cup'], 'mug':['cup'], 'pyala':['cup'], 'कप':['cup'],
  'bag':['backpack','handbag','suitcase'], 'bagpack':['backpack'], 'jhola':['handbag','backpack'], 'बैग':['backpack','handbag','suitcase'],
  'kursi':['chair'], 'कुर्सी':['chair'], 'sofa':['couch'], 'सोफा':['couch'],
  'table':['dining table'], 'mez':['dining table'], 'bistar':['bed'],
  'laptop':['laptop'], 'लैपटॉप':['laptop'], 'television':['tv'], 'टीवी':['tv'],
  'remote':['remote'], 'रिमोट':['remote'],
  'kitab':['book'], 'kitaab':['book'], 'किताब':['book'],
  'ghadi':['clock'], 'घड़ी':['clock'],
  'chhata':['umbrella'], 'chata':['umbrella'], 'छाता':['umbrella'],
  'kainchi':['scissors'], 'कैंची':['scissors'],
  'paudha':['potted plant'], 'plant':['potted plant'],
  'ball':['sports ball'],
  'chaku':['knife'], 'chammach':['spoon'], 'chamach':['spoon'], 'kanta':['fork'], 'katora':['bowl'],
  'fridge':['refrigerator'],
  'insaan':['person'], 'aadmi':['person'], 'इंसान':['person'],
  'kutta':['dog'], 'kuta':['dog'], 'कुत्ता':['dog'], 'billi':['cat'], 'बिल्ली':['cat']
};
let _finderAliasList = null;
function finderAliasList(){
  if(_finderAliasList) return _finderAliasList;
  const map = {};
  Object.keys(cocoHindiNames).forEach(cls => {
    map[cls.toLowerCase()] = [cls];
    map[String(cocoHindiNames[cls]).toLowerCase()] = [cls];
  });
  Object.assign(map, FINDER_EXTRA_ALIASES);
  _finderAliasList = Object.keys(map).sort((a, b) => b.length - a.length).map(alias => ({
    alias,
    classes: map[alias],
    re: /^[a-z0-9 ]+$/.test(alias)
      ? new RegExp('(?:^|[^a-z0-9])' + alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:[^a-z0-9]|$)')
      : null
  }));
  return _finderAliasList;
}
function parseFinderTarget(text){
  const t = normalizeVoiceText(text);
  for(const a of finderAliasList()){
    const hit = a.re ? a.re.test(t) : t.includes(a.alias);
    if(hit){
      const label = a.re ? a.alias.replace(/\b\w/g, c => c.toUpperCase()) : hindiObjName(a.classes[0]);
      return { classes: a.classes, label };
    }
  }
  return null;
}

// "dhundho / find ..." jaise trigger. Strong = akela kaafi hai; weak = tabhi jab object ka naam bhi mile.
const FINDER_STRONG_RE = /dhundh|dhoondh|dhund|dhoond|khoj|talash|ढूं?ढ|ढूँढ|खोज|तलाश|object\s*finder\s*(?:on|chalu|start|mode)|finder\s*mode/;
const FINDER_WEAK_RE = /\bfind\b|\bsearch\s+for\b|\blocate\b|\blook\s+for\b|\b(?:kahan|kahaan|kidhar)\s+(?:hai|rakha|rakhi|padi|pada)\b|कहाँ है|कहां है/;
const FINDER_STOP_RE = /(?:object\s*finder|finder|dhundh?na|dhoondhna|search|khoj|talash)\s*(?:mode\s*)?(?:band|off|stop|cancel)|(?:stop|cancel|end)\s*(?:the\s*)?(?:object\s*)?(?:finder|search|finding)|ढूंढना\s*बंद|खोज\s*बंद/;
const FINDER_FILLER = new Set(['nancy','nensy','nansy','nanci','please','plz','mera','meri','mere','mujhe','ek','the','a','my','for','ko','ka','ki','ke','kar','karo','do','de','dena','dijiye','zara','jara','yahan','yaha','kahan','kahaan','kidhar','hai','hain','object','finder','mode','on','chalu','start','find','search','locate','look','aur','bhi','isko','usko','wo','woh','vo','ye','yeh']);
function finderLeftover(t){
  return t.split(/\s+/).filter(w => w && !FINDER_FILLER.has(w)
    && !/^(dhund|dhoond|khoj|talash)/.test(w) && !/^(ढूं|ढूँ|खोज|तलाश)/.test(w)).join(' ');
}
function matchFinderCommand(text){
  const t = normalizeVoiceText(text);
  if(!t) return null;
  if(FINDER_STOP_RE.test(t)) return { kind: 'stop', text: t };
  if(FINDER_STRONG_RE.test(t)) return { kind: 'start', text: t, target: parseFinderTarget(t) };
  if(FINDER_WEAK_RE.test(t)){
    const target = parseFinderTarget(t);
    if(target) return { kind: 'start', text: t, target };
  }
  return null;
}

const ObjectFinder = {
  active: false, classes: [], label: '', timer: null, status: '',
  startedAt: 0, lastSeenAt: 0, lastDet: null,
  lastDir: null, dirCand: null, dirCount: 0, arriveCount: 0,
  lastSpokeKey: '', lastSpokeAt: 0, lastSpokeDist: null, distHist: [],
  obstacle: false, obstacleSince: 0, lastSafeAt: 0,
  narrationWas: true,

  // Chat / voice / panel — teeno yahin aate hain. Finder command nahi hai to null return.
  handle(text){
    const cmd = matchFinderCommand(text);
    if(!cmd) return null;
    if(cmd.kind === 'stop') return this.active ? this.stop('user') : 'Object Finder abhi ON nahi hai.';
    if(cmd.target) return this.start(cmd.target.classes, cmd.target.label);
    const left = finderLeftover(cmd.text);
    if(left){
      return `"${left}" mere detection model me nahi hai. Ye try karo: bottle, phone, cup, chair, laptop, book, remote, bag.`;
    }
    this.prepareVision();
    return 'Object Finder ON — Vision AI chalu hai. Batao kya dhundhna hai, jaise "bottle dhundho".';
  },

  // Vision AI panel + camera ON (camera already chal raha ho to chhedta nahi)
  prepareVision(){
    if(typeof AutoVision !== 'undefined' && AutoVision.enabled) AutoVision.enable(false);
    if(typeof closeSidebar === 'function') closeSidebar();
    if(currentPanel !== 'objdepth') openPanel('objdepth'); // openPanel khud camera start karta hai
    else if(!objDepthStream) startObjDepthCamera();
  },

  start(classes, label){
    clearInterval(this.timer);
    const wasRunning = currentPanel === 'objdepth' && !!objDepthStream;
    this.narrationWas = objDepthStream ? objectNarrationOn : true;
    Object.assign(this, {
      active: true, classes, label, startedAt: Date.now(), lastSeenAt: 0, lastDet: null,
      lastDir: null, dirCand: null, dirCount: 0, arriveCount: 0,
      lastSpokeKey: '', lastSpokeAt: 0, lastSpokeDist: null, distHist: [], obstacle: false, obstacleSince: 0, lastSafeAt: 0
    });
    VisionPerf.setFocus(classes); // Step 4: sirf target par focus (kam threshold + tez detection)
    AIScheduler.setMode('finder');
    this.prepareVision();
    stopObjectNarration(); // scene narration aur finder guidance ek saath na bolein
    this.setStatus(`🔎 ${label} dhundh rahe hain...`);
    this.timer = setInterval(() => this.tick(), FINDER_CFG.tickMs);
    if(wasRunning) renderObjDepthPanel(); // panel pehle se khula tha — Stop button dikhane ke liye
    const note = this.readUltrasonic() === null && !isSensorConnected()
      ? ' Ultrasonic sensor connected nahi hai — obstacle alert nahi milega, sirf camera guidance chalega.' : '';
    return `Object Finder ON — Vision AI aur camera chalu. ${label} dhundhna shuru.${note}`;
  },

  stop(reason){
    clearInterval(this.timer); this.timer = null;
    const wasActive = this.active;
    this.active = false;
    VisionPerf.setFocus([]);
    AIScheduler.setMode(currentPanel === 'facetrim' ? 'face' : currentPanel === 'handbodygest' ? 'gesture' : 'normal');
    this.setStatus('Object Finder OFF');
    if(wasActive && this.narrationWas && reason !== 'camera'){
      // scene narration wapas — thodi der baad taaki "mil gayi" beech me na kate
      setTimeout(() => { if(objDepthStream && !this.active && !objectNarrationOn) startObjectNarration(); }, 4000);
    }
    if(currentPanel === 'objdepth' && reason !== 'camera') renderObjDepthPanel();
    return 'Object Finder band kar diya.';
  },
  finish(msg){ this.stop('auto'); voiceSay(msg); },

  setStatus(t){
    this.status = t;
    const el = document.getElementById('objFinderStatus');
    if(el){ el.textContent = t; el.classList.toggle('ok', this.active); }
  },

  readUltrasonic(){
    if(typeof isSensorConnected !== 'function' || !isSensorConnected()) return null;
    const v = Number(sensors.ultrasonic.value);
    return Number.isFinite(v) && v > 0 ? v : null;
  },

  pickTarget(){
    const list = (typeof lastDetections !== 'undefined' && lastDetections) || [];
    const m = list.filter(d => this.classes.includes(d.class));
    return m.length ? m.sort((a, b) => b.score - a.score)[0] : null;
  },

  // Naya message chat + voice dono me; wahi line repeat ho to sirf bolna (chat bharna nahi)
  say(text, key){
    const changed = key !== this.lastSpokeKey;
    this.lastSpokeKey = key; this.lastSpokeAt = Date.now();
    const urgent = key === 'obstacle' || /^safe-/.test(key);
    // Step 12: DecisionManager — dedupe + queue; obstacle (priority 3) baaki sab ko kaat kar turant bolta hai
    DecisionManager.say(text, { key: 'finder:' + key, priority: urgent ? 3 : 2, cooldownMs: 1200, chat: changed, ttlMs: 3500 });
  },

  // Ek hi forward ultrasonic left/right nahi dekh sakta — isliye camera ke baaki objects se
  // andaza: jis side kam objects/area, wahi safe.
  safeSide(targetDir, vw, vh){
    let left = 0, right = 0;
    ((typeof lastDetections !== 'undefined' && lastDetections) || []).forEach(d => {
      if(this.classes.includes(d.class)) return;
      const [x, , w, h] = d.bbox;
      const area = (w * h) / (vw * vh);
      if(x + w / 2 < vw / 2) left += area; else right += area;
    });
    if(Math.abs(left - right) < 0.01) return /left/.test(targetDir || '') ? 'left' : 'right';
    return left < right ? 'left' : 'right';
  },

  tick(){
    if(!this.active) return;
    const C = FINDER_CFG, now = Date.now();
    const fem = FINDER_FEM.includes(this.classes[0]);

    if(!objDepthStream){
      if(now - this.startedAt > C.camWarmupMs) this.finish(FINDER_TEXT.camFail);
      return; // camera abhi start ho raha hai
    }
    const video = document.getElementById('objDepthVideo');
    const vw = video ? video.videoWidth : 0, vh = video ? video.videoHeight : 0;
    if(!vw || !vh || !visionModel) return; // model / frame ready nahi

    if(now - Math.max(this.startedAt, this.lastSeenAt) > C.timeoutMs){
      this.finish(FINDER_TEXT.timeout(this.label, fem)); return;
    }

    const ultra = this.readUltrasonic();
    const det = this.pickTarget();
    if(det){ this.lastSeenAt = now; this.lastDet = det; }
    const useDet = det || (this.lastDet && now - this.lastSeenAt <= C.graceMs ? this.lastDet : null);

    let dir = null, areaR = 0, hR = 0, inMid = false, distM = null;
    if(useDet){
      const [x, , w, h] = useDet.bbox;
      const cx = x + w / 2;
      dir = finderZone(cx / vw);
      inMid = cx >= vw / 3 && cx <= vw * 2 / 3;
      areaR = (w * h) / (vw * vh);
      hR = h / vh;
      // Step 5: distance — camera estimate (median of last 5), center me ultrasonic ho to wahi
      const camM = finderCamDist(useDet.class, h, vh);
      if(camM != null && det){ this.distHist.push(camM); if(this.distHist.length > 5) this.distHist.shift(); }
      if(this.distHist.length){ const sd = this.distHist.slice().sort((a, b) => a - b); distM = sd[sd.length >> 1]; }
      if(inMid && ultra !== null && ultra < 400 && areaR >= 0.03) distM = Math.round(ultra) / 100;
    } else {
      this.distHist = [];
    }

    // 1) Pahunch gaye? (object abhi dikh raha ho, center me, aur bahut paas)
    const bigEnough = inMid && (hR >= C.arriveHeightRatio || areaR >= C.arriveAreaRatio);
    const ultraClose = inMid && ultra !== null && ultra <= C.arriveCm && areaR >= 0.05;
    const arriveNow = !!det && (bigEnough || ultraClose);
    this.arriveCount = arriveNow ? this.arriveCount + 1 : 0;
    if(this.arriveCount >= C.arriveNeedTicks){
      this.finish(FINDER_TEXT.found(this.label, fem)); return;
    }

    // 2) Obstacle (ultrasonic) — object ke bilkul saamne wala "obstacle" nahi maana jaata
    const obstacleNow = ultra !== null && !arriveNow
      && (this.obstacle ? ultra < C.obstacleClearCm : ultra < C.obstacleCm);
    if(obstacleNow){
      if(!this.obstacle){
        this.obstacle = true; this.obstacleSince = now;
        this.say(FINDER_TEXT.obstacle, 'obstacle');
        this.setStatus(`⚠️ Obstacle ${Math.round(ultra)} cm — ruko`);
      } else if(now - this.obstacleSince > 1500 && now - this.lastSafeAt > 4000){
        this.lastSafeAt = now;
        const side = this.safeSide(dir, vw, vh);
        this.say(FINDER_TEXT.safe(side), 'safe-' + side);
        this.setStatus(`⚠️ Obstacle ${Math.round(ultra)} cm — thoda ${side} jao`);
      }
      return;
    }
    if(this.obstacle){
      this.obstacle = false;
      this.say(FINDER_TEXT.clear, 'clear');
      return;
    }

    // 3) Object dikh raha hai → LEFT / CENTER / RIGHT guidance (2 baar lagatar same side tab badlo)
    if(useDet){
      if(dir !== this.dirCand){ this.dirCand = dir; this.dirCount = 1; } else this.dirCount++;
      const committed = (this.dirCount >= 2 || this.lastDir === null) ? this.dirCand : this.lastDir;
      const first = this.lastDir === null;
      this.lastDir = committed;
      const dTxt = finderDistText(distM);
      const dKey = distM == null ? '' : String(distM < 1 ? 0 : Math.round(distM));
      const distMoved = distM != null && this.lastSpokeDist != null
        && Math.abs(distM - this.lastSpokeDist) >= Math.max(1, this.lastSpokeDist * 0.3);
      const lastWasGuidance = this.lastSpokeKey.indexOf(':') >= 0;
      if(first || !lastWasGuidance || committed !== this.lastSpokeKey.split(':')[0] || distMoved || now - this.lastSpokeAt >= C.repeatFoundMs){
        const line = FINDER_TEXT[committed];
        const cap = dTxt ? dTxt.charAt(0).toUpperCase() + dTxt.slice(1) : '';
        const msg = first ? `${FINDER_TEXT.seen(this.label, fem)} ${cap ? cap + '. ' : ''}${line}`
                          : (dTxt ? `${this.label} ${dTxt}. ${line}` : line);
        this.say(msg, committed + ':' + dKey);
        this.lastSpokeDist = distM;
      }
      this.setStatus(`🎯 ${this.label}: ${committed.toUpperCase()}${distM != null ? ' · ~' + distM.toFixed(1) + ' m' : ''}${ultra !== null ? ' · ' + Math.round(ultra) + ' cm' : ''}`);
      return;
    }

    // 4) Nahi dikha → scan jaari
    this.lastDir = null; this.dirCand = null; this.dirCount = 0;
    if(now - this.startedAt < 1500) return;
    if(this.lastSpokeKey !== 'lost' || now - this.lastSpokeAt >= C.repeatLostMs){
      this.say(FINDER_TEXT.notFound(this.label, fem), 'lost');
    }
    this.setStatus(`🔎 ${this.label} nahi mili — camera scan jaari...`);
  }
};

/* =====================================================
   FACE INTELLIGENCE — THE ONE face-recognition pipeline
   Camera (CamEngine) → TinyFaceDetector → FaceLandmark68 →
   FaceRecognitionNet → 128-d descriptor → Saved faces → Match → Name
   - No expression model, no MediaPipe Face Mesh, no duplicate loaders.
   - Front/Back switch goes through CamEngine.getStream().
   - Stop always stops EVERY track on the stream.
   - Overlay canvas size is kept in sync with the live video frame size.
===================================================== */
let faceTrimStream = null;
let faceTrimDetectTimer = null;
let faceTrimFrontCam = false; // false = back camera (default)
let faceTrimStarting = false;
let lastFaceTrimDetections = [];

// Keep the overlay canvas pixel size locked to the actual video frame size
// (fixes stretched/misaligned boxes across devices and after camera switch).
function syncFaceTrimCanvas(video){
  const canvas = document.getElementById('faceTrimCanvas');
  if(!canvas || !video) return;
  const w = video.videoWidth, h = video.videoHeight;
  if(w && h && (canvas.width !== w || canvas.height !== h)){
    canvas.width = w; canvas.height = h;
  }
}

async function startFaceTrimCamera(){
  // Ensure panel is open so the video element exists
  if(currentPanel !== 'facetrim'){
    openPanel('facetrim');
    await new Promise(r => setTimeout(r, 80));
  }
  const video = document.getElementById('faceTrimVideo');
  if(!video){
    console.error('faceTrimVideo element not found');
    return;
  }
  if(faceTrimStarting) return;        // FIX: double-tap par do stream nahi khulenge
  faceTrimStarting = true;
  try{
    // FIX: pehle models load hote the (CDN, slow) aur camera tab tak nahi khulta tha — ab camera pehle
    if(faceTrimStream){
      // Already running — re-attach instead of opening a second stream
      // (opening a second one here would leak the first stream's tracks
      // and keep the back camera locked for every other panel).
      await CamEngine.attachStream(video, faceTrimStream, faceTrimFrontCam);
      // FIX #5: re-attach par stream chalu rehti thi par detect timer band => recognition ruk jata tha
      if(!faceTrimDetectTimer) startFaceTrimDetectLoop(video);
      return;
    }
    const gotStream = await CamEngine.getStream(faceTrimFrontCam);
    if(currentPanel !== 'facetrim' && !document.getElementById('faceTrimVideo')){
      // BUG FIX: user ne start ke dauran panel chhod diya => stream leak hoti thi (camera locked rehta tha)
      gotStream.getTracks().forEach(t => t.stop());
      return;
    }
    faceTrimStream = gotStream;
    const vNow = document.getElementById('faceTrimVideo') || video;
    await CamEngine.attachStream(vNow, faceTrimStream, faceTrimFrontCam);
    vNow.onloadedmetadata = () => syncFaceTrimCanvas(vNow); // BUG FIX: har start par naya listener jama hota tha
    syncFaceTrimCanvas(vNow);

    startFaceTrimDetectLoop(video);

    if(!faceRecogModelsLoaded){
      addMsg('Camera on hai. Face models load ho rahe hain (pehli baar internet chahiye)...', 'bot');
      ensureFaceRecogModels().then(() => { if(currentPanel === 'facetrim') renderFaceTrimPanel(); });
    }

    // Auto: online → Live Cloud, offline → local models
    if(typeof CloudAPI !== 'undefined' && CloudAPI.isReady()) LiveCloud.autoFor('facetrim');
    try { if(typeof speak === 'function') speak(`Face recognition ready. ${faceTrimFrontCam ? 'Front' : 'Back'} camera.`); } catch(e){}
    if(currentPanel === 'facetrim') renderFaceTrimPanel();
  }catch(e){
    addMsg('Camera access nahi mil paaya (Face Intelligence). Permission allow karo + H2APK me Camera permission ON karo.', 'bot');
    console.error('FaceTrim cam error', e);
    faceTrimStream = null;
  }finally{
    faceTrimStarting = false;
  }
}

function stopFaceTrimCamera(){
  clearInterval(faceTrimDetectTimer); faceTrimDetectTimer = null;
  LiveCloud.autoStopIf('faceTrimVideo');
  if(faceTrimStream){
    faceTrimStream.getTracks().forEach(t => t.stop()); // stop ALL tracks
    faceTrimStream = null;
  }
  lastFaceTrimDetections = [];
  lastRecognizedFaces = [];
  FacePipeline.reset();
  if(currentPanel === 'facetrim') renderFaceTrimPanel();
}

// Front/Back switch — goes through CamEngine, restarts the single pipeline.
async function switchFaceTrimCamera(){
  faceTrimFrontCam = !faceTrimFrontCam;
  if(faceTrimStream){
    stopFaceTrimCamera();
    await startFaceTrimCamera();
  } else if(currentPanel === 'facetrim'){
    renderFaceTrimPanel();
  }
}

let faceTrimDetectBusy = false;
function startFaceTrimDetectLoop(video){
  clearInterval(faceTrimDetectTimer);
  faceTrimDetectBusy = false; // (FacePipeline._busy ab overlap rokta hai)
  faceTrimDetectTimer = setInterval(async () => {
    // Without this guard, a new detect+landmarks+descriptor pass could
    // start every 350ms even while the previous one (the heaviest pipeline
    // in the app — 3 models chained per face) was still running, piling up
    // overlapping GPU work until the camera stalls and matches stop
    // updating. Same pattern already used by the object-detection loop.
    if(faceTrimDetectBusy) return;
    if(!AIScheduler.due('face')) return; // Step 11: scheduler decide karta hai ye model abhi chalna chahiye ya nahi
    // FIX: panel re-render se <video> node badal jata hai — hamesha current node par detect karo
    const vEl = document.getElementById('faceTrimVideo') || video;
    if(!vEl || vEl.readyState < 2 || !faceRecogModelsLoaded) return;
    faceTrimDetectBusy = true;
    try{
      // Steps 6+7: 640px frame par detection har tick; landmarks+descriptor+matching sirf naye face /
      // har ~1.5s recheck par (FacePipeline). Beech ke ticks me cached naam use hota hai.
      const r = await FacePipeline.run(vEl, { announce: true });
      lastFaceTrimDetections = r.detections;
      lastRecognizedFaces = r.recognized;
      drawFaceTrimResults(vEl, lastFaceTrimDetections, lastRecognizedFaces);
      if(currentPanel === 'facetrim') updateFaceTrimInfo();
    }catch(e){ console.warn('faceTrim detect error', e); }
    faceTrimDetectBusy = false;
  }, 350);
}

// FIX #3: detect-only tick me descriptor null hota hai => Array.from(null) crash. Ab hamesha safe result.
function faceMatchFor(d, i, recognized){
  if(recognized && recognized[i]) return recognized[i];
  if(d && d.descriptor && d.descriptor.length === 128) return matchFaceDescriptor(Array.from(d.descriptor));
  return { name: 'Unknown', dist: null };
}

function drawFaceTrimResults(video, detections, recognized){
  const canvas = document.getElementById('faceTrimCanvas');
  if(!canvas) return;
  syncFaceTrimCanvas(video);
  if(!canvas.width || !canvas.height) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // FIX #4: faceapi.resizeResults / draw.drawDetections plain {detection, descriptor} objects par library-version ke hisaab se toot jate the
  // (boxes/labels draw nahi hote). Ab box khud scale + draw hota hai — library par bharosa nahi.
  (detections || []).forEach((d, i) => {
    if(!d || !d.detection || !d.detection.box) return;
    const dims = d.detection.imageDims || { width: canvas.width, height: canvas.height };
    const kx = canvas.width / (dims.width || canvas.width), ky = canvas.height / (dims.height || canvas.height);
    const bb = d.detection.box;
    const box = { x: bb.x * kx, y: bb.y * ky, width: bb.width * kx, height: bb.height * ky };
    const m = faceMatchFor(d, i, recognized);
    const known = m.name !== 'Unknown';
    const conf = m.dist != null && Number.isFinite(m.dist) ? (Math.max(0, 1 - m.dist/1.2) * 100).toFixed(0) + '%' : '';
    const color = known ? '#3ee6c4' : '#ff8a8a';
    ctx.lineWidth = Math.max(2, Math.round(canvas.width / 320));
    ctx.strokeStyle = color;
    ctx.strokeRect(box.x, box.y, box.width, box.height);
    ctx.fillStyle = color;
    ctx.font = Math.max(15, Math.round(canvas.width / 40)) + 'px monospace';
    const label = known ? `${m.name} · ${conf}` : 'Unknown';
    const ty = box.y > 18 ? box.y - 6 : box.y + box.height + 16;
    if(faceTrimFrontCam){
      // .cam-wrap-mirror canvas ko bhi flip karta hai => text ulta dikhta tha. Text ko wapas seedha karo.
      ctx.save(); ctx.translate(box.x + box.width, ty); ctx.scale(-1, 1); ctx.textAlign = 'left';
      ctx.fillText(label, 0, 0); ctx.restore();
    } else ctx.fillText(label, box.x, ty);
  });
}

function updateFaceTrimInfo(){
  const box = document.getElementById('faceTrimInfo');
  if(!box) return;
  if(!lastFaceTrimDetections.length){
    box.innerHTML = '<div class="status-line">Koi face nahi — camera ke saamne aao.</div>';
    return;
  }
  box.innerHTML = lastFaceTrimDetections.map((d, i) => {
    const m = faceMatchFor(d, i, lastRecognizedFaces);
    const conf = m.dist != null && Number.isFinite(m.dist) ? (Math.max(0, 1 - m.dist/1.2) * 100).toFixed(0) + '%' : '—';
    return `<div class="face-row"><span class="fname">Face #${i+1}</span><span class="fconf">${escapeHtml(m.name)} · match ${conf}</span></div>`;
  }).join('');
}

async function enrollFaceTrim(name){
  const video = document.getElementById('faceTrimVideo');
  if(!video || !faceTrimStream){
    addMsg('Please start the camera first, then try enrolling.', 'bot');
    return;
  }
  name = (name||'').trim().replace(/\s+/g, ' ').slice(0, 40);
  if(!name){ addMsg('Please enter a name first.', 'bot'); return; }
  // BUG FIX: "Unknown" naam enroll hone par matcher use "no match" samajhta tha => kabhi announce nahi hota
  if(/^(unknown|anjaan|none|null|undefined)$/i.test(name)){ addMsg('Ye naam reserved hai — koi aur naam do.', 'bot'); return; }
  if(!faceRecogModelsLoaded){
    addMsg('Models abhi load ho rahe hain, ek second ruko...', 'bot');
    await ensureFaceRecogModels();
    if(!faceRecogModelsLoaded){
      addMsg('Models load nahi ho paaye — internet check karke camera dobara start karo.', 'bot');
      return;
    }
  }
  // BUG FIX: enroll ke dauran live detect loop bhi chalta tha (do heavy TF pass ek saath) — enroll ke waqt loop pause.
  const prevBusy = faceTrimDetectBusy; faceTrimDetectBusy = true;
  try{
    // 3 frames lo aur descriptor ka average rakho — ek frame se zyada pakka pehchan banti hai
    const samples = [];
    let bestDet = null, multiFace = false;
    for(let i = 0; i < 3; i++){
      // BUG FIX: detectSingleFace frame ka sabse bada face utha leta tha — do log hon to galat banda enroll ho jata tha
      const all = await faceapi
        .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize:416, scoreThreshold:0.5 }))
        .withFaceLandmarks()
        .withFaceDescriptors();
      if(all.length > 1) multiFace = true;
      const d = all.slice().sort((a, b) => b.detection.score - a.detection.score)[0];
      if(d){
        samples.push(Array.from(d.descriptor));
        if(!bestDet || d.detection.score > bestDet.detection.score) bestDet = d;
      }
      if(i < 2) await new Promise(r => setTimeout(r, 250));
    }
    if(!samples.length){ addMsg('No face was detected — please face the camera directly.', 'bot'); return; }
    if(multiFace){ addMsg('Frame me ek se zyada face dikh rahe hain — sirf ek insaan camera ke saamne rakho, phir Enroll dabao.', 'bot'); return; }
    // quality gate: bahut chhota / dhundhla face = kharab descriptor
    const bw = bestDet.detection.box.width;
    if(bw < Math.min(video.videoWidth, video.videoHeight) * 0.18 || bestDet.detection.score < 0.7){
      addMsg('Face bahut chhota ya dhundhla hai — camera ke paas aao, roshni me dekho, phir dobara Enroll karo.', 'bot'); return;
    }
    // consistency gate: 3 frame ke descriptors aapas me door hon to insaan hil raha tha / alag chehre the
    let maxPair = 0;
    for(let a = 0; a < samples.length; a++) for(let b = a + 1; b < samples.length; b++) maxPair = Math.max(maxPair, euclideanDistance(samples[a], samples[b]));
    if(maxPair > 0.5){ addMsg('Enroll ke dauran face hil gaya — seedha dekho, 1 second sthir raho, phir dobara Enroll karo.', 'bot'); return; }
    const descriptor = samples[0].map((_, k) => samples.reduce((acc, v) => acc + v[k], 0) / samples.length);
    // warning: yahi chehra pehle se kisi aur naam se enrolled hai?
    const dup = matchFaceDescriptor(descriptor);
    if(dup.name !== 'Unknown' && dup.name.toLowerCase() !== name.toLowerCase() && dup.dist != null && dup.dist < 0.4){
      addMsg(`Dhyan do: ye chehra pehle se "${dup.name}" naam se enrolled lagta hai. "${name}" bhi save kar raha hoon — agar galti hai to ek naam delete kar do.`, 'bot');
    }

    // Chhoti photo (thumbnail) — face ke box se crop, taaki list me dikhe
    let photo = '';
    try{
      const bx = bestDet.detection.box;
      const px = bx.width * 0.25, py = bx.height * 0.25;
      const sx = Math.max(0, bx.x - px), sy = Math.max(0, bx.y - py);
      const sw = Math.min(video.videoWidth - sx, bx.width + px * 2), sh = Math.min(video.videoHeight - sy, bx.height + py * 2);
      const cv = document.createElement('canvas');
      cv.width = 96; cv.height = 96;
      cv.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, 96, 96);
      photo = cv.toDataURL('image/jpeg', 0.7);
    }catch(e){ console.warn('face thumbnail failed', e); }

    const existing = knownFaces.findIndex(f => f.name.toLowerCase() === name.toLowerCase());
    const nowTs = Date.now();
    if(existing >= 0){
      const ef = knownFaces[existing];
      ef.descriptor = descriptor; if(photo) ef.photo = photo;
      ef.version = (ef.version || 1) + 1; ef.updatedAt = nowTs;
    } else knownFaces.push({ id: faceUuid(), name, descriptor, photo, version: 1, updatedAt: nowTs });
    const saved = await saveKnownFaces(); // IndexedDB (primary) -> read-back verify -> localStorage backup
    if(!saved.ok){
      addMsg(`❌ "${name}" abhi sirf memory me hai, storage me SAVE NAHI hua — app band karte hi chala jayega. Browser / app ki storage permission ya khali jagah check karo.${saved.error ? ' (' + saved.error + ')' : ''}`, 'bot');
      if(currentPanel === 'facetrim') renderFaceTrimPanel();
      return;
    }
    const verifyNote = saved.idb ? ' ✅ Storage me verify ho gaya (read-back OK).' : ` ⚠️ IndexedDB verify FAIL${saved.error ? ' (' + saved.error + ')' : ''} — sirf localStorage backup me hai, app/browser data clear hua to chala jayega.`;
    try{ MemoryManager.syncKnownFaceNames(knownFaces.map(f => f.name)); }catch(e){ console.warn('syncKnownFaceNames failed', e); }

    // Push to cloud backend so other devices signed in with the same
    // owner id see this face too. Skipped entirely in single-device mode
    // (FACE_BACKEND_ENABLED = false) — no wasted network call, no delay.
    let cloudSynced = false;
    if(FACE_BACKEND_ENABLED){
      try{
        await faceApiCall('/api/faces/enroll', { method: 'POST', body: JSON.stringify({ name, descriptor }) });
        cloudSynced = true;
      }catch(e){ console.warn('Cloud enroll failed (saved locally only):', e.message); }
    }

    if(cloudSynced){
      addMsg(`"${name}" enroll ho gaya (128-d descriptor, ${knownFaces.length} known faces total) — cloud par sync bhi ho gaya, doosre device par bhi pehchana jaayega.${verifyNote}`, 'bot');
    } else if(FACE_BACKEND_ENABLED){
      addMsg(`"${name}" is device par save ho gaya (${knownFaces.length} known faces total), lekin cloud sync fail hua — internet check karo. Yahan pe identify karta rahega, doosre device par tab tak nahi dikhega.${verifyNote}`, 'bot');
    } else {
      addMsg(`"${name}" save ho gaya (${samples.length} frame se, ${knownFaces.length} known faces total) — is device par ab hamesha pehchana jaayega.${verifyNote}`, 'bot');
    }
    if(currentPanel === 'facetrim') renderFaceTrimPanel();
  }catch(e){
    console.error('Enroll error', e);
    addMsg('Enroll fail: ' + (e && e.message || 'error'), 'bot');
  }finally{
    faceTrimDetectBusy = prevBusy;
    FacePipeline.reset(); // BUG FIX: purane tracks me cached 'Unknown' / purana naam 1.5s+ chipka rehta tha
  }
}

/* ---------- FACE CHECK: har step ki jaanch (camera -> models -> detect -> descriptor -> match -> storage) ---------- */
async function faceDiagnostics(){
  const L = [];
  const add = (ok, name, detail) => L.push((ok === null ? 'ℹ️' : ok ? '✅' : '❌') + ' ' + name + (detail ? ' — ' + detail : ''));
  const T = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(label + ' ' + ms + 'ms me nahi hua')), ms))]);
  addMsg('🩺 Face Check chal raha hai (30-60s lag sakte hain, models pehli baar download ho to)...', 'bot');
  try{
    // 1) environment
    add(null, 'Match threshold', String(FACE_MATCH_THRESHOLD));
    add(null, 'Page', location.protocol + '//' + (location.host || '(local)') + ' · secure=' + window.isSecureContext + ' · online=' + navigator.onLine);
    if(location.protocol === 'file:') add(false, 'file:// par chal raha hai', 'camera / IndexedDB / service worker aksar block hote hain — HTTPS hosting ya APK ka https scheme use karo');
    add(typeof faceapi !== 'undefined', 'face-api.js library', typeof faceapi === 'undefined' ? 'load nahi hui (CDN block / internet)' : 'loaded');
    try{ if(typeof faceapi !== 'undefined' && faceapi.tf) add(null, 'face-api TF', faceapi.tf.getBackend() + ' · tfjs ' + (faceapi.tf.version_core || (faceapi.tf.version && (faceapi.tf.version.tfjs || faceapi.tf.version['tfjs-core'])) || '?') + (faceapi.version && faceapi.version.faceapi ? ' · face-api ' + faceapi.version.faceapi : ' · (original 0.22.x)')); }catch(e){}
    // 2) model server reachable?
    try{
      const r = await T(fetch(FACEAPI_MODEL_URL + '/tiny_face_detector_model-weights_manifest.json', { cache: 'no-store' }), 8000, 'model server');
      add(r.ok, 'Model server (CDN)', 'HTTP ' + r.status);
    }catch(e){ add(false, 'Model server (CDN)', (e && e.message) + ' — internet / CDN block / CORS'); }
    // 3) models
    let modelsOk = faceRecogModelsLoaded;
    if(!modelsOk && typeof faceapi !== 'undefined'){
      const t0 = Date.now();
      try{ modelsOk = await T(ensureFaceRecogModels(), 60000, 'models load'); add(modelsOk, 'Models load', modelsOk ? (Date.now() - t0) + 'ms' : 'fail (upar chat me error dekho)'); }
      catch(e){ add(false, 'Models load', e && e.message); }
    } else add(modelsOk, 'Models', modelsOk ? 'loaded' : 'face-api nahi');
    // 4) camera
    const v = document.getElementById('faceTrimVideo');
    let camOk = false;
    if(!faceTrimStream || !v){ add(false, 'Camera', 'ON nahi hai — pehle "Start Camera" dabao, phir Face Check'); }
    else{
      const tr = faceTrimStream.getVideoTracks()[0];
      camOk = !!tr && tr.readyState === 'live' && v.readyState >= 2 && v.videoWidth > 0;
      add(camOk, 'Camera', (tr ? tr.readyState : 'no track') + ' · ' + v.videoWidth + 'x' + v.videoHeight + ' · video.readyState=' + v.readyState + (faceTrimFrontCam ? ' · front' : ' · back'));
    }
    // 5) detect + descriptor + match
    if(modelsOk && camOk){
      try{
        const res = await T(faceapi.detectAllFaces(v, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 })).withFaceLandmarks().withFaceDescriptors(), 15000, 'detect');
        add(res.length > 0, 'Face detect', res.length + ' face' + (res.length === 1 ? '' : 's') + (res.length ? ' · score ' + res.map(r => r.detection.score.toFixed(2)).join('/') + ' · width ' + res.map(r => Math.round(r.detection.box.width) + 'px').join('/') : ' — camera ke saamne seedha aao, roshni ho'));
        if(res.length){
          const d = Array.from(res[0].descriptor);
          add(d.length === 128 && d.every(Number.isFinite), 'Descriptor', d.length + '-d' + (d.every(Number.isFinite) ? '' : ' (NaN!)'));
          if(!knownFaces.length) add(null, 'Match', 'koi enrolled face nahi — pehle Enroll karo');
          else{
            const ds = knownFaces.map(f => ({ n: f.name, d: euclideanDistance(d, f.descriptor) })).sort((a, b) => a.d - b.d);
            add(ds[0].d <= FACE_MATCH_THRESHOLD, 'Match', ds.slice(0, 4).map(x => x.n + ' ' + x.d.toFixed(2)).join(' · ') + ' (limit ' + FACE_MATCH_THRESHOLD + ')' + (ds[0].d > FACE_MATCH_THRESHOLD ? ' — door hai: roshni/angle same rakho ya dobara Enroll karo' : ''));
          }
        }
      }catch(e){ add(false, 'Detect', e && e.message); }
    }
    // 6) storage
    add(!!window.indexedDB, 'IndexedDB', window.indexedDB ? 'available' : 'NAHI hai');
    try{
      const rec = await T(FaceDB.get(), 5000, 'IndexedDB read');
      let lsN = 0; try{ lsN = JSON.parse(localStorage.getItem('vision_known_faces') || '[]').length; }catch(e){}
      const idbN = rec && rec.faces ? rec.faces.length : 0;
      add(idbN === knownFaces.length, 'Faces count', 'memory ' + knownFaces.length + ' · IndexedDB ' + idbN + ' · localStorage ' + lsN + ' · loaded from: ' + faceLoadSource);
    }catch(e){ add(false, 'IndexedDB read', e && e.message); }
    try{ if(navigator.storage && navigator.storage.persisted) add(null, 'Persistent storage', (await navigator.storage.persisted()) ? 'granted' : 'NOT granted (browser data clear kar sakta hai)'); }catch(e){}
    try{
      const T2 = Object.create(FaceDB); T2.dbName = 'nancy_facecheck_db';
      const f = faceEnsureMeta({ name: 'check', descriptor: new Array(128).fill(0.25) });
      await T2.put({ savedAt: Date.now(), faces: [f] }); const vr = await T2.verify([f]);
      add(vr.ok, 'Save + read-back test', vr.ok ? 'OK' : 'FAIL');
      try{ indexedDB.deleteDatabase('nancy_facecheck_db'); }catch(e){}
    }catch(e){ add(false, 'Save + read-back test', e && e.message); }
  }catch(e){ add(false, 'Face Check crash', e && e.message); }
  const bad = L.filter(x => x.indexOf('❌') === 0).length;
  addMsg('🩺 Face Check: ' + (bad ? bad + ' problem mili' : 'sab theek') + '\n' + L.join('\n'), 'bot');
  return L;
}

function renderFaceTrimPanel(){
  panelTitle.textContent = 'FACE RECOGNITION';
  const running = !!faceTrimStream;
  const online = CloudAPI.isReady();
  const chips = knownFaces.map(f =>
    `<span class="known-face-chip">${f.photo ? `<img src="${f.photo}" alt="" style="width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;">` : ''}${escapeHtml(f.name)} <button type="button" data-del="${escapeHtml(f.name)}" title="Delete">✕</button></span>`
  ).join('') || '<span class="status-line">No faces enrolled yet.</span>';
  panelBody.innerHTML = `
    <div id="faceTrimWrap" style="margin-top:8px; ${running?'':'display:none;'}">
      <video webkit-playsinline autoplay id="faceTrimVideo" playsinline muted></video>
      <canvas id="faceTrimCanvas"></canvas>
    </div>
    <div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;">
      <button class="act ${running?'stop':''}" id="btnFaceTrimCam">${running?'⏹ Stop Camera':'📷 Start Camera'}</button>
      <button class="act" id="btnFaceTrimSwitch" ${running?'':'disabled'}>🔄 Switch to ${faceTrimFrontCam ? 'Back' : 'Front'}</button>
      ${online ? `<button class="act ${LiveCloud.isRunning() && LiveCloud.videoId==='faceTrimVideo' ? 'stop' : ''}" id="btnFaceCloud" style="background:#1a3a2a;border-color:#3ee6c4;">
        ${LiveCloud.isRunning() && LiveCloud.videoId==='faceTrimVideo' ? '⏹ Stop Live Cloud Face' : '☁️ Live Cloud Face (Video)'}
      </button>` : ''}
    </div>
    <div class="row" style="margin-top:12px;">
      <input class="mini" id="faceTrimEnrollName" type="text" placeholder="Naam (jaise Rahul)" />
      <button class="act" id="btnFaceTrimEnroll">🪪 Enroll Face</button>
    </div>
    <div class="status-line" style="margin-top:8px;">Known faces ${FACE_BACKEND_ENABLED ? (faceCloudSynced ? '(☁️ cloud-synced)' : '(local only — cloud sync pending)') : '(saved on this device)'}</div>
    <div id="faceTrimKnownList">${chips}</div>
    <div class="face-info" id="faceTrimInfo" style="margin-top:10px;"></div>
  `;
  if(running){
    const v = document.getElementById('faceTrimVideo');
    if(faceTrimStream){
      v.srcObject = faceTrimStream;
      // FIX: same re-render issue as Object Detection — the <video> node
      // is rebuilt here, so playback must be explicitly resumed or the
      // frame freezes and face matching stops updating.
      v.play().catch(()=>{});
      if(!faceTrimDetectTimer) startFaceTrimDetectLoop(v); // FIX #5: re-render ke baad loop zinda rakho
      if(faceTrimFrontCam) CamEngine.applyMirror(v); else CamEngine.removeMirror(v); // FIX: re-render ke baad mirror class chali jati thi
    }
  }
  updateFaceTrimInfo();
  document.getElementById('btnFaceTrimCam').addEventListener('click', () => {
    if(running){ LiveCloud.stop(); stopFaceTrimCamera(); }
    else startFaceTrimCamera();
  });
  const switchBtn = document.getElementById('btnFaceTrimSwitch');
  if(switchBtn) switchBtn.addEventListener('click', () => switchFaceTrimCamera());
  const cloudBtn = document.getElementById('btnFaceCloud');
  if(cloudBtn){
    cloudBtn.addEventListener('click', () => {
      LiveCloud.toggle('faceTrimVideo',
        'Describe all faces visible: approximate age range, gender presentation, facial expression, and any notable features (glasses, beard, etc). Be respectful and factual. Keep short. If no face, say so.',
        'faceTrimInfo');
      renderFaceTrimPanel();
    });
  }
  document.getElementById('btnFaceTrimEnroll').addEventListener('click', () => {
    enrollFaceTrim(document.getElementById('faceTrimEnrollName').value);
  });
  panelBody.querySelectorAll('[data-del]').forEach(btn => {
