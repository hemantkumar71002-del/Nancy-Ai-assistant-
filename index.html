  <script>
(function(){
  if(typeof Notification!=='undefined')return;
  if(typeof H2A==='undefined'||!H2A.showNotification)return;
  var p=H2A.getNotificationPermission(),cbs=[];
  window.Notification=function(t,o){
    if(p==='granted')H2A.showNotification(t,(o&&o.body)||'');
  };
  Object.defineProperty(Notification,'permission',{get:function(){return p;}});
  Notification.requestPermission=function(){
    return new Promise(function(r){
      if(p==='granted'){r('granted');return;}
      cbs.push(r);H2A.requestNotificationPermission();
      var n=0,i=setInterval(function(){
        p=H2A.getNotificationPermission();
        if(p==='granted'||++n>60){
          clearInterval(i);
          cbs.forEach(function(c){c(p==='granted'?'granted':'denied');});
          cbs=[];
        }
      },500);
    });
  };
})();
  </script>
  <script>
(function(){
  if(navigator.share)return;
  if(typeof H2AShare==='undefined')return;
  navigator.share=function(d){
    d=d||{};
    return new Promise(function(res){
      H2AShare.share(d.title||'',d.text||'',d.url||'');
      res();
    });
  };
  navigator.canShare=function(d){ return !(d&&d.files&&d.files.length); };
})();
  </script>
  <script>
(function(){
  if(window.speechSynthesis&&window.SpeechSynthesisUtterance){
    // Native API present — patch speak() to retry after voices load
    var s=window.speechSynthesis,origSpeak=s.speak.bind(s);
    s.speak=function(u){
      if(s.getVoices().length===0){
        var done=false;
        var fire=function(){ if(done)return; done=true; origSpeak(u); };
        s.addEventListener('voiceschanged',fire,{once:true});
        setTimeout(fire,250);
      } else { origSpeak(u); }
    };
    return;
  }
  // Native API absent — polyfill via Android TTS bridge
  if(typeof H2ATTS==='undefined')return;
  var fakeVoice={name:'Android TTS',lang:navigator.language||'en',localService:true,default:true,voiceURI:'android'};
  window.SpeechSynthesisUtterance=function(text){
    this.text=text||'';
    this.lang=navigator.language||'en';
    this.rate=1;this.pitch=1;this.volume=1;
    this.voice=fakeVoice;
    this.onstart=null;this.onend=null;this.onerror=null;
  };
  window.speechSynthesis={
    speaking:false,paused:false,pending:false,
    getVoices:function(){ return [fakeVoice]; },
    speak:function(u){
      this.speaking=true;
      if(u.onstart) try{u.onstart({});}catch(e){}
      H2ATTS.speak(u.text||'');
      var self=this;
      setTimeout(function(){
        self.speaking=false;
        if(u.onend) try{u.onend({});}catch(e){}
      }, Math.max(800, (u.text||'').length*90+600));
    },
    cancel:function(){ H2ATTS.stop(); this.speaking=false; },
    pause:function(){},
    resume:function(){}
  };
  // Fire voiceschanged so callers waiting on it unblock
  setTimeout(function(){
    var e=new Event('voiceschanged');
    window.speechSynthesis.dispatchEvent&&window.speechSynthesis.dispatchEvent(e);
  },100);
})();
  </script>
  <script>
(function(){
  if(typeof H2AClip==='undefined')return;
  if(!navigator.clipboard)navigator.clipboard={};
  navigator.clipboard.readText=function(){
    try{return Promise.resolve(H2AClip.readText());}catch(e){return Promise.reject(e);}
  };
  navigator.clipboard.writeText=function(t){
    try{H2AClip.writeText(String(t));return Promise.resolve();}catch(e){return Promise.reject(e);}
  };
})();
(function(){
  function handleDownloadAnchor(a){
    var href=a.href||'';
    var filename=a.getAttribute('download')||'download';
    if(href.startsWith('data:')){
      var comma=href.indexOf(',');
      if(comma<0)return false;
      var meta=href.substring(5,comma);
      var b64part=href.substring(comma+1);
      var mime=meta.split(';')[0]||'application/octet-stream';
      var b64=meta.indexOf('base64')>=0?b64part:btoa(decodeURIComponent(b64part.replace(/\+/g,' ')));
      if(window.H2AFile){H2AFile.saveBase64File(b64,filename,mime);return true;}
    }
    if(href.startsWith('blob:')){
      fetch(href).then(function(r){return r.blob();}).then(function(b){
        var mime=b.type||'application/octet-stream';
        var fr=new FileReader();
        fr.onload=function(){
          var res=fr.result;
          var b64=res.indexOf(',')>=0?res.split(',')[1]:res;
          if(window.H2AFile)H2AFile.saveBase64File(b64,filename,mime);
        };
        fr.readAsDataURL(b);
      }).catch(function(e){console.error('blob dl',e);});
      return true;
    }
    return false;
  }
  document.addEventListener('click',function(e){
    var el=e.target;
    while(el&&el.tagName!=='A')el=el.parentElement;
    if(!el||!el.hasAttribute('download'))return;
    if(handleDownloadAnchor(el)){e.preventDefault();e.stopPropagation();}
  },true);
})();
(function(){
  var _origClick=HTMLInputElement.prototype.click;
  HTMLInputElement.prototype.click=function(){
    if(this.type==='file'){
      var prev=this.style.cssText;
      var wasHidden=(this.offsetParent===null||this.style.display==='none'||this.style.visibility==='hidden'||this.getAttribute('type')==='file'&&getComputedStyle(this).display==='none');
      if(wasHidden){
        this.style.setProperty('position','fixed','important');
        this.style.setProperty('top','0','important');
        this.style.setProperty('left','0','important');
        this.style.setProperty('width','1px','important');
        this.style.setProperty('height','1px','important');
        this.style.setProperty('opacity','0','important');
        this.style.setProperty('display','block','important');
        this.style.setProperty('visibility','visible','important');
        this.style.setProperty('z-index','-9999','important');
      }
      _origClick.call(this);
      if(wasHidden){var el=this;setTimeout(function(){el.style.cssText=prev;},500);}
    } else {
      _origClick.call(this);
    }
  };
})();
  </script>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nancy — AI Assistant</title>
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<!-- TensorFlow.js + COCO-SSD: object detection model. Ye ek CDN se load hoti hai (isliye pehli baar internet chahiye), uske baad detection browser me hi (on-device) chalta hai, bina kisi image/data ko kahin bheje. -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<!-- MoveNet pose estimation (TensorFlow.js pose-detection) — 17 body keypoints, on-device after model load -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<!-- Tesseract.js: OCR (Optical Character Recognition). Pehli baar language data download hota hai, uske baad image se text extract browser me hi (on-device) hota hai. -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- face-api.js: TinyFaceDetector + FaceLandmark68 + FaceRecognitionNet (on-device after models load). -->
<!-- FIX #1: original face-api.js@0.22.2 TFJS 1.7 par atka hai (TFJS>=2 se incompatible). @vladmandic/face-api = usi ka fork jo TFJS 2/3/4 ke saath chalta hai
     (same API, same tiny-detector/landmark/recognition weights). Fallback chain: pinned -> latest -> original. -->
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script>if(typeof faceapi==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"><\/script>');}</script>
<script>if(typeof faceapi==='undefined'){document.write('<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"><\/script>');}</script>
<!-- MediaPipe drawing/camera helpers: shared by Hands/Pose/Gesture panels. -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
<!-- MediaPipe Hands: 21-point hand landmarks (on-device after WASM/assets load). -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<!-- ONNX Runtime Web — Depth / advanced vision models (on-device after model load) -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
  :root{
    --bg:#0b0f14;
    --panel:#11161d;
    --line:#1e2733;
    --text:#dfe8ee;
    --dim:#7891a3;
    --accent:#ff7eb3;
    --accent-dim:#4a1a32;
    --user-bubble:#1c2530;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Consolas','SFMono-Regular',ui-monospace,monospace;
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* MOBILE / APK OPTIMIZATION */
  html,body{height:100%;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;}
  body{padding:min(24px,env(safe-area-inset-top)) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100dvh;max-height:100dvh;}
  header{padding:10px 12px;min-height:48px;flex-shrink:0;}
  #chat{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  form{padding-bottom:max(10px,env(safe-area-inset-bottom));flex-shrink:0;}
  input,button,#micBtn,#moreBtn{min-height:44px;}
  input{font-size:16px !important;}
  video{max-height:42vh;object-fit:cover;background:#000;}

  header{
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel);
  }
  .eye{
    width:30px;height:30px;
    border-radius:50%;
    border:2px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 12px var(--accent-dim);
  }
  .eye::after{
    content:'';
    width:9px;height:9px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
  }
  header .title{font-size:15px;letter-spacing:2px;font-weight:700;}
  header .sub{font-size:11px;color:var(--dim);letter-spacing:1px;}
  .status{margin-left:auto;font-size:10px;color:var(--accent);border:1px solid var(--accent-dim);padding:3px 8px;border-radius:3px;letter-spacing:1px;}

  #chat{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .msg{max-width:82%;padding:10px 13px;border-radius:4px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;}
  .bot{
    align-self:flex-start;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:2px solid var(--accent);
  }
  .bot .tag{color:var(--accent);font-size:10px;letter-spacing:2px;display:block;margin-bottom:4px;}
  .user{
    align-self:flex-end;
    background:var(--user-bubble);
    border:1px solid var(--line);
  }
  .user .tag{color:var(--dim);font-size:10px;letter-spacing:2px;display:block;margin-bottom:4px;text-align:right;}

  form{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 12px;
    border-radius:4px;
    font-family:inherit;
    font-size:13.5px;
    outline:none;
  }
  input:focus{border-color:var(--accent);}
  button{
    background:var(--accent);
    color:#04211c;
    border:none;
    padding:0 18px;
    border-radius:4px;
    font-weight:700;
    letter-spacing:1px;
    font-size:12px;
    cursor:pointer;
  }
  button:active{opacity:.8;}
  #micBtn{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--accent);
    width:44px;
    padding:0;
    font-size:16px;
  }
  #micBtn.listening{
    background:var(--accent);
    color:#04211c;
    animation:pulse 1s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(62,230,196,.5);}
    100%{box-shadow:0 0 0 10px rgba(62,230,196,0);}
  }
  /* ---------- Three-dot more menu ---------- */
  #moreWrap{ margin-left:auto; position:relative; }
  #moreBtn{
    background:none; border:1px solid var(--line); color:var(--accent);
    width:36px; height:36px; border-radius:4px; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; letter-spacing:0; padding:0;
  }
  #moreBtn:active{ opacity:.7; }
  #moreMenu{
    display:none; position:absolute; top:calc(100% + 6px); right:0; min-width:220px;
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,.45); z-index:70; padding:6px 0;
  }
  #moreMenu.open{ display:block; }
  #moreMenu .more-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width:100%; background:none; border:none; color:var(--text); font-family:inherit;
    font-size:12.5px; padding:11px 14px; cursor:pointer; letter-spacing:.3px; text-align:left;
  }
  #moreMenu .more-item:hover, #moreMenu .more-item:active{ background:rgba(255,126,179,.08); }
  #moreMenu .more-item .more-label{ flex:1; }
  #moreMenu .more-item .more-state{ font-size:11px; color:var(--dim); letter-spacing:1px; }
  #moreMenu .more-item.on .more-state{ color:var(--accent); }
  #moreMenu .more-item.wake-on .more-state{ color:#ffb020; }
  #moreMenu .more-item.hw-on .more-state{ color:#3ee6c4; }
  #moreMenu .more-item.auto-on .more-state{ color:#7CFC8B; }
  #moreMenu .more-item.api-on .more-state{ color:#7CFC8B; }
  #moreMenu .more-sep{ height:1px; background:var(--line); margin:4px 0; }

  /* ---------- API Key modal ---------- */
  #apiKeyOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:center; justify-content:center; z-index:80; padding:16px;
  }
  #apiKeyOverlay.open{ display:flex; }
  #apiKeyBox{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    width:100%; max-width:420px; max-height:82vh; display:flex; flex-direction:column; overflow:hidden;
  }
  #apiKeyBox .akh{ display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--line); }
  #apiKeyBox .akh h3{ margin:0; font-size:13.5px; letter-spacing:1px; color:var(--accent); }
  #apiKeyBox .akb{ padding:14px 16px; overflow-y:auto; font-size:12.5px; line-height:1.6; }
  #apiKeyBox .akb label{ display:block; color:var(--dim); font-size:11px; letter-spacing:1px; margin:10px 0 4px; }
  #apiKeyBox .akb select, #apiKeyBox .akb input, #apiKeyBox .akb textarea{
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:9px 10px; border-radius:4px; font-family:inherit; font-size:12.5px; outline:none;
  }
  #apiKeyBox .akb select:focus, #apiKeyBox .akb input:focus, #apiKeyBox .akb textarea:focus{ border-color:var(--accent); }
  #apiKeyBox .akb textarea{ min-height:64px; resize:vertical; }
  #apiKeyBox .ak-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  #apiKeyBox .ak-actions button{
    background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent-dim);
    padding:8px 12px; border-radius:4px; font-size:12px; cursor:pointer; letter-spacing:.5px;
  }
  #apiKeyBox .ak-actions button.primary{ background:var(--accent); color:#04211c; border-color:var(--accent); font-weight:700; }
  #apiKeyBox .ak-actions button.danger{ background:#3a1a1a; color:#ff8a8a; border-color:#5a2323; }
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  /* ---------- Hamburger + Sidebar ---------- */
  #hamburgerBtn{
    background:none;
    border:1px solid var(--line);
    color:var(--accent);
    width:36px;height:36px;
    border-radius:4px;
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  #hamburgerBtn:active{opacity:.7;}
  #sidebarOverlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.5);
    opacity:0; pointer-events:none;
    transition:opacity .2s;
    z-index:40;
  }
  #sidebarOverlay.open{opacity:1; pointer-events:auto;}
  #sidebar{
    position:fixed; top:0; left:0; bottom:0;
    width:270px;
    background:var(--panel);
    border-right:1px solid var(--line);
    transform:translateX(-100%);
    transition:transform .25s ease;
    z-index:50;
    display:flex; flex-direction:column;
    padding:14px 0;
  }
  #sidebar.open{transform:translateX(0);}
  #sidebar .sb-title{
    font-size:13px; letter-spacing:2px; color:var(--accent); font-weight:700;
    padding:6px 18px 14px; border-bottom:1px solid var(--line); margin-bottom:6px;
  }
  .sb-item{
    display:flex; align-items:center; gap:10px;
    padding:13px 18px;
    font-size:13px;
    color:var(--text);
    cursor:pointer;
    border-left:2px solid transparent;
  }
  .sb-item:hover, .sb-item:active{background:rgba(62,230,196,.08); border-left-color:var(--accent);}
  .sb-item .ic{width:18px; text-align:center;}

  /* ---------- Modal panel (menu content) ---------- */
  #panelOverlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center; justify-content:center;
    z-index:60;
    padding:16px;
  }
  #panelOverlay.open{display:flex;}
  #panelBox{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    width:100%; max-width:420px;
    max-height:82vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  #panelHeader{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  #panelHeader h3{margin:0; font-size:13.5px; letter-spacing:1px; color:var(--accent);}
  #panelClose{
    background:none; border:1px solid var(--line); color:var(--dim);
    width:28px; height:28px; border-radius:4px; cursor:pointer; padding:0; font-size:14px;
  }
  #panelBody{padding:14px 16px; overflow-y:auto; font-size:12.5px; line-height:1.6;}
  #panelBody .row{display:flex; gap:8px; margin-bottom:10px;}
  #panelBody button.act{
    background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent-dim);
    padding:8px 12px; border-radius:4px; font-size:12px; cursor:pointer; letter-spacing:.5px;
  }
  #panelBody button.act.stop{background:#3a1a1a; color:#ff8a8a; border-color:#5a2323;}
  #panelBody input.mini{
    flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text);
    padding:8px 10px; border-radius:4px; font-family:inherit; font-size:12.5px; outline:none;
  }
  .status-line{color:var(--dim); font-size:11.5px; margin-top:4px;}
  .status-line.ok{color:var(--accent);}
  table.sdata{width:100%; border-collapse:collapse; font-size:11.5px; margin-top:6px;}
  table.sdata th, table.sdata td{border-bottom:1px solid var(--line); padding:6px 4px; text-align:left;}
  table.sdata th{color:var(--dim); font-weight:600;}
  .tag-normal{color:var(--accent);}
  .tag-abnormal{color:#ff8a8a; font-weight:700;}
  .chatlog-line{border-bottom:1px solid var(--line); padding:7px 2px;}
  .chatlog-line .who{color:var(--accent); font-size:10px; letter-spacing:1px;}
  .chatlog-line .who.u{color:var(--dim);}
  .chatlog-time{color:var(--dim); font-size:10px;}

  /* ---------- Alert banner ---------- */
  #alertBanner{
    display:none;
    background:#3a1a1a;
    color:#ff8a8a;
    border-bottom:1px solid #5a2323;
    padding:8px 14px;
    font-size:12px;
    letter-spacing:.5px;
    align-items:center;
    gap:8px;
  }
  #alertBanner.show{display:flex;}

  /* ---------- LCD Display (controller se aaya "print" data) ---------- */
  .lcd-screen{

  #visionWrap{position:relative; width:100%; border-radius:6px; overflow:hidden; background:#000; border:1px solid var(--line);}

  @keyframes loaderSpin{ to{ transform:rotate(360deg); } }
  @keyframes loaderPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
  .loader-title{ font-size:13px; letter-spacing:4px; color:var(--dim); margin-bottom:4px; text-transform:uppercase; }

  .loader-bar-fill{

  .loader-pct{ font-size:12px; color:var(--dim); letter-spacing:1px; margin-bottom:18px; }
  .loader-checklist{

</style>

<script>
/* ---------------------------------------------------
   NANCY — AI assistant + vision AI.
   No API calls, no internet, no external requests.
   Everything runs locally within this browser.
--------------------------------------------------- */

const chat = document.getElementById('chat');
const form = document.getElementById('chatForm');
const input = document.getElementById('userInput');
const micBtn = document.getElementById('micBtn');
const voiceToggle = document.getElementById('voiceToggle');

const userName = { value: null };
const voiceState = { enabled: true };

/* ===================================================================
   ADVANCED CAMERA ENGINE (high-res, mirror mode, robust fallbacks)
   - Front camera (user) always opens in true mirror mode
   - High resolution preferred (1280x720 / 1920x1080)
   - Multiple constraint fallbacks for Android WebView / H2APK
   - Auto apply .cam-mirror CSS so preview looks exactly like a mirror
=================================================================== */
// FIX: MediaPipe 'Camera' util apna alag getUserMedia() kholta hai (default = FRONT camera) aur
// hamari BACK-camera stream ko replace kar deta tha. Isliye ab uska use band; frames seedha
// CamEngine ki back-camera stream se bhejte hain.
const USE_MP_CAMERA_UTIL = false;

const CamEngine = {
  // BACK camera default (blind-user: point phone at world / text)
  highResUser: {
    video: {
      facingMode: { ideal: 'user' },
      width: { ideal: 1280, min: 640 },
      height: { ideal: 720, min: 480 },
      frameRate: { ideal: 30, min: 15 }
    },
    audio: false
  },
  highResEnv: {
    video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1280, min: 640 },
      height: { ideal: 720, min: 480 },
      frameRate: { ideal: 24, min: 12 }
    },
    audio: false
  },
  // Try to find the real back/front camera by device label. Many Android
  // WebViews (H2APK-style wrappers) silently ignore the facingMode constraint
  // and just hand back whatever camera the OS picks (often the front one) —
  // selecting by deviceId is far more reliable than facingMode alone there.
  async _findDeviceId(wantBack){
    try{
      if(!navigator.mediaDevices.enumerateDevices) return null;
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === 'videoinput');
      if(!cams.length) return null;
      const backRe = /back|rear|environment|world/i;
      const frontRe = /front|user|face|selfie/i;
      let match = cams.find(d => wantBack ? backRe.test(d.label) : frontRe.test(d.label));
      if(match) return match.deviceId;
      // Labels empty (no permission granted yet) → can't tell by name.
      // Heuristic fallback: on most phones cams[0] is the main back camera.
      if(cams.length > 1 && !cams.some(d => d.label)){
        return wantBack ? cams[0].deviceId : cams[cams.length - 1].deviceId;
      }
      return null;
    }catch(e){ return null; }
  },
  // preferFront=false → BACK camera (default for all panels)
  // Public entry — ab har panel ko CameraManager se stream milti hai (ek hi hardware camera).
  getStream(preferFront = false){ return CameraManager.getStream(preferFront); },
  // RAW hardware open — sirf CameraManager call karta hai, panels kabhi nahi.
  async _acquireRaw(preferFront = false){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error('getUserMedia not available — use HTTPS or H2APK with Camera permission');
    }
    const wantBack = !preferFront;
    const deviceId = await this._findDeviceId(wantBack);
    const deviceTries = deviceId ? [
      { video: { deviceId: { exact: deviceId }, width: { ideal: 1280, min: 640 }, height: { ideal: 720, min: 480 } }, audio: false },
      { video: { deviceId: { exact: deviceId } }, audio: false }
    ] : [];
    const backFirst = [
      this.highResEnv,
      { video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: { facingMode: { ideal: 'environment' } }, audio: false },
      { video: { facingMode: 'environment' }, audio: false },
      { video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: true, audio: false }
    ];
    const frontFirst = [
      this.highResUser,
      { video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: { facingMode: 'user' }, audio: false },
      { video: true, audio: false }
    ];
    // deviceId-based attempts go FIRST (most reliable in APK WebViews),
    // then fall back to the facingMode constraint chain as before.
    const tries = deviceTries.concat(preferFront ? frontFirst : backFirst);
    // A just-stopped camera (e.g. switching from another panel) doesn't always
    // release the hardware instantly in Android WebView/H2APK — getUserMedia
    // can fail with NotReadableError/TrackStartError for a brief moment after
    // track.stop(). Retry the whole constraint chain a couple of times with
    // a short backoff before giving up, instead of failing immediately.
    const BUSY_ERRORS = ['NotReadableError', 'TrackStartError', 'AbortError'];
    let lastErr = null;
    for(let attempt = 0; attempt < 3; attempt++){
      if(attempt > 0) await new Promise(r => setTimeout(r, 300 * attempt));
      for(const c of tries){
        try{
          const stream = await navigator.mediaDevices.getUserMedia(c);
          // Sanity check: if we explicitly wanted the back camera but the
          // stream we got is actually labeled as front-facing, keep trying.
          try{
            const track = stream.getVideoTracks()[0];
            const settings = track && track.getSettings ? track.getSettings() : {};
            const label = (track && track.label) || '';
            if(wantBack && (settings.facingMode === 'user' || /front|user|face|selfie/i.test(label))){
              const otherId = await this._findDeviceId(true);
              if(otherId && otherId !== (settings.deviceId || '')){
                track.stop();
                continue;
              }
            }
          }catch(e){}
          return stream;
        }catch(e){ lastErr = e; console.warn('Cam try fail', e && e.name, e && e.message); }
      }
      if(!lastErr || !BUSY_ERRORS.includes(lastErr.name)) break; // non-busy error: no point retrying
    }
    throw lastErr || new Error('Camera permission denied or no camera found');
  },
  // Apply true mirror look to front-camera video + its overlay canvas
  applyMirror(videoEl, canvasEl){
    if(!videoEl) return;
    videoEl.classList.add('cam-mirror');
    if(canvasEl) canvasEl.classList.add('cam-mirror');
    // also mark parent wrap if present
    const wrap = videoEl.parentElement;
    if(wrap) wrap.classList.add('cam-wrap-mirror');
  },
  removeMirror(videoEl, canvasEl){
    if(videoEl) videoEl.classList.remove('cam-mirror');
    if(canvasEl) canvasEl.classList.remove('cam-mirror');
    const wrap = videoEl && videoEl.parentElement;
    if(wrap) wrap.classList.remove('cam-wrap-mirror');
  },
  // Flip bbox X for mirrored drawing (so boxes stay aligned with mirrored preview)
  flipBBox(bbox, videoWidth){
    const [x,y,w,h] = bbox;
    return [videoWidth - x - w, y, w, h];
  },
  // Robust attach for H2APK / Android WebView: attributes MUST be set before srcObject
  // and play() must be called after. Always use for every panel.
  async attachStream(videoEl, stream, isFront = false){
    if(!videoEl || !stream) return;
    try{
      videoEl.setAttribute('playsinline', '');
      videoEl.setAttribute('webkit-playsinline', '');
      videoEl.setAttribute('autoplay', '');
      videoEl.muted = true;
      videoEl.playsInline = true;
      // clear previous
      if(videoEl.srcObject){
        try{ videoEl.srcObject.getTracks().forEach(t => t.stop()); }catch(e){}
      }
      videoEl.srcObject = stream;
      if(isFront){
        this.applyMirror(videoEl);
      } else {
        this.removeMirror(videoEl);
      }
      try {
        await videoEl.play();
      } catch(pe){
        console.warn('CamEngine.attachStream play()', pe);
        // some WebViews need a tiny delay + second try
        await new Promise(r => setTimeout(r, 120));
        try{ await videoEl.play(); }catch(e2){ console.warn('CamEngine play retry', e2); }
      }
    }catch(e){
      console.error('CamEngine.attachStream', e);
      throw e;
    }
  }
};

/* ===================================================================
   STEP 1 — CAMERA MANAGER (ek hi camera owner) + FRAME OPTIMIZER
   Problem: har panel apna getUserMedia() kholta/band karta tha → panel/mode
   badalte hi camera restart, "camera already in use", black screen.
   Ab: hardware camera EK baar khulta hai (master stream). Har panel ko master
   ke track ka clone() milta hai — clone.stop() sirf us panel ka handle band
   karta hai, camera chalu rehta hai. Mode/panel badalne par camera restart nahi.
   Koi panel code badalna nahi pada: panels ab bhi CamEngine.getStream() aur
   track.stop() hi use karte hain.
   Camera tabhi band hota hai jab (a) koi panel use nahi kar raha aur
   idleReleaseMs guzar gaya (battery/privacy), ya (b) app background me gaya.
   idleReleaseMs = 0 → kabhi auto-band nahi (always-on).
=================================================================== */
const CameraManager = {
  idleReleaseMs: 45000,
  master: null,          // { stream, facing, track }
  pinned: false,         // true = start() ne always-on kiya
  stats: { opens: 0, reuses: 0 },
  _pending: null, _clones: 0, _idleTimer: null,

  _alive(){
    const m = this.master;
    if(!m) return false;
    const t = m.stream.getVideoTracks()[0];
    return !!t && t.readyState === 'live';
  },
  _dropMaster(){
    const m = this.master; this.master = null;
    if(m){ try{ m.stream.getTracks().forEach(t => t.stop()); }catch(e){} }
  },
  async _open(preferFront, facing){
    this._dropMaster(); // purana (dusri facing / mara hua) master band; uske clones chalte rehte hain
    const stream = await CamEngine._acquireRaw(preferFront);
    const track = stream.getVideoTracks()[0];
    this.master = { stream, facing, track };
    this.stats.opens++;
    if(track) track.addEventListener('ended', () => { if(this.master && this.master.track === track) this.master = null; });
  },
  _makeClone(){
    const m = this.master;
    let tracks = null;
    try{ tracks = m.stream.getTracks().map(t => t.clone()); }catch(e){ tracks = null; }
    if(!tracks || !tracks.length) return m.stream; // clone() unsupported — shared stream (stop() master ko maar dega, agla getStream reopen karega)
    tracks.forEach(t => {
      this._clones++;
      const origStop = t.stop.bind(t);
      let done = false;
      const release = () => { if(done) return; done = true; this._onCloneStopped(); };
      t.stop = () => { try{ origStop(); }catch(e){} release(); };
      t.addEventListener('ended', release);
    });
    return new MediaStream(tracks);
  },
  _onCloneStopped(){
    this._clones = Math.max(0, this._clones - 1);
    if(this._clones === 0) this._scheduleIdle();
  },
  _cancelIdle(){ clearTimeout(this._idleTimer); this._idleTimer = null; },
  _scheduleIdle(){
    this._cancelIdle();
    if(this.pinned || !(this.idleReleaseMs > 0)) return;
    this._idleTimer = setTimeout(() => { if(this._clones === 0) this.releaseNow(); }, this.idleReleaseMs);
  },

  // CamEngine.getStream() yahin aata hai. preferFront=false → BACK camera.
  async getStream(preferFront = false){
    const facing = preferFront ? 'front' : 'back';
    this._cancelIdle();
    for(let i = 0; i < 5; i++){
      if(this._pending){ try{ await this._pending; }catch(e){} }
      if(this._alive() && this.master.facing === facing){ this.stats.reuses++; return this._makeClone(); }
      if(this._pending) continue;
      this._pending = this._open(preferFront, facing);
      try{ await this._pending; } finally { this._pending = null; }
      if(this._alive() && this.master.facing === facing) return this._makeClone();
    }
    throw new Error('Camera start nahi ho paya');
  },
  // Camera ko warm + always-on rakhna (optional): app start par ek baar.
  async start(preferFront = false){
    this.pinned = true;
    const s = await this.getStream(preferFront);
    s.getTracks().forEach(t => t.stop()); // sirf warm-up handle band; master pinned hai
  },
  stop(){ this.pinned = false; this._cancelIdle(); this.releaseNow(); },
  releaseNow(){
    this._cancelIdle();
    this._dropMaster();
  },
  info(){ return { open: this._alive(), facing: this.master && this.master.facing, handles: this._clones, pinned: this.pinned, opens: this.stats.opens, reuses: this.stats.reuses }; }
};
// App background → privacy: hardware camera turant band (foreground par panel khud reopen karta hai)
document.addEventListener('visibilitychange', () => { if(document.hidden) CameraManager.releaseNow(); });

// AI ko full-res frame nahi chahiye: preview HD rehta hai, AI ke liye 640px wala alag frame.
// Self-test: agar kisi WebView me off-screen canvas blank nikla to khud band ho kar seedha video par laut aata hai.
const FrameOptimizer = {
  enabled: true, grayOk: true, maxW: 720, _n: 0, _filter: 'none', // FIX: default 640 -> 720
  _c: null, _ctx: null, _gc: null, _gctx: null, _tests: 0, _fails: 0, _gfails: 0,
  _hide(cv){
    cv.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;pointer-events:none;';
    (document.body || document.documentElement).appendChild(cv);
  },
  // → { src, sx, sy }  (src par detect karo, bbox × sx/sy = video coordinates)
  frame(video){
    const vw = video.videoWidth, vh = video.videoHeight;
    const raw = { src: video, sx: 1, sy: 1 };
    if(!this.enabled || !vw || !vh || vw <= this.maxW) return raw;
    const w = this.maxW, h = Math.round(vh * w / vw);
    try{
      if(!this._c){ this._c = document.createElement('canvas'); this._ctx = this._c.getContext('2d'); this._hide(this._c); }
      if(this._c.width !== w || this._c.height !== h){ this._c.width = w; this._c.height = h; }
      this._ctx.imageSmoothingQuality = 'high';
      // Low-light (offline detector ke liye): har 8 frame par brightness napo, andhera ho to model ko brighter frame do.
      if((this._n++ & 7) === 0){
        const sig = (typeof frameSignature === 'function') ? frameSignature(video) : null;
        if(sig){
          let m = 0; for(let i = 0; i < sig.length; i++) m += sig[i];
          m /= sig.length;
          this._filter = m < 85 ? ('brightness(' + Math.min(1.9, Math.max(1.2, 110 / Math.max(m, 30))).toFixed(2) + ') contrast(1.12)') : 'none';
        }
      }
      if('filter' in this._ctx) this._ctx.filter = this._filter;
      this._ctx.drawImage(video, 0, 0, w, h);
      if(this._tests < 3){
        const px = this._ctx.getImageData((w >> 1) - 4, (h >> 1) - 4, 8, 8).data;
        let opaque = false;
        for(let i = 3; i < px.length; i += 4){ if(px[i]){ opaque = true; break; } }
        if(!opaque){ if(++this._fails >= 2){ this.enabled = false; console.warn('FrameOptimizer: canvas blank — full video par fallback'); } return raw; }
        this._tests++;
      }
      return { src: this._c, sx: vw / w, sy: vh / h };
    }catch(e){ this.enabled = false; console.warn('FrameOptimizer off', e); return raw; }
  },
  // Device fast hai to zyada resolution (better small-object accuracy), slow hai to kam (smooth FPS).
  adapt(ms){
    if(!ms) return;
    if(ms < 110 && this.maxW < 896) this.maxW = 896;        // FIX: fast phone par 896px tak
    else if(ms > 330 && this.maxW > 512) this.maxW = 512;
    else if(ms > 150 && ms < 260 && this.maxW !== 720) this.maxW = 720;
  },
  // Chhota grayscale frame (tracker ke liye). null = nahi mila.
  gray(video, W){
    const vw = video.videoWidth, vh = video.videoHeight;
    if(!vw || !vh || !this.grayOk) return null;
    const w = W || 96, h = Math.max(8, Math.round(vh * w / vw));
    try{
      if(!this._gc){ this._gc = document.createElement('canvas'); this._gctx = this._gc.getContext('2d', { willReadFrequently: true }); this._hide(this._gc); }
      if(this._gc.width !== w || this._gc.height !== h){ this._gc.width = w; this._gc.height = h; }
      this._gctx.drawImage(video, 0, 0, w, h);
      const px = this._gctx.getImageData(0, 0, w, h).data;
      const g = new Uint8Array(w * h);
      let opaque = false;
      for(let i = 0, j = 0; i < g.length; i++, j += 4){
        g[i] = (px[j] * 77 + px[j + 1] * 150 + px[j + 2] * 29) >> 8;
        if(px[j + 3]) opaque = true;
      }
      if(!opaque){ if(++this._gfails >= 3) this.grayOk = false; return null; }
      this._gfails = 0;
      return { g, w, h };
    }catch(e){ if(++this._gfails >= 3) this.grayOk = false; return null; }
  }
};

// ---------- MEMORY MANAGER (long-term, persists across browser sessions) ----------
const MemoryManager = {
  KEY: 'nancy_memory_v1',
  data: {
    userName: null,
    favouriteLanguage: null,
    facts: {},
    learnedCommands: {},   // { trigger: { reply } } — user-taught "jab main bolu X toh Y" commands
    knownFaces: [],        // lightweight mirror: [{name, enrolledAt}] — actual 128-d descriptors live in vision_known_faces
    devices: [],           // [{type, label, firstConnected, lastConnected}] — ESP32/Bluetooth/WiFi/Serial devices ever seen
    history: []
  },
  load(){
    try{
      const raw = localStorage.getItem(this.KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        this.data = Object.assign({}, this.data, parsed);
      }
    }catch(e){ console.warn('Memory load failed', e); }
    if(this.data.userName) userName.value = this.data.userName;
  },
  save(){
    try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }
    catch(e){ console.warn('Memory save failed', e); }
  },
  setName(name){ this.data.userName = name; userName.value = name; this.save(); },
  setFavouriteLanguage(lang){ this.data.favouriteLanguage = lang; this.save(); },
  getFavouriteLanguage(){ return this.data.favouriteLanguage; },
  remember(key, value){ this.data.facts[key.toLowerCase()] = value; this.save(); },
  recall(key){ return this.data.facts[key.toLowerCase()]; },
  forget(key){ delete this.data.facts[key.toLowerCase()]; this.save(); },
  addHistory(who, text){
    this.data.history.push({ t: Date.now(), who, text });
    if(this.data.history.length > 200) this.data.history.shift(); // cap so localStorage doesn't bloat
    this.save();
  },
  recentHistory(n){ return this.data.history.slice(-n); },
  learnCommand(trigger, reply){ this.data.learnedCommands[trigger.toLowerCase()] = { reply }; this.save(); },
  getLearnedCommand(trigger){ return this.data.learnedCommands[trigger.toLowerCase()]; },
  forgetCommand(trigger){ delete this.data.learnedCommands[trigger.toLowerCase()]; this.save(); },
  // ---- Known faces: keeps only {name, enrolledAt} here for fast recall/listing.
  // The actual face descriptors stay in the dedicated `knownFaces` global /
  // 'vision_known_faces' store (see Phase 2 face recognition code) since they're
  // large numeric arrays, not the kind of thing you'd want in a chat-memory blob.
  syncKnownFaceNames(names){
    const now = Date.now();
    const existingByName = {};
    this.data.knownFaces.forEach(f => existingByName[f.name.toLowerCase()] = f);
    this.data.knownFaces = names.map(name => {
      const prev = existingByName[name.toLowerCase()];
      return prev ? prev : { name, enrolledAt: now };
    });
    this.save();
  },
  knownFaceNames(){ return this.data.knownFaces.map(f => f.name); },
  // ---- Devices ever connected (Bluetooth / WiFi / Serial) ----
  rememberDevice(type, label){
    const now = Date.now();
    const existing = this.data.devices.find(d => d.type === type && d.label === label);
    if(existing){ existing.lastConnected = now; }
    else { this.data.devices.push({ type, label, firstConnected: now, lastConnected: now }); }
    if(this.data.devices.length > 30) this.data.devices.shift();
    this.save();
  },
  deviceList(){ return this.data.devices; }
};
MemoryManager.load();

  // Longer/more specific keyword matches win over shorter ones (e.g. "ohms law"
  // over a generic "law"). Word-ish boundaries avoid matching a short topic like
  // "api" or "led" inside an unrelated longer word.
  search(query){
    const q = query.toLowerCase();
    let best = null;
    const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    for(const category in this.data){
      const topics = this.data[category];
      for(const topic in topics){
        const entry = topics[topic];
        const keys = [topic, ...(entry.aliases || [])];
        for(const key of keys){
          const re = new RegExp('(?:^|[^a-z0-9])' + escapeRe(key) + '(?:$|[^a-z0-9])', 'i');
          if(re.test(' ' + q + ' ')){
            if(!best || key.length > best.key.length){
              best = { category, topic, answer: entry.answer, key };
            }
          }
        }
      }
    }
    return best;
  },
  listCategories(){ return Object.keys(this.data); },
  listTopics(category){ return this.data[category] ? Object.keys(this.data[category]) : []; },
  matchCategory(query){
    const q = query.toLowerCase();
    return this.listCategories().find(c => q.includes(c)) || null;
  }
};

    { type:'language_set', test:/(?:meri|mera)\s+favou?rite\s+language\s+(.+?)\s+hai|i\s+like\s+(.+?)\s+language|mujhe\s+(.+?)\s+language\s+pasand\s+hai/i, weight:4 },
    { type:'language_ask', test:/meri\s+favou?rite\s+language\s+(kya|kya hai)|which\s+language\s+do\s+i\s+like|mujhe\s+kaunsi\s+language\s+pasand/i, weight:4 },
    { type:'teach_command', test:/jab\s+main\s+bolu[nṇ]?\s+['"]?(.+?)['"]?\s+toh?\s+bolna\s+['"]?(.+?)['"]?$|agar\s+main\s+kahu\s+['"]?(.+?)['"]?\s+toh\s+['"]?(.+?)['"]?\s+bolna/i, weight:6 },
    { type:'recall_conversation', test:/(?:hum|humne|pichli baar)\s+kya\s+baat\s+(?:ki|kar rahe)\s+the|last conversation|pichli chat (?:kya thi|yaad hai)|humari baat yaad hai/i, weight:4 },
    { type:'recall_faces', test:/kaun[- ]?kaun\s+(?:se\s+)?log\s+yaad\s+hai|kitne\s+chehre\s+yaad|known faces (?:kaun|kya)|kise\s+pehchanti\s+ho/i, weight:4 },
    { type:'recall_devices', test:/kaun\s?(?:se|sa)\s+device\s+(?:jode|connect)|which devices|device list dikhao|kitne\s+devices\s+yaad/i, weight:4 },
    { type:'vision_object', test:/kya dikh raha hai|saamne kya hai|kya dekh rahi ho|what do you see|kya nazar aa raha/i, weight:4 },
    { type:'vision_distance', test:/kitni door hai|how far|distance kitni|kitna paas hai/i, weight:4 },
    { type:'vision_ocr', test:/kya likha hai|text kya hai|ocr (?:se )?padho|likha hua kya/i, weight:4 },
    { type:'vision_face', test:/kaun hai (?:saamne|ye)|who is (?:this|that)|pehchano|chehra pehchan/i, weight:4 },
    { type:'vision_gesture', test:/kaunsa gesture|gesture kya (?:kiya|hua)|kya ishara|which gesture/i, weight:4 },
    { type:'vision_pose', test:/(mera |meri )?pose kya|body pose kya|posture kya|kya kar raha hoon (?:main )?dikh/i, weight:4 },
    { type:'sensor_status', test:/sensor(?:s)? (?:kaise|kaisa|status)|sab (?:sensor |)normal hai|sab thik hai kya sensor|health monitoring kaisa/i, weight:4 },
    { type:'sensor_specific', test:/gas (?:level|kitna|kaisa)|heart rate kitni|dhadkan kitni|body temp kitna|temperature kitn|bukhar (?:hai|kitna)|ecg kaisa|ultrasonic sensor|sensor se distance/i, weight:4 },
    { type:'tinyml_query', test:/tinyml ne kya|tinyml prediction|board ne kya predict|model ne kya bola/i, weight:4 },
    { type:'reasoning_room_safety', test:/room safe|yaha safe|yahan safe|safety check|kya yaha khatra|kamra safe/i, weight:5 },
    { type:'reasoning_health', test:/meri health (?:thik|sahi)|health check karo|sab thik hai (?:mera|meri) body|body thik hai kya/i, weight:5 },
    { type:'planning_pickup', test:/(.+?)\s*(uthao|utha do|pick\s*up|le aao|le lo)\b/i, weight:5 },
    { type:'planning_approach', test:/(.+?)\s*(ke paas jao|ke paas chalo|move near|near jao)\b/i, weight:5 },
    { type:'personality', test:/./, weight:1 } // fallback catch-all, lowest priority
  ],
  detect(msg){
    let best = { type:'personality', weight:0, match:null };
    for(const p of this.patterns){
      const m = msg.match(p.test);
      if(m && p.weight > best.weight){
        best = { type:p.type, weight:p.weight, match:m };
      }
    }
    return best;
  }
};

// ---------- RESPONSE GENERATOR / REASONING (ties Memory + Knowledge + Intent together) ----------
// ---------- VISION → AI BRAIN BRIDGE (Phase 2) ----------
// Reads live globals already populated by the vision panels (object detection,
// face recognition, gesture, pose, OCR) so the chat can answer questions about
// what the camera currently sees, without duplicating each panel's own state.
let lastRecognizedFaces = []; // [{name, dist}] — populated by the face-recognition loop

// Rough average real-world heights (meters), used for a simple monocular distance estimate.
// This is a heuristic (distance ≈ real_height × assumed_focal / pixel_height), not a calibrated measurement.
const OBJECT_REAL_HEIGHT_M = {
  person:1.6, chair:0.9, bottle:0.24, cup:0.1, book:0.22,
  'cell phone':0.15, laptop:0.25, dog:0.5, cat:0.3, car:1.5,
  bicycle:1.0, motorcycle:1.1, backpack:0.45, umbrella:0.85,
  handbag:0.3, banana:0.18, apple:0.08, 'dining table':0.75,
  clock:0.3, tv:0.5, bed:0.5, couch:0.8, 'potted plant':0.4,
  refrigerator:1.7, scissors:0.15, 'teddy bear':0.3,
  'wine glass':0.2, bowl:0.08, vase:0.3, 'sports ball':0.22
};
const ASSUMED_FOCAL_PX = 700; // uncalibrated default webcam focal length — good enough for "roughly how far"

function estimateDistanceMeters(cls, bboxHeightPx){
  const realHeight = OBJECT_REAL_HEIGHT_M[cls];
  if(!realHeight || !bboxHeightPx) return null;
  return Math.round(((realHeight * ASSUMED_FOCAL_PX) / bboxHeightPx) * 10) / 10;
}

const PerceptionState = {
  objectsSummary(){
    if(typeof lastDetections === 'undefined' || !lastDetections || !lastDetections.length) return null;
    return lastDetections.map(d => ({
      name: hindiObjName(d.class),
      cls: d.class,
      score: d.score,
      dist: estimateDistanceMeters(d.class, d.bbox[3])
    }));
  },
  nearestObject(){
    const objs = this.objectsSummary();
    if(!objs) return null;
    const withDist = objs.filter(o => o.dist != null);
    return withDist.length ? withDist.sort((a,b) => a.dist - b.dist)[0] : objs[0];
  },
  facesSummary(){
    return lastRecognizedFaces.length ? lastRecognizedFaces : null;
  },
  lastGesture(){
    return (typeof lastGestureLabel !== 'undefined' && lastGestureLabel)
      ? { label:lastGestureLabel, score:lastGestureScore } : null;
  },
  poseSummary(){
    if(typeof lastHPPoses === 'undefined' || !lastHPPoses || !lastHPPoses.length) return null;
    return lastHPPoses.map(pose => {
      const kps = {};
      (pose.keypoints||[]).forEach(k => { kps[k.name] = k; });
      const ls = kps['left_shoulder'], rs = kps['right_shoulder'];
      const lw = kps['left_wrist'], rw = kps['right_wrist'];
      const leftUp = ls && lw && (lw.score||0) > 0.3 && lw.y < ls.y;
      const rightUp = rs && rw && (rw.score||0) > 0.3 && rw.y < rs.y;
      if(leftUp && rightUp) return 'dono haath upar uthaye hue';
      if(leftUp || rightUp) return 'ek haath upar uthaya hua';
      return 'normal khada/baitha hua posture';
    });
  },
  lastOcrText(){
    return (typeof lastOcrResult !== 'undefined' && lastOcrResult && lastOcrResult.text) ? lastOcrResult.text : null;
  }
};

// ---------- SENSOR MANAGER → AI BRAIN BRIDGE (Phase 3) ----------
// Reads the live `sensors` object (already fed by Bluetooth/WiFi/Serial ESP32 data
// in applyLiveSensorData / startSensorSimulation) and turns raw numbers into
// spoken-language interpretation, instead of the AI just reading values back.
const SensorAnalyzer = {
  interpret(key){
    const s = sensors[key];
    if(!s) return { status:'unknown', text:'Ye sensor mujhe pata nahi.' };
    if(s.value === null || s.value === undefined){
      return { status:'unknown', text:`${s.label} ki reading nahi aa rahi — sensor connect nahi hai.` };
    }
    if(s.min === undefined){ // e.g. ultrasonic has no "abnormal" range, just a raw distance
      return { status:'info', text:`${s.label} abhi ${s.value}${s.unit} dikha raha hai.` };
    }
    if(s.value < s.min){
      return { status:'low', text:`${s.label} normal se kam hai — ${s.value}${s.unit} (normal range ${s.min}-${s.max}${s.unit}).` };
    }
    if(s.value > s.max){
      return { status:'high', text:`${s.label} normal se zyada hai — ${s.value}${s.unit} (normal range ${s.min}-${s.max}${s.unit}).` };
    }
    return { status:'normal', text:`${s.label} normal hai — ${s.value}${s.unit}.` };
  },
  fullReport(){
    if(!isSensorConnected()){
      return { connected:false, text:'Koi sensor/ESP32 connect nahi hai abhi. ☰ → Hardware Hub se Bluetooth, WiFi ya USB se jodo pehle.' };
    }
    const parts = Object.keys(sensors).map(key => ({ key, ...this.interpret(key) }));
    const abnormal = parts.filter(p => p.status === 'high' || p.status === 'low');
    return { connected:true, parts, abnormal, allNormal: abnormal.length === 0 };
  },
  sensorKeyFromText(msg){
    if(/gas/i.test(msg)) return 'gas';
    if(/heart rate|dhadkan/i.test(msg)) return 'heartRate';
    if(/body temp|temperature|bukhar/i.test(msg)) return 'temperature';
    if(/ecg/i.test(msg)) return 'ecg';
    if(/ultrasonic|sensor se distance/i.test(msg)) return 'ultrasonic';
    return null;
  }
};

// ---------- REASONING ENGINE (Phase 4) ----------
// Combines Sensor Manager (Phase 3) + Vision (Phase 2) into a step-by-step
// decision, instead of answering from a single reading. Mirrors the roadmap
// example: "Room safe hai?" → gas check → temperature check → distance check
// → camera check → final decision.
const ReasoningEngine = {
  checkGas(){
    const s = sensors.gas;
    if(s.value == null) return { status:'unknown', text:'Gas sensor: connected nahi hai.' };
    if(s.value > s.max) return { status:'unsafe', text:`Gas sensor: level zyada hai (${s.value}${s.unit}) — hawa mein gas ho sakti hai ⚠️` };
    return { status:'safe', text:`Gas sensor: normal hai (${s.value}${s.unit}) ✅` };
  },
  checkTemperature(){
    const s = sensors.temperature;
    if(s.value == null) return { status:'unknown', text:'Temperature sensor: connected nahi hai.' };
    if(s.value > s.max) return { status:'unsafe', text:`Temperature: zyada hai (${s.value}${s.unit}) — garmi ya aag ka risk ho sakta hai ⚠️` };
    if(s.value < s.min) return { status:'unsafe', text:`Temperature: bahut kam hai (${s.value}${s.unit}) ⚠️` };
    return { status:'safe', text:`Temperature: normal hai (${s.value}${s.unit}) ✅` };
  },
  checkDistance(){
    const s = sensors.ultrasonic;
    if(s.value == null) return { status:'unknown', text:'Distance sensor: connected nahi hai.' };
    if(s.value < 10) return { status:'unsafe', text:`Distance sensor: kuch bahut paas hai (${s.value}cm) — obstruction ho sakta hai ⚠️` };
    return { status:'safe', text:`Distance sensor: clear hai (${s.value}cm) ✅` };
  },
  checkCamera(){
    const objs = PerceptionState.objectsSummary();
    if(!objs) return { status:'unknown', text:'Camera: on nahi hai, scene check nahi ho paayi.' };
    return { status:'safe', text:`Camera: scene check ho gayi — ${objs.length} object(s) dikh rahe hain, kuch abnormal nahi laga ✅` };
  },
  assessRoomSafety(){
    const checks = [
      { name:'Gas', result:this.checkGas() },
      { name:'Temperature', result:this.checkTemperature() },
      { name:'Distance', result:this.checkDistance() },
      { name:'Camera', result:this.checkCamera() }
    ];
    const unsafe = checks.filter(c => c.result.status === 'unsafe');
    const unknown = checks.filter(c => c.result.status === 'unknown');
    let verdict;
    if(unsafe.length){
      verdict = `⚠️ Room abhi fully safe nahi lag raha.`;
    } else if(unknown.length === checks.length){
      verdict = "Koi sensor ya camera connect nahi hai, isliye main confidently keh nahi sakti — pehle Hardware Hub aur camera on karo.";
    } else if(unknown.length){
      verdict = "✅ Jo bhi sensors/camera connect hain unke hisaab se room safe lag raha hai (kuch sensors abhi connect nahi the, unka pata nahi).";
    } else {
      verdict = "✅ Sab kuch check kar liya — room safe hai.";
    }
    return { checks, verdict };
  },
  assessHealthStatus(){
    const parts = [
      { name:'Heart Rate', result:SensorAnalyzer.interpret('heartRate') },
      { name:'ECG', result:SensorAnalyzer.interpret('ecg') },
      { name:'Temperature', result:SensorAnalyzer.interpret('temperature') }
    ];
    const abnormal = parts.filter(p => p.result.status === 'high' || p.result.status === 'low');
    const unknown = parts.filter(p => p.result.status === 'unknown');
    let verdict;
    if(abnormal.length){
      verdict = "Thoda check karne wali baat hai — kuch readings normal range se bahar hain.";
    } else if(unknown.length === parts.length){
      verdict = "Koi health sensor connect nahi hai abhi, isliye keh nahi sakti — Hardware Hub se jodo pehle.";
    } else {
      verdict = "Health readings normal lag rahi hain 🥰";
    }
    return { parts, verdict };
  }
};

// ---------- HARDWARE COMMANDER (outbound: browser → ESP32) ----------
// Bluetooth/WiFi/Serial so far only received sensor data FROM the board.
// This sends a JSON command TO whichever connection is currently active —
// same transport, opposite direction.
const HardwareCommander = {
  send(commandObj){
    const json = JSON.stringify(commandObj);
    try{
      if(bleCharacteristic){
        bleCharacteristic.writeValue(new TextEncoder().encode(json)).catch(()=>{});
        return true;
      }
      if(wifiSockets.wifiEsp32 && wifiSockets.wifiEsp32.readyState === WebSocket.OPEN){
        wifiSockets.wifiEsp32.send(json);
        return true;
      }
      if(wifiSockets.wifiNodemcu && wifiSockets.wifiNodemcu.readyState === WebSocket.OPEN){
        wifiSockets.wifiNodemcu.send(json);
        return true;
      }
      if(serialPort && serialPort.writable){
        const writer = serialPort.writable.getWriter();
        writer.write(new TextEncoder().encode(json + '\n')).finally(() => { try{ writer.releaseLock(); }catch(e){} });
        return true;
      }
    }catch(e){ console.warn('HardwareCommander send failed', e); }
    return false;
  },
  // Sends the command, then follows up in chat once the connection state settles —
  // there's no dedicated ack protocol on the board yet, so "confirm" here means
  // "the link the command went out on is still alive", not a robotic success signal.
  sendAndConfirm(commandObj){
    const sent = this.send(commandObj);
    if(sent){
      setTimeout(() => {
        if(isSensorConnected()){
          addMsg(`✅ Confirm: ESP32 se connection abhi bhi active hai — "${commandObj.action}" command chala gaya maan sakte hain.`, 'bot');
        } else {
          addMsg(`⚠️ Confirm fail: command bhejne ke baad connection cut gaya — pata nahi action hua ya nahi.`, 'bot');
        }
      }, 2000);
    }
    return sent;
  }
};

// ---------- PLANNING ENGINE (Phase 5) ----------
// Example: "Bottle uthao" → Detect bottle → Measure distance → Calculate
// position → Send command to ESP32 → Confirm action.
const PlanningEngine = {
  parseTargetObject(msg){
    const lower = msg.toLowerCase();
    for(const cls in cocoHindiNames){
      if(lower.includes(cls) || lower.includes(cocoHindiNames[cls].toLowerCase())) return cls;
    }
    return null;
  },
  locateObject(cls){
    if(typeof lastDetections === 'undefined' || !lastDetections || !lastDetections.length) return null;
    const matches = lastDetections.filter(d => d.class === cls);
    return matches.length ? matches.sort((a,b) => b.score - a.score)[0] : null;
  },
  calculatePosition(det, videoWidth){
    const [x,,w] = det.bbox;
    const centerX = x + w/2;
    const frameCenter = (videoWidth || 640) / 2;
    const offset = centerX - frameCenter;
    const threshold = (videoWidth || 640) * 0.12;
    const direction = offset > threshold ? 'right' : (offset < -threshold ? 'left' : 'center (seedhe saamne)');
    return { direction, offsetPx: Math.round(offset) };
  },
  buildPlan(cls, actionType){
    const det = this.locateObject(cls);
    const steps = [];
    if(!det){
      steps.push(`Detect ${hindiObjName(cls)}: nahi mila — camera me object dikh nahi raha abhi.`);
      return { success:false, steps };
    }
    const video = document.getElementById('visionVideo');
    const dist = estimateDistanceMeters(det.class, det.bbox[3]);
    const pos = this.calculatePosition(det, video ? video.videoWidth : 640);

    steps.push(`Detect ${hindiObjName(cls)}: mil gaya (confidence ${(det.score*100).toFixed(0)}%)`);
    steps.push(`Measure distance: ${dist != null ? '~'+dist+'m' : 'estimate nahi ho paayi'}`);
    steps.push(`Calculate position: object ${pos.direction} taraf hai (offset ${pos.offsetPx}px)`);

    const command = { action: actionType, target: cls, direction: pos.direction, distance_m: dist };
    const sent = HardwareCommander.sendAndConfirm(command);
    steps.push(sent ? 'Send command to ESP32: bhej diya ✅' : 'Send command to ESP32: fail — koi device (Bluetooth/WiFi/Serial) connect nahi hai ❌');

    return { success:sent, steps, command };
  },
  planPickup(cls){ return this.buildPlan(cls, 'move_and_pickup'); },
  planApproach(cls){ return this.buildPlan(cls, 'move_to'); }
};

const ResponseGenerator = {
  handle(msg){
    // Learned commands (Phase 6 long-term memory) take priority over everything —
    // if the user specifically taught "jab main bolu X toh Y bolna", honor it verbatim.
    const learned = MemoryManager.getLearnedCommand(msg.trim());
    if(learned) return learned.reply;

    // Object Finder: "bottle dhundo" / "find my phone" / "finder band karo" — chat se bhi
    // Vision AI + Object Finder ON ho jaata hai (voice wala hi logic, ObjectFinder.handle).
    const extrasReply = NancyExtras.handle(msg);
    if(extrasReply !== null) return extrasReply;
    const finderReply = ObjectFinder.handle(msg);
    if(finderReply !== null) return finderReply;

    const intent = IntentEngine.detect(msg);

    switch(intent.type){
      case 'math': {
        const result = tryMath(msg);
        if(result !== null) return `The answer is ${result}.`;
        break; // couldn't parse — let it fall through to personality
      }
      case 'remember_command': {
        const raw = (intent.match[1] || '').trim();
        const parts = raw.split(/\s+is\s+|\s+hai\s+/i);
        if(parts.length >= 2 && parts[0].trim() && parts[1].trim()){
          MemoryManager.remember(parts[0].trim(), parts.slice(1).join(' ').trim());
          return `Noted: "${parts[0].trim()}" = "${parts.slice(1).join(' ').trim()}". I will recall this when asked.`;
        }
        if(raw){
          MemoryManager.remember(raw, true);
          return `Understood, I have recorded: "${raw}".`;
        }
        break;
      }
      case 'recall_command': {
        const key = (intent.match[3] || '').trim();
        const fact = key ? MemoryManager.recall(key) : null;
        if(fact) return `Yes, I recall that. "${key}" — ${fact}.`;
        if(key) return `I do not have anything recorded about "${key}". You can teach me with 'remember X is Y'.`;
        break;
      }
      case 'knowledge_query': {
        const found = KnowledgeBase.search(msg);
        if(found) return `${found.answer} (Topic: ${found.topic}, ${found.category}). Is there anything else you would like to know?`;
        break; // no KB match — fall through
      }
      case 'knowledge_browse': {
        const cat = KnowledgeBase.matchCategory(msg);
        if(cat){
          const topics = KnowledgeBase.listTopics(cat);
          return `Under ${cat.toUpperCase()}, I have information on: ${topics.join(', ')}. Ask about any of these, for example "what is ${topics[0]}?"`;
        }
        const cats = KnowledgeBase.listCategories();
        return `My offline knowledge base covers these categories: ${cats.join(', ')}. Which category would you like to explore?`;
      }
      case 'name_set': {
        const m = intent.match;
        const name = (m[1] || m[2] || m[3] || m[4] || '').trim().split(' ')[0];
        if(name){
          MemoryManager.setName(name);
          return pick([
            `Understood, ${userName.value}. I will address you by this name from now on.`,
            `Thank you, ${userName.value}. Your name has been recorded for future reference.`
          ]);
        }
        break;
      }
      case 'name_ask': {
        return userName.value
          ? pick([`Your name is recorded as ${userName.value}.`, `You are ${userName.value}, as you told me earlier.`])
          : "I do not have your name on record yet. Please tell me, for example: 'My name is ___'.";
      }
      case 'language_set': {
        const m = intent.match;
        const lang = (m[1] || m[2] || m[3] || '').trim();
        if(lang){
          MemoryManager.setFavouriteLanguage(lang);
          return pick([
            `Understood, your preferred language is ${lang}. This has been recorded.`,
            `${lang} has been noted as your preferred language.`
          ]);
        }
        break;
      }
      case 'language_ask': {
        const lang = MemoryManager.getFavouriteLanguage();
        return lang
          ? `Your preferred language is recorded as ${lang}.`
          : "This has not been specified yet. Please tell me, for example: 'my preferred language is ___'.";
      }
      case 'teach_command': {
        const m = intent.match;
        const trigger = (m[1] || m[3] || '').trim();
        const reply = (m[2] || m[4] || '').trim();
        if(trigger && reply){
          MemoryManager.learnCommand(trigger, reply);
          return `Understood. Whenever you say "${trigger}", I will respond with "${reply}". This has been recorded.`;
        }
        break;
      }
      case 'recall_conversation': {
        const hist = MemoryManager.recentHistory(9).slice(0, -1); // drop the current message itself
        if(!hist.length) return "We have not had any prior conversation yet — this is our first exchange.";
        const lines = hist.slice(-6).map(h => `${h.who === 'bot' ? 'Assistant' : 'You'}: ${h.text}`).join('\n');
        return `Here is a summary of our recent conversation:\n${lines}`;
      }
      case 'recall_faces': {
        const names = MemoryManager.knownFaceNames();
        return names.length
          ? `I have learned to recognize the following individuals: ${names.join(', ')}.`
          : "I have not enrolled any faces yet. You can do so from ☰ → Face Intelligence.";
      }
      case 'recall_devices': {
        const devices = MemoryManager.deviceList();
        if(!devices.length) return "No devices have been connected that I have on record.";
        const list = devices.slice(-6).map(d => `${d.label} (${d.type})`).join(', ');
        return `The following devices are on record: ${list}.`;
      }
      case 'vision_object': {
        if(!objDepthStream && !visionStream) return "The camera is not active. Start the camera from ☰ → Vision AI and try again.";
        return buildObjectDetailsSpeech();
      }
      case 'vision_distance': {
        const nearest = PerceptionState.nearestObject();
        if(!nearest) return "Nothing is currently detected by the camera. Please turn on the camera from ☰ → Vision AI first.";
        return nearest.dist != null
          ? `${nearest.name} is approximately ${nearest.dist} meters away (camera-based estimate).`
          : `${nearest.name} is visible, but an exact distance could not be calculated — connect an ultrasonic sensor for a precise reading.`;
      }
      case 'vision_ocr': {
        const text = PerceptionState.lastOcrText();
        return text ? `The text that was read: "${text}"` : "No text has been scanned yet. Open ☰ → Smart OCR and start live camera, or say auto mode when a book is in view.";
      }
      case 'vision_face': {
        const faces = PerceptionState.facesSummary();
        if(!faces) return "No face is currently detected. Turn on the camera from ☰ → Face Intelligence.";
        const names = faces.map(f => f.name === 'Unknown' ? 'an unrecognized face' : f.name).join(', ');
        return `Currently visible: ${names}.`;
      }
      case 'vision_gesture': {
        const g = PerceptionState.lastGesture();
        return g ? `A "${g.label}" gesture was detected (${Math.round(g.score*100)}% confidence).` : "No gesture has been detected yet. Turn on the camera from ☰ → Gesture AI.";
      }
      case 'vision_pose': {
        const poses = PerceptionState.poseSummary();
        return poses && poses.length ? `Current body pose: ${poses.join(', ')}.` : "No pose is currently detected. Turn on the MoveNet camera from ☰ → Gesture AI.";
      }
      case 'sensor_status': {
        const report = SensorAnalyzer.fullReport();
        if(!report.connected) return report.text;
        if(report.allNormal) return "All sensors have been checked and readings are normal.";
        return "Please note: " + report.abnormal.map(a => a.text).join(' ') + " All other sensors are normal.";
      }
      case 'sensor_specific': {
        const key = SensorAnalyzer.sensorKeyFromText(msg);
        if(!key) break;
        if(!isSensorConnected()) return "No sensor or ESP32 is currently connected. Please connect one from ☰ → Hardware Hub first.";
        const r = SensorAnalyzer.interpret(key);
        return r.text + (r.status === 'high' || r.status === 'low' ? ' Please keep an eye on this.' : ' This reading is normal.');
      }
      case 'tinyml_query': {
        if(typeof lastTinyml === 'undefined' || !lastTinyml) return "No TinyML prediction has been received from the board yet. Check ☰ → AI Brain (TinyML Model tab).";
        const conf = lastTinyml.confidence != null ? ` (${Math.round(lastTinyml.confidence*100)}% confidence)` : '';
        return `The board's TinyML model reported: "${lastTinyml.label}"${conf}.`;
      }
      case 'reasoning_room_safety': {
        const r = ReasoningEngine.assessRoomSafety();
        const steps = r.checks.map(c => `• ${c.name} check: ${c.result.text}`).join('\n');
        return `${steps}\n\n${r.verdict}`;
      }
      case 'reasoning_health': {
        const r = ReasoningEngine.assessHealthStatus();
        const steps = r.parts.map(p => `• ${p.name}: ${p.result.text}`).join('\n');
        return `${steps}\n\n${r.verdict}`;
      }
      case 'planning_pickup': {
        const cls = PlanningEngine.parseTargetObject(msg);
        if(!cls) return "Please specify which object to pick up, for example: 'pick up the bottle'.";
        if(!isSensorConnected()) return "No ESP32 or controller is currently connected. Please connect one from ☰ → Hardware Hub before sending this command.";
        const plan = PlanningEngine.planPickup(cls);
        const stepsText = plan.steps.map((s,i) => `${i+1}. ${s}`).join('\n');
        return stepsText;
      }
      case 'planning_approach': {
        const cls = PlanningEngine.parseTargetObject(msg);
        if(!cls) return "Please specify what to approach, for example: 'go to the chair'.";
        if(!isSensorConnected()) return "No ESP32 or controller is currently connected. Please connect one from ☰ → Hardware Hub first.";
        const plan = PlanningEngine.planApproach(cls);
        const stepsText = plan.steps.map((s,i) => `${i+1}. ${s}`).join('\n');
        return stepsText;
      }
    }
    return null; // no confident pipeline answer — let personality rules handle it
  }
};

/* ---------- VOICE OUTPUT (fully offline — device's built-in voices) ---------- */
let chosenVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  if(!voices.length) return null;
  // Clarity-first scoring: Hindi/Indian voice + natural/neural/enhanced/Google + female + on-device
  // (on-device voices don't stutter / lag when network is weak).
  const score = v => {
    const id = v.lang + ' ' + v.name;
    let sc = 0;
    if(/hi[-_]IN|hindi|हिन्दी/i.test(id)) sc += 50;
    else if(/en[-_]IN/i.test(id)) sc += 35;
    if(/neural|natural|enhanced|premium|wavenet/i.test(v.name)) sc += 20;
    if(/google/i.test(v.name)) sc += 10;
    if(/female|zira|samantha|heera|neerja|swara|lekha|kalpana/i.test(v.name)) sc += 8;
    if(v.localService) sc += 5;
    return sc;
  };
  chosenVoice = voices.slice().sort((x, y) => score(y) - score(x))[0] || voices[0];
  return chosenVoice;
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
}
let voiceVolume = 1;

/* ---- Clear speech engine ----
   1) cleanSpeechText: emoji / symbols / "%" / "—" / "cm" TTS ko bigaadte hain — bolne se pehle saaf karta hai
   2) chunks: lambe text ko chhote sentences me todta hai (Chrome lambe text me beech me ruk jaata hai)
   3) rate thoda slow (0.92) + pitch normal = saaf aawaz
   4) speechBusy: baaki code (Vision narration) ko pata chalta hai ki bolna kab khatam hua */
let speechBusy = false;
let speechRunId = 0;
if('speechSynthesis' in window){
  const _nativeCancel = speechSynthesis.cancel.bind(speechSynthesis);
  speechSynthesis.cancel = function(){ speechRunId++; speechBusy = false; _nativeCancel(); };
}
function cleanSpeechText(t){
  return String(t == null ? '' : t)
    .replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, ' ')
    .replace(/(\d+)\s*%/g, '$1 percent')
    .replace(/(\d)\.(\d)/g, '$1 point $2')
    .replace(/(\d+)\s*cm\b/gi, '$1 centimeter')
    .replace(/[—–→←]/g, ', ')
    .replace(/[()\[\]{}"*_#~`|<>=+^\\\/]/g, ' ')
    .replace(/\bm\b(?=[\s.,]|$)/g, 'meter')
    .replace(/\s*,\s*,+/g, ', ')
    .replace(/\s+/g, ' ')
    .trim();
}
function splitSpeech(t){
  const parts = t.match(/[^.!?।\n]+[.!?।]?/g) || [t];
  const chunks = [];
  let cur = '';
  parts.forEach(p => {
    p = p.trim();
    if(!p) return;
    if((cur + ' ' + p).length > 140 && cur){ chunks.push(cur); cur = p; }
    else cur = cur ? cur + ' ' + p : p;
  });
  if(cur) chunks.push(cur);
  return chunks.length ? chunks : [t];
}
function usingAndroidTtsBridge(){
  try{ const v = speechSynthesis.getVoices()[0]; return !!v && v.voiceURI === 'android'; }catch(e){ return false; }
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  const clean = cleanSpeechText(text);
  if(!clean) return;
  speechSynthesis.cancel(); // pichhli aawaz band (speechRunId bhi badhta hai)
  const run = ++speechRunId;
  if(!chosenVoice) pickVoice();
  // Android bridge ek baar me poora text sambhalta hai — wahan chunking nahi
  const chunks = usingAndroidTtsBridge() ? [clean] : splitSpeech(clean);
  speechBusy = true;
  let i = 0;
  const next = () => {
    if(run !== speechRunId) return; // naya speak() ya cancel() aa gaya
    if(i >= chunks.length){ speechBusy = false; return; }
    const piece = chunks[i++];
    const utter = new SpeechSynthesisUtterance(piece);
    if(chosenVoice){ utter.voice = chosenVoice; if(chosenVoice.lang) utter.lang = chosenVoice.lang; }
    utter.pitch = 1.0;
    utter.rate = 0.92;
    utter.volume = voiceVolume;
    let fired = false, wd = null;
    const done = () => { if(fired) return; fired = true; clearTimeout(wd); setTimeout(next, 80); };
    utter.onend = done;
    utter.onerror = done;
    wd = setTimeout(done, Math.max(2000, piece.length * 130 + 1500)); // safety: engine end event na de to bhi aage badho
    speechSynthesis.speak(utter);
  };
  next();
}
// Bolna khatam hone tak ruko (max ~25s safety). Voice OFF ho to turant return.
async function waitForSpeechEnd(maxMs = 25000){
  const t0 = Date.now();
  await new Promise(r => setTimeout(r, 150)); // speak() ko start hone ka time
  while(speechBusy && Date.now() - t0 < maxMs) await new Promise(r => setTimeout(r, 100));
}

/* ---------- Text normalization ---------- */
// Fixes common mis-hearings/mis-typings (Hinglish spelling drift) BEFORE
// pattern matching runs, so "vishan ai", "objekt detection", "hardwear hub"
// etc. still land on the right command.
const SPELLING_FIXES = [
  [/\bvishan\b/g, 'vision'], [/\bvison\b/g, 'vision'], [/\bvisan\b/g, 'vision'],
  [/\bobjekt\b/g, 'object'], [/\bobjact\b/g, 'object'], [/\bobjeckt\b/g, 'object'],
  [/\bhardwear\b/g, 'hardware'], [/\bhard\s*ware\b/g, 'hardware'],
  [/\besp\s*32\b/g, 'esp32'], [/\bi\s*esp\s*32\b/g, 'esp32'], [/\besptoo\b/g, 'esp32'],
  [/\bblootooth\b/g, 'bluetooth'], [/\bbluteeth\b/g, 'bluetooth'], [/\bblue\s*tooth\b/g, 'bluetooth'],
  [/\bkontroller\b/g, 'controller'], [/\bcontrolar\b/g, 'controller'],
  [/\bfeis\b/g, 'face'], [/\bfase\b/g, 'face'],
  [/\bjesture\b/g, 'gesture'], [/\bgescher\b/g, 'gesture'],
  [/\bokr\b/g, 'ocr'], [/\boo\s*see\s*ar\b/g, 'ocr'],
  [/\bbraaeen\b/g, 'brain'], [/\bbren\b/g, 'brain'],
  [/\bsensar\b/g, 'sensor'], [/\bsensr\b/g, 'sensor'],
  [/\bskan\b/g, 'scan'], [/\bsuraunding[s]?\b/g, 'surroundings'],
  [/\bkaamera\b/g, 'camera'], [/\bkemra\b/g, 'camera'],
];

function normalizeVoiceText(t){
  let s = (t || '').toLowerCase().replace(/[.!?,]/g, ' ').replace(/\s+/g, ' ').trim();
  for(const [re, rep] of SPELLING_FIXES) s = s.replace(re, rep);
  return s;
}

/* ---------- Fuzzy matching (Levenshtein) ---------- */
// Used as a fallback when regex patterns don't hit — compares each word in
// what the user said against known command keywords and swaps in the closest
// one if it's a near-miss (handles typos/mishears the spelling-fix list
// doesn't cover).
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  const dp = Array.from({length:m+1}, (_,i)=>[i, ...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}
const VOICE_VOCAB = [
  'vision','ai','open','close','start','stop','camera','object','detection','detect',
  'face','recognition','gesture','ocr','read','text','brain','health','sensor','sensors','lcd','display',
  'memory','vault','knowledge','hardware','hub','connect','disconnect','esp32','bluetooth',
  'wifi','pair','controller','scan','surroundings','distance','temperature','heart','rate',
  'volume','brightness','forward','backward','left','right','turn','move','erase','reset',
  'settings','yes','no','stop','it','that','again'
];
function fuzzyFixWord(word){
  if(word.length < 3) return word;
  if(VOICE_VOCAB.includes(word)) return word;
  let best = word, bestDist = Infinity;
  for(const v of VOICE_VOCAB){
    const d = levenshtein(word, v);
    if(d < bestDist){ bestDist = d; best = v; }
  }
  // only swap for near-misses, so unrelated words (names, chit-chat) stay untouched
  const threshold = word.length <= 4 ? 1 : 2;
  return bestDist <= threshold ? best : word;
}
function fuzzyNormalize(text){
  return text.split(' ').map(fuzzyFixWord).join(' ');
}

/* ---------- Parameter extraction ---------- */
// Pulls numeric values + units out of a command: "brightness 70%",
// "volume 40", "move forward 2 meters", "turn left 90 degrees".
function extractParams(text){
  const params = {};
  let m;
  if((m = text.match(/(\d+)\s*%|\b(\d+)\s*percent/))) params.percent = parseInt(m[1] || m[2], 10);
  if((m = text.match(/(\d+(?:\.\d+)?)\s*(meter|meters|metre|metres|m\b)/))) params.meters = parseFloat(m[1]);
  if((m = text.match(/(\d+(?:\.\d+)?)\s*(degree|degrees|deg)/))) params.degrees = parseFloat(m[1]);
  if((m = text.match(/\b(left|right|forward|backward|aage|peeche|seedha|dayan|baayan)\b/))) params.direction = m[1];
  if(params.percent === undefined && (m = text.match(/\b(volume|brightness)\s+(?:to\s+)?(\d+)\b/))) params.percent = parseInt(m[2], 10);
  if((m = text.match(/^(?:move|chalo|badho)\s+(forward|backward|aage|peeche)/))) params.direction = params.direction || m[1];
  return params;
}

/* ---------- Multi-step splitting ---------- */
// "Open Vision AI and start object detection" / "Connect ESP32 then show
// sensors" / "Start camera, recognize faces, then read text." → array of steps.
function splitVoiceSteps(text){
  return text
    .split(/\b(?:and then|then|and|uske baad|phir|fir|us ke baad)\b|,/)
    .map(s => s.trim())
    .filter(Boolean);
}

function isYes(text){ return /^(yes|haan|ha|han|ok|okay|kar do|confirm|sahi hai)$/.test(text); }
